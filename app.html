                    <div className={"text-xs mt-1 " + (retryInfo ? "text-amber-600" : "text-emerald-600")}>{busyText || '查詢中，請稍候…'}</div>
                  </div>
                )}
                {loadWarn && (
                  <div className="bg-amber-50 border border-amber-300 text-amber-800 rounded-xl p-3 text-sm">
                    <div className="font-semibold">⚠ 有月份沒有讀到，下方的筆數與統計不完整</div>
                    <div className="text-xs mt-1">{loadWarn}</div>
                    <button onClick={() => loadRecords()} className="mt-2 px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs">重新查詢</button>
                  </div>
                )}
                <div className="grid grid-cols-3 gap-3">
                  <div className="bg-white rounded-xl shadow-sm p-4 text-center"><div className="text-xs text-slate-500">執行店數</div><div className="text-3xl font-extrabold text-emerald-600">{filtered.length}</div></div>
                  <div className="bg-white rounded-xl shadow-sm p-4 text-center"><div className="text-xs text-slate-500">平均得分</div><div className="text-3xl font-extrabold text-slate-700">{filtered.length ? Math.round(filtered.reduce((s, r) => s + r.total, 0) / filtered.length) : '—'}</div></div>
                  <div className="bg-white rounded-xl shadow-sm p-4 text-center"><div className="text-xs text-slate-500">合格率</div><div className="text-3xl font-extrabold text-blue-600">{filtered.length ? Math.round(filtered.filter(r => r.total >= PASS_SCORE).length / filtered.length * 100) : 0}%</div></div>
                </div>
                <div className="bg-white rounded-xl shadow-sm overflow-hidden">
                  <table className="w-full text-sm">
                    <thead><tr className="text-left text-slate-500 border-b bg-slate-50"><th className="py-2 px-3">日期</th><th>店鋪</th><th>課別</th><th>點檢人員</th><th>得分</th></tr></thead>
                    <tbody>{filtered.map(r => <tr key={r.id} className="border-b border-slate-100"><td className="py-2 px-3 text-slate-500">{r.date}</td><td className="font-medium text-slate-800">{r.store}</td><td className="text-slate-500">{r.section}</td><td className="text-slate-500">{r.staff}</td><td className={"font-bold " + (r.total < PASS_SCORE ? "text-red-600" : "")}>{r.total}</td></tr>)}</tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ========== 維護專區 ========== */}
            {tab === 'maintain' && <MaintainPanel configured={CONFIGURED} curMonth={workMonth} onReload={reloadBoot} />}
          </div>

          {/* 外島交通費輸入（產出請款金額前；系統無此資料來源，需人工輸入，沒有就留空） */}
          {billingAsk && (
            <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={e => { if (e.target === e.currentTarget) setBillingAsk(null); }}>
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[85vh] flex flex-col">
                <div className="px-5 py-3 border-b">
                  <h3 className="font-bold text-slate-700">🚢 外島交通費（選填）</h3>
                  <p className="text-xs text-slate-500 mt-1">系統沒有這筆資料來源，請依實際狀況輸入金額；沒有就留空。金額會計入該課的請款小計。</p>
                </div>
                <div className="p-5 overflow-y-auto space-y-2 text-sm">
                  {billingAsk.sections.map(s => (
                    <div key={s.dept + '/' + s.section} className="flex items-center gap-2">
                      <label className="w-40 text-slate-600 shrink-0">{s.dept} / {s.section}</label>
                      <input type="number" min="0" step="1" placeholder="0"
                        value={billingAsk.offshore[s.section] || ''}
                        onChange={e => setBillingAsk({ ...billingAsk, offshore: { ...billingAsk.offshore, [s.section]: e.target.value } })}
                        className="flex-1 px-3 py-2 border border-slate-300 rounded-lg" />
                      <span className="text-slate-400 text-xs">元</span>
                    </div>
                  ))}
                </div>
                <div className="px-5 py-3 border-t flex justify-end gap-2">
                  <button onClick={() => setBillingAsk(null)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg">取消</button>
                  <button onClick={finishBilling} className="px-5 py-2 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-lg">產出請款單</button>
                </div>
              </div>
            </div>
          )}

          {/* 底部總分（僅點檢作業） */}
          {tab === 'work' && readyToWork && (
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t shadow-2xl z-30">
              {/* 送出/更新中的進度條（後端寫入需數秒，避免使用者以為沒反應而重複點擊） */}
              {submitting && (
                <div className="h-1 w-full bg-slate-200 overflow-hidden">
                  <div className="h-full w-1/3 bg-emerald-500" style={{ animation: 'sqc-progress 1s ease-in-out infinite' }} />
                </div>
              )}
              <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                <div><div className="text-xs text-slate-400">{submitting ? <span className="text-emerald-600 font-semibold">{editingRecordId ? '更新中，請稍候…' : '送出中，請稍候…'}</span> : `合計得分（及格 ${PASS_SCORE}）`}</div>
                  <div className="flex items-baseline gap-2"><span className="text-3xl font-extrabold text-slate-800">{total}</span><span className="text-slate-400">/ {TOTAL_MAX}</span><span className={"ml-2 font-bold " + grade.c}>{grade.txt}</span>{noDeductDefect && canPhoto && <span className="ml-1 text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded">需拍滿分照片</span>}</div></div>
                <div className="flex gap-2">
                  {editingRecordId && <button onClick={() => { if (confirm('確定要放棄這次編輯的變更嗎？')) { resetWork(); setTab('records'); } }} disabled={submitting} className="px-5 py-3 bg-slate-200 hover:bg-slate-300 disabled:opacity-50 text-slate-700 font-bold rounded-xl">返回</button>}
                  <button onClick={submit} disabled={submitting} className="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-lg">{submitting ? '處理中…' : (editingRecordId ? '完成編輯' : '送出評核')}</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // 維護專區
    // ============================================================
    // 官方評核表(原始表單版面) → 結構化題庫列。非官方表回傳 null。
    function officialFormToRows(aoa) {
      if (!aoa || aoa.length < 2) return null;
      const head = (aoa[0] || []).map(x => String(x || ''));
      const isForm = head.some(h => h.indexOf('評核內容與規範') >= 0) && head.some(h => h.indexOf('分數') >= 0);
      if (!isForm) return null;
      const clean = s => String(s == null ? '' : s).replace(/[\r\n]+/g, '').trim();
      const halves = [{ c: 0, n: 1, s: 2, sc: 6 }, { c: 8, n: 9, s: 10, sc: 14 }];
      const items = [];
      halves.forEach(h => {
        let curCat = '', last = null;
        for (let i = 1; i < aoa.length; i++) {
          const row = aoa[i] || [];
          const catRaw = clean(row[h.c]);
          if (catRaw) curCat = catRaw.replace(/共\s*\d+\s*分$/, '');
          const name = clean(row[h.n]);
          const rawScore = row[h.sc];
          const spec = String(row[h.s] == null ? '' : row[h.s]).replace(/\r/g, '');
          const isObs = String(rawScore).indexOf('--') >= 0;
          if (name) {
            if (isObs) { last = null; continue; } // 觀察題略過（另於觀察區維護）
            const num = (name.match(/^(\d+)/) || [])[1] || '';
            const m = spec.match(/每項\s*(\d+)\s*分/);
            let method = '合格0分', per = '', subs = '';
            if (m) {
              method = '分區扣分'; per = m[1];
              const lines = spec.split('\n');
              const startIdx = lines.findIndex(l => l.indexOf('/') >= 0);
              if (startIdx >= 0) {
                let listStr = lines.slice(startIdx).join('').replace(/[（(]每項[\s\S]*$/, ''); // 合併換行的清單、去掉(每項…)註記
                let parts = listStr.split('/').map(x => x.replace(/_+/g, '').trim()).filter(Boolean);
                /**
                 * 「其他…」子項一律轉成填寫型。
                 *
                 * 官方表只寫一個「其他貨架」或「其他」，但一家店可能有好幾個貨架、
                 * 好幾台機器有缺失，每一個都要各自扣分 —— 所以要讓點檢人員填名稱，
                 * 填幾個就算幾個缺失（10~12 題的「其他貨架」用的就是這個原則）。
                 * 原本只硬編了「其他貨架」，第13題的「其他」會被當成單一子項，
                 * 不管實際有幾台機器都只扣一次，與文件記載的 `其他:填寫` 對不上。
                 *
                 * 第13題官方表寫的是一個沒有主詞的「其他」：這兩個字放進報表的缺失欄
                 * 看不出指的是什麼，而它實際上就是 FF 區的其他機台，所以一併正名。
                 */
                const OTHER_RENAME = { '13': '其他機台' };   // 題號 → 該題的「其他」要正名成什麼
                parts = parts.map(p => {
                  if (!/^其他/.test(p)) return p;
                  return ((p === '其他' && OTHER_RENAME[num]) || p) + ':填寫';
                });
                subs = parts.join('|');
              }
            }
            const score = (typeof rawScore === 'number') ? rawScore : (parseFloat(rawScore) || 0);
            const letter = curCat.indexOf('商品') >= 0 ? 'B' : (curCat.indexOf('客用') >= 0 ? 'C' : 'A');
            const baseLabel = name.replace(/^\d+\.?/, '');
            const splitNum = (num === '15' || num === '16') ? num : null;
            if (splitNum) {
              // 15/16 題官方表為兩行合計；改拆成 15-1/15-2、16-1/16-2 兩題(各自合格0分)
              last = { 排序: items.length + 1, 編號: letter + num + '-1', 大分類: curCat, 題號名稱: num + '-1.' + baseLabel, 配分: score, 計分方式: '合格0分', 每項扣分: '', 子項清單: '', 規範說明: spec.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim(), __splitBase: letter + num, __splitLabel: baseLabel, __splitIdx: 1 };
            } else {
              last = { 排序: items.length + 1, 編號: letter + num, 大分類: curCat, 題號名稱: name, 配分: score, 計分方式: method, 每項扣分: per, 子項清單: subs, 規範說明: spec.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim() };
            }
            items.push(last);
          } else if (last && rawScore !== '' && !isObs) {
            const add = (typeof rawScore === 'number') ? rawScore : (parseFloat(rawScore) || 0);
            if (!add) { /* no-op */ }
            else if (last.__splitBase) {
              // 15/16 的第二行：獨立成一題(-2)，不併入上一題配分
              const idx = last.__splitIdx + 1;
              const num2 = last.__splitBase.slice(1);
              const next = { 排序: items.length + 1, 編號: last.__splitBase + '-' + idx, 大分類: last.大分類, 題號名稱: num2 + '-' + idx + '.' + last.__splitLabel, 配分: add, 計分方式: '合格0分', 每項扣分: '', 子項清單: '', 規範說明: spec.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim(), __splitBase: last.__splitBase, __splitLabel: last.__splitLabel, __splitIdx: idx };
              items.push(next);
              last = next;
            } else {
              last.配分 = Number(last.配分) + add; // 其他題目維持子列加總（如有）
            }
          }
        }
      });
      if (!items.length) return null;
      // 17.垃圾桶：官方表為單一合格題，改為分區扣分並列出區域(FF區/休息區)
      items.forEach(it => {
        if (/^17\./.test(it.題號名稱)) {
          it.計分方式 = '分區扣分';
          it.每項扣分 = String(it.配分);
          it.子項清單 = 'FF區垃圾桶|休息區垃圾桶';
        }
        delete it.__splitBase; delete it.__splitLabel; delete it.__splitIdx;
      });
      items.sort((a, b) => (parseInt(a.題號名稱) || 0) - (parseInt(b.題號名稱) || 0));
      items.forEach((it, i) => it.排序 = i + 1);
      return items;
    }

    // 名單檔右側常附一張兩欄小表：「梯次 / 評核日期區間」（每月不同），例如
    //   第一梯  8/1-8/15
    //   第二梯  8/16-8/31
    // 有了期間，報表才能用「實際點檢日期」反推實際梯次，而不是照抄預排。
    function rosterBatchPeriods(sheets) {
      const clean = (v) => String(v == null ? '' : v).replace(/[\r\n\s]/g, '').trim();
      const isRange = (v) => /^\s*\d{1,2}[\/\-.]\d{1,2}\s*[~\-—–]\s*\d{1,2}[\/\-.]\d{1,2}\s*$/.test(String(v == null ? '' : v));
      for (const sh of (sheets || [])) {
        const aoa = sh.aoa || [];
        // 表頭不一定在第一列（官方名單常有標題列），掃前 15 列找「評核日期區間」
        for (let h = 0; h < Math.min(15, aoa.length); h++) {
          const head = (aoa[h] || []).map(clean);
          const rangeIdx = head.findIndex(x => x.indexOf('評核日期區間') >= 0 || x.indexOf('日期區間') >= 0);
          if (rangeIdx < 0) continue;
          let nameIdx = head.findIndex((x, i) => i < rangeIdx && x === '梯次');
          if (nameIdx < 0) nameIdx = rangeIdx - 1;
          const out = [];
          for (let i = h + 1; i < aoa.length; i++) {
            const r = aoa[i] || [];
            const name = String(r[nameIdx] == null ? '' : r[nameIdx]).trim();
            const range = String(r[rangeIdx] == null ? '' : r[rangeIdx]).trim();
            if (name && range) out.push({ 梯次: name, 區間: range });
          }
          if (out.length) return out;
        }
        // 沒有表頭時的退路：整張表找「梯次名稱 + 日期區間」相鄰的兩格
        const out2 = [];
        for (let i = 0; i < aoa.length; i++) {
          const r = aoa[i] || [];
          for (let j = 1; j < r.length; j++) {
            if (isRange(r[j]) && String(r[j - 1] || '').trim()) {
              out2.push({ 梯次: String(r[j - 1]).trim(), 區間: String(r[j]).trim() });
              break;
            }
          }
        }
        if (out2.length) return out2;
      }
      return null;
    }

    // 官方委外名單(多分頁) → 標準店鋪名單列。找含「店號＋主責課」的分頁；非此格式回 null。
    function rosterToRows(sheets) {
      if (!sheets || !sheets.length) return null;
      const clean = s => String(s == null ? '' : s).replace(/[\r\n\s]/g, '').trim();
      const isMark = v => { const s = String(v == null ? '' : v).trim().toUpperCase(); return s === 'V' || s === '是' || s === '1' || s === 'Y'; };
      for (const sh of sheets) {
        const head = (sh.aoa[0] || []).map(clean);
        const codeIdx = head.indexOf('店號');
        const nameIdx = head.indexOf('店名');
        let sectIdx = head.findIndex(h => h.indexOf('主責課') >= 0);
        if (sectIdx < 0) {
          // 部分名單格式「主責部」「主責課」欄名可能因窄欄被視覺換行成單純「主責」，取最後一個「主責」欄當課別
          const respIdx = head.map((h, i) => ({ h, i })).filter(x => x.h.indexOf('主責') >= 0);
          if (respIdx.length) sectIdx = respIdx[respIdx.length - 1].i;
        }
        if (codeIdx < 0 || sectIdx < 0) continue; // 不是名單資料頁
        const followIdx = head.findIndex(h => h.indexOf('隨盤') >= 0);
        const remoteIdx = head.indexOf('遠程店');
        const holidayIdx = head.indexOf('假日店');
        const batchIdx = head.indexOf('預排梯次') >= 0 ? head.indexOf('預排梯次') : head.indexOf('梯次');
        const rows = [];
        for (let i = 1; i < sh.aoa.length; i++) {
          const r = sh.aoa[i] || [];
          const code = String(r[codeIdx] == null ? '' : r[codeIdx]).trim();
          if (!code) continue;
          const follow = followIdx >= 0 ? isMark(r[followIdx]) : false;
          rows.push({
            店號: code, 店名: String(r[nameIdx] || '').trim(), 課別: String(r[sectIdx] || '').trim(),
            店鋪型態: follow ? '隨盤點點檢店' : '一般店',
            遠程店: remoteIdx >= 0 && isMark(r[remoteIdx]) ? '是' : '否',
            假日店: holidayIdx >= 0 && isMark(r[holidayIdx]) ? '是' : '否',
            預排梯次: batchIdx >= 0 ? String(r[batchIdx] || '').trim() : '',
          });
        }
        if (rows.length) return rows;
      }
      return null;
    }

    // 各資料區欄位定義（key＝主鍵中文欄名；fields＝表單欄位；cols＝列表顯示欄）
    const MAINT_AREAS = [
      { kind: 'items', importKind: 'checklist', label: '點檢題目', monthly: true, key: '編號',
        note: '分月轉入；子項清單用 | 分隔，可填寫用 :填寫、多單位用 :2（如 OC|WI|其他貨架:填寫）',
        cols: ['編號', '大分類', '題號名稱', '配分', '計分方式'],
        fields: [{ k: '排序', t: 'number' }, { k: '編號', t: 'text' }, { k: '大分類', t: 'text' }, { k: '題號名稱', t: 'text' }, { k: '配分', t: 'number' }, { k: '計分方式', t: 'select', opts: ['合格0分', '分區扣分'] }, { k: '每項扣分', t: 'number' }, { k: '子項清單', t: 'text', ph: 'OC|WI|其他貨架:填寫' }, { k: '規範說明', t: 'text' }] },
      { kind: 'obs', importKind: 'obs', label: '觀察區題目', monthly: true, key: '編號',
        note: '三型：拍照題／有無題／符合題。顯示條件：always＝一律顯示、has＝前面「有無題」選「有」才顯示、hasOrClosed＝選「有或廁所封閉」才顯示',
        cols: ['編號', '類型', '題目名稱', '選項'],
        fields: [{ k: '排序', t: 'number' }, { k: '編號', t: 'text' }, { k: '類型', t: 'select', opts: ['拍照', '有無', '符合'] }, { k: '題目名稱', t: 'text' }, { k: '選項', t: 'text', ph: '有|無|廁所封閉' }, { k: '顯示條件', t: 'select', opts: ['always', 'has', 'hasOrClosed'] }, { k: '必填', t: 'select', opts: ['否', '是'] }] },
      { kind: 'roster', importKind: 'roster', label: '店鋪名單', monthly: true, key: '店號',
        note: '分月轉入；課別＝盤點主責課；可直接匯入官方委外名單或查核店鋪名單(自動轉)。店號請設文字格式避免掉 0',
        cols: ['店號', '店名', '課別', '店鋪型態', '遠程店', '假日店', '預排梯次'],
        fields: [{ k: '店號', t: 'text' }, { k: '店名', t: 'text' }, { k: '課別', t: 'text' }, { k: '店鋪型態', t: 'select', opts: ['一般店', '隨盤點點檢店'] },
          { k: '遠程店', t: 'select', opts: ['否', '是'] }, { k: '假日店', t: 'select', opts: ['否', '是'] }, { k: '預排梯次', t: 'text', ph: '第一梯' }] },
      { kind: 'stores', importKind: 'stores', label: '店鋪主檔', monthly: false, key: '店號',
        note: '全門市主檔（常駐；可直接匯入官方「店庫」總表，店號請設文字格式）',
        cols: ['店號', '店名', '營業課名稱', '縣市', '鄉鎮'],
        fields: [{ k: '序號', t: 'text' }, { k: '店號', t: 'text' }, { k: '店名', t: 'text' }, { k: '營業本部名稱', t: 'text' }, { k: '營業部名稱', t: 'text' }, { k: '營業課名稱', t: 'text' }, { k: '營業擔當', t: 'text' }, { k: '縣市', t: 'text' }, { k: '鄉鎮', t: 'text' }, { k: '地址', t: 'text' }] },
      { kind: 'staffs', importKind: 'staff', label: '點檢人員', monthly: false, key: '工號',
        note: '常駐；管理者需填 AD帳號 與 角色=管理者。基本資料的點檢人員下拉只帶「有填部別或課別」的人',
        cols: ['姓名', '部別', '課別', '職稱', '角色'],
        fields: [{ k: '部別', t: 'text' }, { k: '課別', t: 'text' }, { k: '工號', t: 'text' }, { k: '姓名', t: 'text' }, { k: '職稱', t: 'text' }, { k: 'AD帳號', t: 'text' }, { k: '角色', t: 'select', opts: ['點檢員', '管理者'] }] },
    ];

    // 店鋪名單的「總店數x店(一般店x店，隨盤點點檢店x店)」
    //   數字由後端以全部資料計算（前端只拿到前800筆，自己數會少算）；
    //   型態順序固定先列已定義的兩種，其餘（含未填）依數量排在後面，不隱藏任何型態。
    const STORE_TYPE_ORDER = ['一般店', '隨盤點點檢店'];
    function storeCountText(total, byType) {
      if (!byType) return '';
      const keys = Object.keys(byType).sort((a, b) => {
        const ia = STORE_TYPE_ORDER.indexOf(a), ib = STORE_TYPE_ORDER.indexOf(b);
        if (ia >= 0 || ib >= 0) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
        return byType[b] - byType[a];
      });
      const parts = keys.map(k => k + byType[k] + '店');
      return '總店數' + total + '店' + (parts.length ? '（' + parts.join('，') + '）' : '');
    }

    function MaintainPanel({ configured, curMonth, onReload }) {
      const [sub, setSub] = useState('items');
      const [month, setMonth] = useState(curMonth);
      const [rows, setRows] = useState([]);
      const [rowsMeta, setRowsMeta] = useState({ total: 0, truncated: false, byType: null });
      const [editing, setEditing] = useState(null);
      const [uploaded, setUploaded] = useState({});
      const [logRows, setLogRows] = useState([]);
      const [loading, setLoading] = useState(false);
      const [loadErr, setLoadErr] = useState('');
      const isLog = sub === 'log';
      const area = MAINT_AREAS.find(a => a.kind === sub);
      // 照片連結修復（獨立於各分頁，自己一個月份選單）
      const [repairMonth, setRepairMonth] = useState(curMonth);
      const [repairing, setRepairing] = useState(false);
      const [repairMsg, setRepairMsg] = useState('');
      const runRepair = async (write) => {
        if (write && !confirm(`確定要修復 ${monthFolderOf(repairMonth)} 的照片連結？\n會直接寫入點檢紀錄的「照片JSON」，並把補回來的照片設為「知道連結就能看」。`)) return;
        setRepairing(true); setRepairMsg('');
        try {
          // 後端一次最多處理 40 筆紀錄（避免 Apps Script 6 分鐘逾時），這裡自動接續跑完
          let filled = 0, missing = 0, scanned = 0, paperFixed = 0, shared = 0, rounds = 0;
          const lines = [];
          while (rounds < 30) {
            rounds++;
            const r = await SqcApi.repairPhotoLinks(repairMonth, write);
            if (r.error) { setRepairMsg('⚠ ' + r.error); return; }
            filled += r.filled || 0; missing += r.missing || 0; scanned = r.scannedRows || scanned;
            paperFixed += r.paperFixed || 0; shared += r.shared || 0;
            // 明細要留得夠多：「找不到檔案」那幾行排在後面，砍太早會看不到要找誰重拍
            (r.detail || []).forEach(d => { if (lines.length < 80) lines.push(d); });
            if (!write || !(r.touchedRows || 0)) break;   // 試算不必重跑；寫入到沒東西可補就結束
          }
          setRepairMsg([
            (write ? '✅ 已修復' : '（僅試算，未寫入）') + `　月份 ${monthFolderOf(repairMonth)}`,
            `檢查紀錄 ${scanned} 筆｜補回連結 ${filled} 張｜Drive 找不到對應檔案 ${missing} 張`,
            paperFixed ? `紙本照片欄修正 ${paperFixed} 筆` : '',
            write && shared ? `已設為「知道連結就能看」${shared} 張` : '',
            missing ? '※ 找不到的通常是當時根本沒上傳成功，需請點檢人員重新上傳該張照片。' : '',
            !filled && !missing ? '所有照片都已經有連結，不需修復。' : '',
            lines.length ? '\n' + lines.join('\n') : '',
          ].filter(Boolean).join('\n'));
          if (write && filled) onReload();
        } catch (e) { setRepairMsg('⚠ 修復失敗：' + e.message); }
        finally { setRepairing(false); }
      };

      // 分數重算：修正「存下來的合計與明細對不起來」的紀錄（分區扣分題非同步寫回造成）
      const [scoreMonth, setScoreMonth] = useState(curMonth);
      const [scoring, setScoring] = useState(false);
      const [scoreMsg, setScoreMsg] = useState('');
      const runRecompute = async (write) => {
        if (write && !confirm(`確定要重算 ${monthFolderOf(scoreMonth)} 的分數？\n會直接寫入點檢紀錄的「合計得分」「等第」「明細JSON」。\n建議先按「先試算」看清單再決定。`)) return;
        setScoring(true); setScoreMsg('');
        try {
          const r = await SqcApi.recomputeScores(scoreMonth, write);
          if (r.error) { setScoreMsg('⚠ ' + r.error); return; }
          const lines = [
            (write ? '✅ 已寫入' : '（僅試算，未寫入）') + `　月份 ${monthFolderOf(scoreMonth)}`,
            `掃描 ${r.scanned} 筆｜分數不一致 ${r.changed} 筆` + (write ? `｜已更新 ${r.written} 筆` : ''),
            r.truncated ? '※ 已達單次上限，請再按一次接續。' : '',
            !r.changed ? '所有紀錄的合計與明細都一致，不需重算。' : '',
            (r.detail || []).length ? '\n【分數不一致的紀錄】\n' + r.detail.slice(0, 60).join('\n') : '',
            (r.hiddenWarn || []).length
              ? '\n【有填名稱但沒勾選】報表原本會把它列成缺失、分數卻沒扣到；該保險已移除，這些紀錄的報表內容會改變：\n'
              + r.hiddenWarn.slice(0, 30).join('\n') : '',
            (r.spaceWarn || []).length
              ? '\n【填寫的名稱含空白】重算沿用舊規則（空白算分隔符）。新版已改為不把空白當分隔符，'
              + '所以這幾筆的「當初語意」需要人工確認是「兩個貨架」還是「一個含空格的名稱」：\n'
              + r.spaceWarn.slice(0, 30).join('\n') : '',
          ].filter(Boolean);
          setScoreMsg(lines.join('\n'));
          if (write && r.written) onReload();
        } catch (e) { setScoreMsg('⚠ 重算失敗：' + e.message); }
        finally { setScoring(false); }
      };

      // 請求序號防呆：分頁切換太快時，較早但較慢回來的請求不可覆蓋較新分頁的資料
      const reqSeq = useRef(0);
      const load = () => {
        const myReq = ++reqSeq.current;
        setLoading(true); setLoadErr('');
        if (!configured) { setRows([]); setLogRows([]); setLoading(false); return; }
        const done = () => { if (myReq === reqSeq.current) setLoading(false); };
        if (isLog) {
          SqcApi.getChangeLog(300)
            .then(r => { if (myReq === reqSeq.current) setLogRows(r.rows || []); })
            .catch(e => { if (myReq === reqSeq.current) { setLogRows([]); setLoadErr(e.message); } })
            .finally(done);
          return;
        }
        SqcApi.getMaster(area.importKind, month)
          .then(r => { if (myReq === reqSeq.current) { setRows(r.rows || []); setRowsMeta({ total: r.total || (r.rows || []).length, truncated: !!r.truncated, byType: r.byType || null }); } })
          .catch(e => { if (myReq === reqSeq.current) { setRows([]); setLoadErr(e.message); } })
          .finally(done);
      };
      useEffect(() => { setEditing(null); load(); }, [sub, month]);

      const parseFile = (file) => ensureLib('XLSX').then(() => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const wb = XLSX.read(ev.target.result, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            resolve({
              json: XLSX.utils.sheet_to_json(ws, { defval: '' }),
              aoa: XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }),
              sheets: wb.SheetNames.map(n => ({ name: n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' }) })),
            });
          } catch (err) { reject(err); }
        };
        reader.onerror = reject;
        reader.readAsArrayBuffer(file);
      }));

      const [uploading, setUploading] = useState(false);
      const onUpload = async (e) => {
        const f = e.target.files[0]; e.target.value = ''; if (!f) return;
        if (!configured) { alert('尚未連線後端，無法匯入'); return; }
        setUploading(true);
        try {
          const parsed = await parseFile(f);
          let data = parsed.json, convMsg = '';
          // 點檢題目：官方評核表版面自動轉題庫
          if (sub === 'items') {
            const c = officialFormToRows(parsed.aoa);
            if (c) { data = c; convMsg = '\n（偵測到官方評核表，已自動轉題庫；13題機台等客製子項請單筆補上）'; }
          }
          // 店鋪名單：官方委外名單(多分頁)自動轉（主責課→課別、隨盤點→店鋪型態）
          let batches = null;
          if (sub === 'roster') {
            const c = rosterToRows(parsed.sheets);
            if (c) { data = c; convMsg = '\n（偵測到官方委外名單，已自動轉：主責課→課別、隨盤點→店鋪型態）'; }
            batches = rosterBatchPeriods(parsed.sheets);
            if (!batches) {
              convMsg += '\n⚠ 未在檔案中找到「梯次／評核日期區間」小表 → 梯次仍會沿用名單的預排值，'
                + '報表的「實際點檢梯次」不會依實際日期判定。請確認名單檔右側有這兩欄。';
            }
          }
          const r = await SqcApi.importMaster(area.importKind, month, data, f.name, batches);
          // 梯次期間必須看「後端回報實際存了幾筆」，不能只報前端解析到幾筆 ——
          // 舊版後端沒有這段程式，會安靜地把 batches 丟掉，訊息卻顯示成功，
          // 使用者就會誤以為梯次已生效（實際梯次仍是空的）。
          if (batches) {
            const saved = r.batchCount;
            convMsg += saved === undefined
              ? '\n⚠ 梯次期間沒有轉入：後端版本過舊（不支援梯次期間），請重新部署後端 Apps Script 後再匯入一次。'
              : saved > 0
                ? '\n（同時轉入梯次期間 ' + saved + ' 筆：' + batches.map(b => b.梯次 + ' ' + b.區間).join('、') + '）'
                : '\n⚠ 梯次期間解析到 ' + batches.length + ' 筆但後端存下 0 筆，請檢查區間格式（需為 8/1-8/15 這種寫法）。';
          }
          setUploaded({ ...uploaded, [sub]: f.name });
          load(); await onReload();
          alert(`✅ 已匯入「${f.name}」${r.count} 筆（同名覆蓋，以最新為主）` + convMsg);
        } catch (err) { alert('匯入失敗：' + err.message); }
        finally { setUploading(false); }
      };

      const blank = () => { const o = {}; area.fields.forEach(f => o[f.k] = (f.k === '排序') ? (rows.length + 1) : (f.t === 'select' ? f.opts[0] : '')); return o; };
      const save = async () => {
        if (!String(editing[area.key])) { alert(`「${area.key}」必填`); return; }
        if (!configured) { alert('尚未連線後端，無法儲存'); setEditing(null); return; }
        try { await SqcApi.upsertRow(area.importKind, month, editing); setEditing(null); load(); await onReload(); alert('✅ 已儲存'); }
        catch (e) { alert('儲存失敗：' + e.message); }
      };
      const remove = async (id) => {
        if (!confirm('確定刪除此筆？')) return;
        if (!configured) { alert('尚未連線後端，無法刪除'); return; }
        try { await SqcApi.deleteRow(area.importKind, month, id); load(); await onReload(); } catch (e) { alert('刪除失敗：' + e.message); }
      };

      const isEdit = !isLog && editing && rows.some(r => String(r[area.key]) === String(editing[area.key]) && String(editing[area.key]) !== '');

      return (
        <div className="space-y-4">
          <div className="bg-white rounded-xl shadow-sm p-2 flex flex-wrap gap-1">
            {MAINT_AREAS.map(a => <button key={a.kind} onClick={() => setSub(a.kind)} className={"px-3 py-1.5 text-sm rounded-lg " + (sub === a.kind ? "bg-emerald-600 text-white" : "text-slate-600 hover:bg-slate-100")}>{a.label}{a.monthly ? '（分月）' : ''}</button>)}
            <button onClick={() => setSub('log')} className={"px-3 py-1.5 text-sm rounded-lg " + (isLog ? "bg-emerald-600 text-white" : "text-slate-600 hover:bg-slate-100")}>📜 異動紀錄</button>
          </div>

          {(loading || uploading) && (
            <div className="h-1 w-full bg-slate-200 rounded-full overflow-hidden">
              <div className="h-full w-1/3 bg-emerald-500 rounded-full" style={{ animation: 'sqc-progress 1s ease-in-out infinite' }} />
            </div>
          )}
          {uploading && <div className="text-xs text-emerald-600">資料處理中，請稍候…</div>}
          {loadErr && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2 flex justify-between items-center"><span>載入失敗：{loadErr}</span><button onClick={load} className="text-xs bg-red-600 text-white px-2 py-1 rounded">重試</button></div>}

          {isLog && (
            <div className="bg-white rounded-xl shadow-sm p-5">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-bold text-slate-700">📜 異動紀錄</h3>
                <button onClick={load} disabled={loading} className="text-sm px-3 py-1.5 bg-slate-100 rounded-lg hover:bg-slate-200 disabled:opacity-50">{loading ? '載入中…' : '重新整理'}</button>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr className="text-left text-slate-500 border-b bg-slate-50"><th className="py-2 px-2">時間</th><th className="px-2">操作人</th><th className="px-2">動作</th><th className="px-2">對象</th><th className="px-2">說明</th></tr></thead>
                  <tbody>
                    {logRows.map((r, i) => (
                      <tr key={i} className="border-b border-slate-100">
                        <td className="py-2 px-2 text-slate-500 whitespace-nowrap">{r.time}</td><td className="px-2">{r.user}</td><td className="px-2">{r.action}</td><td className="px-2 text-slate-600">{r.target}</td><td className="px-2 text-slate-500">{r.note}</td>
                      </tr>
                    ))}
                    {logRows.length === 0 && !loading && <tr><td colSpan="5" className="py-6 text-center text-slate-400">{configured ? '尚無異動紀錄' : '尚未連線後端'}</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* 照片連結修復：照片已在 Drive 但紀錄裡只有檔名時，報表點不到照片 */}
          {!isLog && (
            <div className="bg-white rounded-xl shadow-sm p-5 mb-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h3 className="font-bold text-slate-700">🔗 照片連結修復</h3>
                  <p className="text-xs text-slate-400">
                    照片上傳完成後要回寫連結，若當下網路中斷或頁面被關掉，照片其實已在雲端硬碟、
                    紀錄裡卻只剩檔名 → 報表的照片欄會是空白、編輯時顯示「無雲端連結」。
                    這裡依檔名把連結補回去，並一併設為「知道連結就能看」。一次處理 40 筆，會自動接續。
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  <select value={repairMonth} onChange={e => setRepairMonth(e.target.value)} className="px-3 py-1.5 border border-slate-300 rounded-lg text-sm">
                    {monthOptions(curMonth).map(m => <option key={m} value={m}>{monthFolderOf(m)}</option>)}
                  </select>
                  <button onClick={() => runRepair(false)} disabled={repairing || !configured}
                    className="text-sm px-3 py-1.5 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 disabled:opacity-50">
                    {repairing ? '處理中…' : '先試算'}
                  </button>
                  <button onClick={() => runRepair(true)} disabled={repairing || !configured}
                    className="text-sm px-3 py-1.5 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 disabled:opacity-50">
                    {repairing ? '處理中…' : '修復並寫入'}
                  </button>
                </div>
              </div>
              {repairMsg && <div className="mt-3 text-sm whitespace-pre-wrap bg-slate-50 border border-slate-200 rounded-lg p-3 text-slate-700">{repairMsg}</div>}
            </div>
          )}

          {/* 分數重算：分區扣分題的分數原本由非同步 effect 寫回，送出得太快會存到上一步的分數 */}
          {!isLog && (
            <div className="bg-white rounded-xl shadow-sm p-5 mb-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h3 className="font-bold text-slate-700">🧮 分數重算</h3>
                  <p className="text-xs text-slate-400">
                    分區扣分題（如「商品豐富陳列」）的分數，舊版是等畫面繪製後才非同步寫回，
                    改完立刻按送出就可能存到上一步的分數 —— 症狀是「填寫與上傳都是 88 分，點進編輯卻變 92 分」。
                    這裡依各題的勾選內容重算合計與明細並修正。<b className="text-slate-600">請先「試算」看清單再寫入。</b>
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  <select value={scoreMonth} onChange={e => setScoreMonth(e.target.value)} className="px-3 py-1.5 border border-slate-300 rounded-lg text-sm">
                    {monthOptions(curMonth).map(m => <option key={m} value={m}>{monthFolderOf(m)}</option>)}
                  </select>
                  <button onClick={() => runRecompute(false)} disabled={scoring || !configured}
                    className="text-sm px-3 py-1.5 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 disabled:opacity-50">
                    {scoring ? '處理中…' : '先試算'}
                  </button>
                  <button onClick={() => runRecompute(true)} disabled={scoring || !configured}
                    className="text-sm px-3 py-1.5 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 disabled:opacity-50">
                    {scoring ? '處理中…' : '重算並寫入'}
                  </button>
                </div>
              </div>
              {scoreMsg && <div className="mt-3 text-sm whitespace-pre-wrap bg-slate-50 border border-slate-200 rounded-lg p-3 text-slate-700">{scoreMsg}</div>}
            </div>
          )}

          {!isLog && (
          <div className="bg-white rounded-xl shadow-sm p-5">
            <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div>
                <h3 className="font-bold text-slate-700">{area.label}</h3>
                <p className="text-xs text-slate-400">{area.note}　·　同檔名再次匯入將以最新覆蓋</p>
              </div>
              <div className="flex items-center gap-2">
                {area.monthly && <select value={month} onChange={e => setMonth(e.target.value)} className="px-3 py-1.5 border border-slate-300 rounded-lg text-sm">{monthOptions(curMonth).map(m => <option key={m} value={m}>{monthFolderOf(m)}</option>)}</select>}
                <button onClick={() => setEditing(blank())} className="text-sm px-3 py-1.5 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">+ 新增</button>
                <label className={"text-sm px-3 py-1.5 rounded-lg text-white " + (uploading ? "bg-slate-400" : "bg-slate-700 hover:bg-slate-800 cursor-pointer")}>📥 {uploading ? '匯入中…' : (uploaded[sub] ? '重新匯入' : 'Excel 匯入')}<input type="file" accept=".xlsx,.xls" className="hidden" onChange={onUpload} disabled={uploading} /></label>
                {rowsMeta.byType && !loading && (
                  <span className="text-sm text-slate-600 whitespace-nowrap" title="數字隨名單更新；由後端以全部資料計算">
                    {storeCountText(rowsMeta.total, rowsMeta.byType)}
                  </span>
                )}
              </div>
            </div>
            {uploaded[sub] && <div className="text-xs text-emerald-600 mb-3">✓ 最近匯入：{uploaded[sub]}</div>}

            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="text-left text-slate-500 border-b bg-slate-50">{area.cols.map(c => <th key={c} className="py-2 px-2">{c}</th>)}<th className="px-2">操作</th></tr></thead>
                <tbody>
                  {rows.slice(0, 500).map((r, i) => (
                    <tr key={i} className="border-b border-slate-100">
                      {area.cols.map(c => <td key={c} className="py-2 px-2 text-slate-700">{String(r[c] != null ? r[c] : '')}</td>)}
                      <td className="px-2 whitespace-nowrap"><button onClick={() => setEditing({ ...r })} className="text-xs text-blue-600 mr-2">編輯</button><button onClick={() => remove(r[area.key])} className="text-xs text-red-600">刪除</button></td>
                    </tr>
                  ))}
                  {(rows.length > 500 || rowsMeta.truncated) && <tr><td colSpan={area.cols.length + 1} className="py-2 px-2 text-center text-slate-400 text-xs">僅顯示前 {Math.min(rows.length, 500)} 筆（共 {rowsMeta.total} 筆）；請用匯入或搜尋維護</td></tr>}
                  {rows.length === 0 && !loading && <tr><td colSpan={area.cols.length + 1} className="py-6 text-center text-slate-400">{configured ? '尚無資料，請匯入或新增' : '尚未連線後端'}</td></tr>}
                </tbody>
              </table>
            </div>

            {editing && (
              <div className="mt-4 border-t pt-4">
                <h4 className="font-bold text-slate-700 mb-2">{isEdit ? '編輯' : '新增'}{area.label}</h4>
                <div className="grid md:grid-cols-2 gap-2 text-sm">
                  {area.fields.map(f => (
                    <label key={f.k} className={"block " + (f.k === '子項清單' || f.k === '規範說明' || f.k === '題目名稱' ? 'md:col-span-2' : '')}>
                      <span className="text-xs text-slate-500">{f.k}</span>
                      {f.t === 'select'
                        ? <select value={editing[f.k]} onChange={e => setEditing({ ...editing, [f.k]: e.target.value })} className="w-full px-2 py-1.5 border border-slate-300 rounded">{f.opts.map(o => <option key={o} value={o}>{o}</option>)}</select>
                        : <input type={f.t} value={editing[f.k]} placeholder={f.ph || ''} onChange={e => setEditing({ ...editing, [f.k]: e.target.value })} className="w-full px-2 py-1.5 border border-slate-300 rounded" />}
                    </label>
                  ))}
                </div>
                <div className="flex gap-2 mt-3">
                  <button onClick={save} className="px-4 py-1.5 bg-emerald-600 text-white rounded-lg text-sm hover:bg-emerald-700">儲存</button>
                  <button onClick={() => setEditing(null)} className="px-4 py-1.5 bg-slate-200 text-slate-600 rounded-lg text-sm">取消</button>
                </div>
              </div>
            )}
          </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    // 以 classic runtime 編譯（避免新版 Babel 預設 automatic runtime 產生 import 而在純瀏覽器報錯）
    (function () {
      try {
        var src = document.getElementById('appCode').textContent;
        var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        (0, eval)(out);
      } catch (e) {
        document.getElementById('root').innerHTML =
          '<pre style="color:#b91c1c;padding:16px;white-space:pre-wrap">啟動錯誤：' + (e && e.message ? e.message : e) + '</pre>';
        console.error(e);
      }
    })();
  </script>
</body>
</html>
