<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQC 評核系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/db.js"></script>
  <script src="js/uploader.js"></script>
  <script src="js/billing.js"></script>
  <style>body { font-family: "Noto Sans TC", system-ui, "Microsoft JhengHei", sans-serif; }</style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
  </script>

  <script type="text/jsx" id="appCode">
    const { useState, useMemo, useEffect, useRef } = React;

    // ============================================================
    // 共用：照片壓縮工具（上傳壓縮 + 縮圖預覽）
    //   目標 800KB~1200KB / 長邊1920px / 品質0.92起 每次-0.1 至<1200KB / 下限0.3 / JPEG
    //   縮圖：固定品質 0.7，僅供畫面顯示
    // ============================================================
    const MAX_EDGE = 1920, MAX_KB = 1200, MIN_Q = 0.3, START_Q = 0.92, THUMB_Q = 0.7;

    function loadImage(file) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = URL.createObjectURL(file);
      });
    }
    function drawScaled(img) {
      let { width: w, height: h } = img;
      if (Math.max(w, h) > MAX_EDGE) {
        const r = MAX_EDGE / Math.max(w, h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      return c;
    }
    function canvasToBlob(canvas, q) {
      return new Promise(res => canvas.toBlob(b => res(b), 'image/jpeg', q));
    }
    async function compressImage(file) {
      const img = await loadImage(file);
      const canvas = drawScaled(img);
      let q = START_Q;
      let blob = await canvasToBlob(canvas, q);
      while (blob.size / 1024 > MAX_KB && q > MIN_Q) {
        q = Math.round((q - 0.1) * 100) / 100;
        blob = await canvasToBlob(canvas, q);
      }
      const thumb = canvas.toDataURL('image/jpeg', THUMB_Q);
      return { name: file.name.replace(/\.[^.]+$/, '') + '.jpg', sizeKB: Math.round(blob.size / 1024), quality: q, thumb, blob };
    }

    function PhotoUpload({ label, photos, onChange, required, max = 10, folderPath, existingCount = 0 }) {
      const [busy, setBusy] = useState(false);
      const list = photos || [];
      const handleFile = async (e) => {
        const files = Array.from(e.target.files);
        e.target.value = '';
        setBusy(true);
        const out = [];
        for (const f of files) {
          if (list.length + out.length >= max) break;
          try { out.push(await compressImage(f)); } catch (_) {}
        }
        onChange([...list, ...out]);
        setBusy(false);
      };
      const remove = (i) => onChange(list.filter((_, idx) => idx !== i));
      const satisfied = existingCount > 0 || list.length > 0;
      const need = required && !satisfied;
      return (
        <div className={"mt-2 rounded-lg border p-2 " + (need ? "border-red-300 bg-red-50" : "border-slate-200 bg-slate-50")}>
          <div className="flex items-center justify-between gap-2">
            <span className="text-xs font-medium text-slate-600">
              {label}{required && <span className="text-red-500"> *必須</span>}
              <span className="text-slate-400">（{existingCount > 0 ? `新增${list.length}` : list.length}/{max}）</span>
              {existingCount > 0 && <span className="ml-1 text-emerald-600">✓ 已有 {existingCount} 張原照片（免重傳）</span>}
            </span>
            <div className="flex gap-1.5 shrink-0">
              <label className={"text-xs px-2 py-1 rounded cursor-pointer whitespace-nowrap " + (busy ? "bg-slate-300 text-slate-500" : "bg-slate-600 text-white hover:bg-slate-700")}>
                {busy ? '壓縮中…' : '🖼️ 相簿'}
                <input type="file" accept="image/*" multiple className="hidden" onChange={handleFile} disabled={busy} />
              </label>
              <label className={"text-xs px-2 py-1 rounded cursor-pointer whitespace-nowrap " + (busy ? "bg-slate-300 text-slate-500" : "bg-emerald-600 text-white hover:bg-emerald-700")}>
                {busy ? '壓縮中…' : '📷 拍照'}
                <input type="file" accept="image/*" capture="environment" multiple className="hidden" onChange={handleFile} disabled={busy} />
              </label>
            </div>
          </div>
          {folderPath && <div className="text-[10px] text-slate-400 mt-1">📁 {folderPath}</div>}
          {list.length > 0 && (
            <div className="flex flex-wrap gap-2 mt-2">
              {list.map((p, i) => (
                <div key={i} className="relative">
                  <img src={p.thumb} className="w-16 h-16 object-cover rounded border" />
                  <span className="absolute bottom-0 inset-x-0 bg-black/50 text-white text-[9px] text-center">{p.sizeKB}KB</span>
                  <button onClick={() => remove(i)} className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-xs leading-none">×</button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // MOCK DATA（正式由「維護專區」每月匯入）
    // ============================================================
    const DRIVE_ROOT = 'SQC照片 (Google Drive)';

    // 觀察題預設值（維護專區未匯入觀察題時的內建預設；題庫/店鋪/人員一律由後端載入）
    const DEFAULT_OBS = {
      keyObservations: [
        { id: 'KO1', name: '重點觀察題1.【店外全景照】' },
        { id: 'KO2', name: '重點觀察題2.【櫃台全景照】' },
        { id: 'KO3', name: '重點觀察題3.【FF區全景照】' },
      ],
      toiletObservations: [
        { id: 'O1', name: '店舖有無對外廁所', opts: ['有', '無', '廁所封閉'], show: 'always' },
        { id: 'O2', name: '店舖有無開放對外廁所', opts: ['有', '無'], show: 'has' },
        { id: 'O3', name: '店外招牌有無廁所標示', opts: ['有', '無'], show: 'hasOrClosed' },
        { id: 'O4', name: '店內有無廁所標示', opts: ['有', '無'], show: 'hasOrClosed' },
        { id: 'O5', name: '是否提供備品（衛生紙、洗手乳、芳香劑）', opts: ['有', '無'], show: 'has' },
      ],
      toiletInspect: [
        { id: 'T1', name: '廁所乾淨無髒污及垃圾桶無明顯滿溢' },
        { id: 'T2', name: '落實填寫廁間清潔表；無堆放雜物（ex.紙箱、物流籃、資源回收物…等）' },
      ],
    };
    const IDENTITIES = ['店長', '副店', '正職', 'PT'];
    const PASS_SCORE = 85;

    // 報表用的觀察題定義備援：該月「觀察題」活頁未匯入時後端會回空陣列，
    // 但 App 點檢時是用 DEFAULT_OBS 進行(照片資料夾也用這些名稱)，報表必須用同一份定義才對得上
    function defaultObsList() {
      const out = [];
      DEFAULT_OBS.keyObservations.forEach((k, i) => out.push({ id: k.id, type: '拍照', name: k.name, options: [], showIf: 'always', required: true, order: i + 1 }));
      DEFAULT_OBS.toiletObservations.forEach((o, i) => out.push({ id: o.id, type: '有無', name: o.name, options: o.opts || [], showIf: o.show || 'always', required: false, order: 10 + i }));
      DEFAULT_OBS.toiletInspect.forEach((t, i) => out.push({ id: t.id, type: '符合', name: t.name, options: t.opts || [], showIf: 'has', required: false, order: 20 + i }));
      return out;
    }

    // 後端是否已設定（未設定時停用，不載入任何內建假資料）
    const CONFIGURED = !!(window.SQC_CONFIG && window.SQC_CONFIG.GAS_URL && window.SQC_CONFIG.GAS_URL.indexOf('XXXXXXXX') < 0);
    const MONTH = (window.SQC_CONFIG && window.SQC_CONFIG.MONTH) || '11506';

    // 民國年月 11506 → 「115年06月」
    function monthFolderOf(m) { return m.slice(0, 3) + '年' + m.slice(3, 5) + '月'; }
    // 台北時間現在（datetime-local 預設值用）
    function taipeiNow() { return new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 16); }
    function taipeiToday() { return taipeiNow().slice(0, 10); }
    // 店號正規化：去除前導0與空白，避免不同來源(店鋪名單/店鋪主檔)格式不一致誤判成不同店
    function normCode(c) { const s = String(c == null ? '' : c).trim(); return s.replace(/^0+(?=\d)/, ''); }
    // 點檢時間(YYYY-MM-DDTHH:mm) → 民國年月，如 2026-07 → 11507
    function rocMonth(dt) { if (!dt || dt.length < 7) return MONTH; return String(parseInt(dt.slice(0, 4)) - 1911) + dt.slice(5, 7); }
    // 民國年月字串前後推移，如 shiftRocMonth('11512', 1) → '11601'（跨年）
    function shiftRocMonth(m, delta) {
      let y = parseInt(m.slice(0, 3), 10), mo = parseInt(m.slice(3, 5), 10) + delta;
      while (mo > 12) { mo -= 12; y++; }
      while (mo < 1) { mo += 12; y--; }
      return String(y) + String(mo).padStart(2, '0');
    }
    // 維護專區月份下拉選單：以目前月份為準，往前12個月＋往後1個月，確保換月後新月份一定選得到
    function monthOptions(center) {
      const list = [];
      for (let d = -12; d <= 1; d++) list.push(shiftRocMonth(center, d));
      return list;
    }

    // 將後端扁平題目陣列組成 categories 結構（附上固定的觀察題定義）
    function buildChecklist(items, month, obs) {
      const order = [];
      const map = {};
      items.forEach(function (it) {
        if (!map[it.cat]) { map[it.cat] = { key: it.cat, name: it.cat, max: 0, items: [] }; order.push(it.cat); }
        map[it.cat].items.push(it);
        map[it.cat].max += Number(it.max) || 0;
      });
      const O = obs || {};
      const pick = (arr, fb) => (arr && arr.length) ? arr : fb;
      return {
        version: month,
        categories: order.map(function (k) { return map[k]; }),
        keyObservations: pick(O.keyObservations, DEFAULT_OBS.keyObservations),
        toiletObservations: pick(O.toiletObservations, DEFAULT_OBS.toiletObservations),
        toiletInspect: pick(O.toiletInspect, DEFAULT_OBS.toiletInspect),
      };
    }

    // 滿分照片區（無缺失時拍指定區域，每區≤10張）
    const PERFECT_ZONES = ['1.店外全景', '2.櫃台區', '3.貨架區', '4.OC&鮮食區', '5.WI五門', '6.休息區', '7.FF區', '8.落地區'];

    function gradeOf(t) {
      return t >= 95 ? { txt: '優良', c: 'text-emerald-600', bg: 'bg-emerald-100 text-emerald-700' }
        : t >= PASS_SCORE ? { txt: '合格', c: 'text-blue-600', bg: 'bg-blue-100 text-blue-700' }
        : { txt: '不合格', c: 'text-red-600', bg: 'bg-red-100 text-red-700' };
    }

    // ============================================================
    // 報表排版工具（純函式，不依賴畫面狀態；置於元件外方便單獨驗證）
    // ============================================================
    const itemNumberOf = (name) => (String(name).split('.')[0] || '');
    const bareNameOf = (name) => { const s = String(name); const i = s.indexOf('.'); return i >= 0 ? s.slice(i + 1) : s; };
    const timeCompact = (t) => { // "2026-07-15 10:00" → "2026-0715-1000"（比照人工版原始表單時間格式）
      const s = String(t || ''); if (s.length < 16) return s;
      return `${s.slice(0, 4)}-${s.slice(5, 7)}${s.slice(8, 10)}-${s.slice(11, 13)}${s.slice(14, 16)}`;
    };
    const mmdd = (t) => { const s = String(t || ''); return s.length >= 10 ? `${s.slice(5, 7)}/${s.slice(8, 10)}` : ''; };
    const joinLinks = (arr) => (arr || []).join(', ');
    // 依「照片資料夾名稱」比對取連結，不依賴觀察題活頁的題目名稱與上傳當時完全一致
    const groupLinks = (groups, pred) => Object.keys(groups || {}).filter(pred).reduce((acc, k) => acc.concat(groups[k] || []), []);
    const toiletDefectLinks = (r) => groupLinks(r.photoGroups, k => k.indexOf('廁所觀察/') === 0);
    // 重點觀察題照片：先用題名精準比對，再退回用「重點觀察題N」前綴（題名被改過時仍找得到）
    const keyObsLinks = (r, obsItem, idx) => {
      const groups = r.photoGroups || {};
      if (groups[obsItem.name] && groups[obsItem.name].length) return groups[obsItem.name];
      const n = (String(obsItem.name).match(/重點觀察題\s*(\d+)/) || [])[1] || String(idx + 1);
      return groupLinks(groups, k => k.indexOf('重點觀察題' + n) === 0);
    };
    // 店號補回前導0並確保以文字寫入(避免Excel開啟時把"017246"顯示成17246)
    const padStoreCode = (c) => { const s = String(c == null ? '' : c).trim(); return /^\d+$/.test(s) && s.length < 6 ? ('000000' + s).slice(-6) : s; };

    // 觀察區欄名：標準那幾題沿用人工版的原始字樣（保持與人工版對齊），
    // 新增的題目則依活頁題名自動產生欄位 → 觀察題數量不再有上限
    const KO_LEGACY_HEAD = {
      KO1: '重點觀察題1. 【 店外全景照】照片上傳',
      KO2: '重點觀察題2. 【 櫃台全景照】 照片上傳',
      KO3: '重點觀察題3.【  FF區全景照】照片上傳',
    };
    const O_LEGACY_HEAD = {
      O1: '【對外廁所觀察記錄 】店舖有無對外廁所',
      O2: '【對外廁所觀察記錄 】店舖有無開放對外廁所',
      O3: '【對外廁所觀察記錄 】店外招牌有無廁所標示',
      O4: '【對外廁所觀察記錄 】店內有無廁所標示',
      O5: '【對外廁所觀察記錄 】是否有提供以下備品(衛生紙、洗手乳、芳香劑)',
    };
    const koHeadOf = (k) => KO_LEGACY_HEAD[k.id] || (k.name + '照片上傳');
    const oHeadOf = (o) => O_LEGACY_HEAD[o.id] || ('【對外廁所觀察記錄 】' + o.name);

    // SQC Google點檢表單：逐店逐題原始資料，含每題缺失照片雲端連結（比照原本Google表單回覆試算表格式）
    function buildRawFormSheet(report) {
      const items = report.checklist;
      const obsList = report.obsList || [];
      const koItems = obsList.filter(o => o.type === '拍照');
      const oItems = obsList.filter(o => o.type === '有無');
      const oFirst = oItems.slice(0, 1), oRest = oItems.slice(1); // 人工版把O1排在觀察題/缺失照片之前，其餘排在之後
      const zonesA = PERFECT_ZONES.slice(0, 4), zonesB = PERFECT_ZONES.slice(4);

      const head = ['營業部', '營業課別', '營業擔當', '時間戳記', '分數', '店號', '店名', '日期-時間', '點檢人員', '在店店員人數', '簽名店鋪人員身分別'];
      items.forEach(it => {
        head.push(it.name);
        if (it.type === 'subdeduct') head.push(`${it.name}-缺失子項`);
        head.push(`${it.name}-缺失照片上傳`);
      });
      head.push(
        ...oFirst.map(oHeadOf),
        '對外廁所(觀察題) ', '缺失照片上傳',
        ...oRest.map(oHeadOf),
        ...koItems.map(koHeadOf),
        '100分照片上傳-1', '100分照片上傳-2', '備註(例：廠區店無法拍照)', 'SQC點檢表完成照片', '修正原因', '店型態');

      return [head].concat(report.rows.map(r => {
        const line = [r.營業部, r.營業課別, r.營業擔當, r.建立時間, `${r.合計} / 100`, padStoreCode(r.店號), r.店名, timeCompact(r.點檢時間), r.點檢人員, r.在店人數, r.身分別];
        items.forEach(it => {
          line.push(r.itemScores[it.id]);
          if (it.type === 'subdeduct') line.push(r.itemExtra[it.id] || '');
          line.push(joinLinks((r.photoGroups || {})[`${it.name}/缺失`]));
        });
        const toilet = (r.觀察 || {}).toilet || {}, toiletReasons = (r.觀察 || {}).toiletReasons || {};
        const hasToilet = toilet['O1'] && toilet['O1'] !== '無';
        // 缺失項目直接取紀錄裡勾選的內容，不經由題目名稱比對（活頁未匯入時仍正確）
        const ngReasons = Object.keys(toiletReasons).reduce((acc, k) => acc.concat(toiletReasons[k] || []), []);
        const oVal = (o) => ((o.showIf === 'always' || hasToilet) ? (toilet[o.id] || '') : '');
        line.push(
          ...oFirst.map(o => toilet[o.id] || ''),
          hasToilet ? (ngReasons.length ? ngReasons.join('、') : '無以上缺失') : '',
          joinLinks(toiletDefectLinks(r)),
          ...oRest.map(oVal),
          ...koItems.map((k, i) => joinLinks(keyObsLinks(r, k, i))),
          joinLinks(zonesA.reduce((acc, z) => acc.concat((r.photoGroups || {})[`滿分照片/${z}`] || []), [])),
          joinLinks(zonesB.reduce((acc, z) => acc.concat((r.photoGroups || {})[`滿分照片/${z}`] || []), [])),
          r.備註, joinLinks((r.photoGroups || {})['SQC點檢表完成照片']), '', r.店型態);
        return line;
      }));
    }
    window.SqcReport = { buildRawFormSheet }; // 供離線驗證報表排版用

    // ============================================================
    // 點檢項目列
    // ============================================================
    function ItemRow({ item, state, setState, canPhoto, monthFolder, existingCount = 0 }) {
      const s = state || {};
      const labelOf = (sub) => typeof sub === 'string' ? sub : sub.label;
      const isCustom = (sub) => typeof sub === 'object' && sub.custom;
      const fixedUnits = (sub) => (typeof sub === 'object' && sub.units) ? sub.units : 1;
      const splitNames = (v) => String(v || '').split(/[\s,，、;；\/|]+/).filter(Boolean);
      const nameUnits = (lbl) => splitNames(s.customNames?.[lbl]).length;

      // 缺失單位數：固定子項用其 units；可填子項用填入的名稱數（至少1）
      const totalUnits = (s.ngSubs || []).reduce((sum, lbl) => {
        const sub = (item.subs || []).find(x => labelOf(x) === lbl);
        if (!sub) return sum;
        return sum + (isCustom(sub) ? Math.max(1, nameUnits(lbl)) : fixedUnits(sub));
      }, 0);

      const subdeductScore = item.type === 'subdeduct' ? Math.max(0, item.max - totalUnits * item.perPoint) : null;
      const score = item.type === 'subdeduct' ? subdeductScore : (s.score != null ? s.score : item.max);
      const isNG = score < item.max;

      useEffect(() => { if (item.type === 'subdeduct') setState({ ...s, score: subdeductScore }); }, [subdeductScore]);

      const toggleSub = (lbl) => {
        const ng = s.ngSubs || [];
        setState({ ...s, ngSubs: ng.includes(lbl) ? ng.filter(x => x !== lbl) : [...ng, lbl] });
      };
      const setCustomName = (lbl, v) => setState({ ...s, customNames: { ...(s.customNames || {}), [lbl]: v } });

      return (
        <div className="px-4 py-3 border-b border-slate-100 last:border-0">
          <div className="flex items-start justify-between gap-3">
            <div className="flex-1">
              <div className="font-semibold text-slate-800 text-sm">{item.name}
                <span className="ml-2 text-xs text-slate-400">配分 {item.max}</span>
                <span className={"ml-1 text-[10px] px-1.5 py-0.5 rounded " + (item.type === 'subdeduct' ? "bg-blue-100 text-blue-600" : "bg-amber-100 text-amber-600")}>{item.type === 'subdeduct' ? '分區扣分' : '扣分題'}</span>
              </div>
              <div className="text-xs text-slate-500 mt-0.5 leading-relaxed">{item.desc}</div>
            </div>
            <div className="text-right shrink-0">
              <div className={"text-lg font-bold " + (isNG ? "text-red-500" : "text-emerald-600")}>{score}</div>
              <div className="text-[10px] text-slate-400">得分</div>
            </div>
          </div>

          {item.type === 'subdeduct' && (
            <div className="mt-2">
              <div className="text-[11px] text-slate-400 mb-1">點選「有缺失」的項目（每項 -{item.perPoint} 分，由滿分往下扣）</div>
              <div className="flex flex-wrap gap-1.5">
                {item.subs.map(sub => {
                  const lbl = labelOf(sub);
                  const on = (s.ngSubs || []).includes(lbl);
                  const u = isCustom(sub) ? Math.max(1, nameUnits(lbl)) : fixedUnits(sub);
                  return <button key={lbl} onClick={() => toggleSub(lbl)} title={sub.note || ''} className={"text-xs px-2 py-1 rounded-full border transition " + (on ? "bg-red-500 text-white border-red-500" : "bg-white text-slate-500 border-slate-300")}>{on ? '✕ ' : ''}{lbl}{sub.note ? ' ⓘ' : ''} -{u * item.perPoint}</button>;
                })}
              </div>
              {/* 可填寫子項：填入名稱（多個以、或/分隔），每個名稱扣一個缺失 */}
              {item.subs.filter(sub => isCustom(sub) && (s.ngSubs || []).includes(labelOf(sub))).map(sub => {
                const lbl = labelOf(sub);
                return (
                  <div key={lbl} className="mt-2">
                    <div className="text-[10px] text-slate-500 mb-0.5">填入{lbl}名稱；<b className="text-red-500">多個貨架請用空格或符號（、,/）隔開</b>，系統依隔開的數量計算扣分</div>
                    <input value={s.customNames?.[lbl] || ''} onChange={e => setCustomName(lbl, e.target.value)}
                      placeholder="例：日用品架 寵物貨架　或　日用品架、寵物貨架"
                      className="w-full text-xs px-2 py-1.5 border border-red-300 rounded bg-red-50" />
                    <div className="text-[10px] text-red-500 mt-0.5">辨識為 {nameUnits(lbl)} 個貨架 → 扣 {Math.max(1, nameUnits(lbl)) * item.perPoint} 分（{splitNames(s.customNames?.[lbl]).join('｜') || '尚未填寫'}）</div>
                  </div>
                );
              })}
            </div>
          )}

          {item.type === 'deduct' && (
            <div className="flex items-center gap-2 mt-2">
              <button onClick={() => setState({ ...s, score: item.max })} className={"text-xs px-4 py-1 rounded border " + (score === item.max ? "bg-emerald-500 text-white border-emerald-500" : "bg-white text-slate-500 border-slate-300")}>合格 ({item.max})</button>
              <button onClick={() => setState({ ...s, score: 0 })} className={"text-xs px-4 py-1 rounded border " + (score === 0 ? "bg-red-500 text-white border-red-500" : "bg-white text-slate-500 border-slate-300")}>缺失 (0)</button>
            </div>
          )}

          {isNG && canPhoto && (
            <PhotoUpload label="缺失照片（NG 項目必須拍照記錄）" required photos={s.photos} onChange={p => setState({ ...s, photos: p })} folderPath={`${DRIVE_ROOT}/${monthFolder}/${item.name}/缺失`} existingCount={existingCount} />
          )}
        </div>
      );
    }

    // ============================================================
    // 主應用
    // ============================================================
    function App() {
      const currentUser = (() => { try { return JSON.parse(sessionStorage.getItem('sqc_user')) || {}; } catch (e) { return {}; } })();
      const user = currentUser.name || '';
      const isManager = currentUser.role === '管理者';
      const [tab, setTab] = useState('basic');

      // ---- 基本資料 ----（時間用台北；月份由點檢時間決定；登入預帶自己的部/課/姓名）
      const [basic, setBasic] = useState({ time: taipeiNow(), dept: currentUser.dept || '', section: currentUser.section || '', staffId: currentUser.empId || '', storeCode: '', customStore: '', customInfo: null, storeType: '', noPhotoReason: '', noPhotoOther: '' });
      const workMonth = rocMonth(basic.time); // 依點檢時間對應的民國年月

      // ---- 開場資料（依 workMonth 由後端載入；載入前為空）----
      const [boot, setBoot] = useState({ checklist: buildChecklist([], MONTH), stores: [], staffs: [], depts: [] });
      const [inspectedCodes, setInspectedCodes] = useState({}); // 當月已有點檢紀錄的店號
      const [custResults, setCustResults] = useState([]);
      const [loading, setLoading] = useState(CONFIGURED);
      const [bootErr, setBootErr] = useState('');
      const [bootWarn, setBootWarn] = useState(''); // 用快取撐著時的提示（非阻斷式）
      const [bootAt, setBootAt] = useState(null);   // 目前這份開場資料是何時取得的（供現場判斷名單夠不夠新）
      const fmtStamp = (ts) => {
        if (!ts) return '';
        const d = new Date(ts);
        return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      };
      // 開場資料快取：Google 轉送層偶發不穩時，用上次成功的資料先讓 App 可用，
      // 避免整頁卡在「載入失敗」，也避免題庫為空導致分數被算成 0
      const bootCacheKey = (m) => 'sqc_boot_' + m;
      const readBootCache = (m) => { try { const raw = localStorage.getItem(bootCacheKey(m)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } };
      const writeBootCache = (m, b) => { try { localStorage.setItem(bootCacheKey(m), JSON.stringify({ at: Date.now(), b })); } catch (e) { /* 空間不足就算了 */ } };
      const applyBoot = (b, mo) => setBoot({
        checklist: buildChecklist(b.checklist || [], mo, b.observations),
        stores: b.stores || [],
        staffs: (b.staffs || []).map(s => ({ id: s.empId, name: s.name, dept: s.dept, section: s.section })),
        depts: b.depts || [],
      });
      const reloadBoot = (m) => { const mo = m || workMonth; return SqcApi.getBootstrap(mo, '').then(b => {
        applyBoot(b, mo);
        writeBootCache(mo, b);
        setBootErr(''); setBootWarn(''); setBootAt(Date.now());
        return b;
      }); };
      const loadInspected = (m) => {
        if (!CONFIGURED) return Promise.resolve();
        return SqcApi.queryRecords(m || workMonth, {}).then(r => {
          const map = {}; (r.records || []).forEach(x => { map[normCode(x.storeCode)] = true; });
          setInspectedCodes(map);
        }).catch(() => { });
      };
      useEffect(() => {
        if (!CONFIGURED) return;
        const cached = readBootCache(workMonth);
        if (cached && cached.b) { applyBoot(cached.b, workMonth); setBootAt(cached.at || null); setLoading(false); } // 先用快取讓畫面立即可用
        else { setBootAt(null); setLoading(true); }
        reloadBoot(workMonth)
          .catch(e => {
            if (cached && cached.b) setBootWarn('連線不穩，目前顯示上次載入的資料（' + (e.message || '載入失敗') + '）');
            else setBootErr(e.message || '載入失敗');
          })
          .finally(() => setLoading(false))
          // 兩支API改為接續呼叫而非同時發送：同時打會提高撞上轉送層不穩的機率
          .then(() => loadInspected(workMonth));
      }, [workMonth]);
      const checklist = boot.checklist, STORE_ROSTER = boot.stores, STAFFS = boot.staffs, DEPTS = boot.depts;
      const TOTAL_MAX = useMemo(() => checklist.categories.reduce((s, c) => s + c.max, 0), [checklist]);
      const monthFolder = monthFolderOf(workMonth);
      // 編輯既有紀錄時，查該欄位是否已有原照片（免重傳）；key 需與 submit() 的 addPhotos/hasExisting 一致
      const existingCountAt = (parts) => (existingPhotos[parts.join('/')] || []).length;

      const sectionStores = STORE_ROSTER.filter(s => !basic.section || s.section === basic.section);
      const store = STORE_ROSTER.find(s => s.code === basic.storeCode);
      const effStore = store || basic.customInfo; // 名單選的 或 自行新增(比對主檔後)的店
      // 可否拍照必須由點檢人員手選；不可拍照需再選原因
      const canPhoto = basic.storeType === 'photo';
      const noPhotoReasonText = basic.storeType === 'nophoto'
        ? (basic.noPhotoReason === '其他' ? ('其他：' + (basic.noPhotoOther || '').trim()) : basic.noPhotoReason)
        : '';
      const reasonOk = basic.storeType !== 'nophoto' || (basic.noPhotoReason && (basic.noPhotoReason !== '其他' || (basic.noPhotoOther || '').trim()));
      const readyToWork = !!effStore && !!basic.storeType && reasonOk;

      // ---- 點檢作業 ----
      const [scores, setScores] = useState({});
      const [keyObs, setKeyObs] = useState({});
      const [toilet, setToilet] = useState({});
      const [toiletPhotos, setToiletPhotos] = useState({}); // 廁所觀察「不符合」缺失照片
      const [toiletReasons, setToiletReasons] = useState({}); // 廁所觀察「不符合」不合格項目
      const [obsText, setObsText] = useState('');
      const [perfectPhotos, setPerfectPhotos] = useState({});
      const [paperForm, setPaperForm] = useState([]);        // 紙本點檢表（所有店必上傳）
      const [sign, setSign] = useState({ count: '', identity: '', remark: '' }); // 在店店員人數 / 簽名人員身分別 / 備註(特殊情況)
      const [editingRecordId, setEditingRecordId] = useState(null); // 非 null＝編輯既有紀錄
      const [editingMonth, setEditingMonth] = useState(null);       // 該筆紀錄「原本所在」的月份活頁（點檢時間改跨月時仍要找得到原列）
      const [existingPhotos, setExistingPhotos] = useState({});      // 編輯時保留原有照片JSON
      const [records, setRecords] = useState([]);
      // 正式模式：查詢紀錄/彙總 進場或改條件時，向後端查資料
      // 注意：紀錄依「點檢時間」分月活頁存放，查詢用的月份必須依查詢日期範圍(filter.from/to)決定，
      // 不可用 workMonth（那是「點檢作業」新增紀錄用的時間，換月後兩者會不同，否則查不到上月的紀錄）
      const queryMonthsOf = (from, to) => {
        const a = rocMonth(from || basic.time), b = rocMonth(to || from || basic.time);
        return Array.from(new Set([a, b]));
      };
      const [queryLoading, setQueryLoading] = useState(false);
      // 顯示 API 自動重試狀態（Google 轉送層偶發變慢/回404，重試通常就會恢復）
      const [retryInfo, setRetryInfo] = useState(null);
      useEffect(() => {
        if (!window.SqcApi || !window.SqcApi.onRetry) return; // api.js 未載入時不可讓整頁掛掉
        return window.SqcApi.onRetry(info => setRetryInfo(info && !info.done ? info : null));
      }, []);
      const busyText = retryInfo ? `連線不穩，自動重試中（第 ${retryInfo.attempt}/${retryInfo.maxAttempts} 次）…` : '';
      const loadRecords = () => {
        if (!CONFIGURED) return;
        const f = { from: filter.from, to: filter.to, section: filter.section, empId: isManager ? undefined : currentUser.empId };
        const months = queryMonthsOf(filter.from, filter.to);
        setQueryLoading(true);
        Promise.all(months.map(m => SqcApi.queryRecords(m, f).catch(() => ({ records: [] }))))
          .then(results => {
            const all = results.flatMap(r => (r && r.records) || []);
            setRecords(all.map(x => ({
              id: x.id, date: String(x.time).slice(0, 10), store: x.storeName, section: x.section,
              staff: x.staffName, version: x.month, total: Number(x.total), grade: x.grade, _raw: x,
            })));
          }).catch(e => alert('查詢失敗：' + e.message)).finally(() => setQueryLoading(false));
      };

      const total = useMemo(() => {
        let t = 0;
        checklist.categories.forEach(c => c.items.forEach(it => { const s = scores[it.id]; t += (s && s.score != null) ? s.score : it.max; }));
        return t;
      }, [scores]);

      // 是否「無缺失」→ 所有題目皆滿分（沒有任何扣分）
      const noDeductDefect = useMemo(() => checklist.categories.every(c => c.items.every(it => { const s = scores[it.id]; return !s || s.score == null || s.score === it.max; })), [scores]);

      const grade = gradeOf(total);
      const setItemState = (id, st) => setScores(prev => ({ ...prev, [id]: st }));
      const logout = () => { sessionStorage.removeItem('sqc_user'); location.href = 'index.html'; };

      // 自行新增店鋪：查店鋪主檔
      const doLookup = async () => {
        const q = (basic.customStore || '').trim();
        if (!q) { setCustResults([]); return; }
        try {
          const r = await SqcApi.lookupStore(q);
          const rows = r.rows || [];
          const exact = rows.filter(s => String(s.code) === q || s.name === q);
          if (exact.length === 1) { setBasic({ ...basic, customInfo: exact[0], customStore: exact[0].code + ' ' + exact[0].name }); setCustResults([]); }
          else { setCustResults(rows); if (!rows.length) alert('店鋪主檔查無此店，無法新增（請確認店號/店名）'); }
        } catch (e) { alert('查詢失敗：' + e.message); }
      };

      const resetWork = () => { setScores({}); setKeyObs({}); setToilet({}); setToiletPhotos({}); setToiletReasons({}); setObsText(''); setPerfectPhotos({}); setPaperForm([]); setSign({ count: '', identity: '', remark: '' }); setEditingRecordId(null); setEditingMonth(null); setExistingPhotos({}); };

      // 編輯既有紀錄：把該筆載回點檢作業
      const openEdit = (row) => {
        const rec = row._raw || row;
        const d = rec.detail || {}, o = rec.observation || {};
        const sc = {};
        Object.keys(d).forEach(id => { sc[id] = { score: d[id].score, ngSubs: d[id].ngSubs || [], customNames: d[id].customNames || {} }; });
        setScores(sc);
        setToilet(o.toilet || {}); setObsText(o.obsText || ''); setToiletReasons(o.toiletReasons || {});
        setKeyObs({}); setToiletPhotos({}); setPerfectPhotos({}); setPaperForm([]);
        setExistingPhotos(rec.photos || {});
        // 備註欄與「不可拍照原因」共用同一個後端欄位，用固定分隔字串拆開還原
        const rawNote = String(rec.note || '');
        const sepIdx = rawNote.indexOf('｜備註：');
        const note = sepIdx >= 0 ? rawNote.slice(0, sepIdx) : rawNote;
        const remark = sepIdx >= 0 ? rawNote.slice(sepIdx + 4) : '';
        setSign({ count: String(rec.staffCount || ''), identity: rec.identity || '', remark });
        // 不可拍照原因還原
        const npr = note.indexOf('其他') === 0 ? '其他' : (note === '廠區店' || note === '營區店' ? note : '');
        const npo = note.indexOf('其他') === 0 ? note.replace(/^其他[:：]?/, '') : '';
        const inRoster = STORE_ROSTER.find(s => String(s.code) === String(rec.storeCode));
        setBasic({
          time: String(rec.time || taipeiNow()).replace(' ', 'T').slice(0, 16),
          dept: rec.dept || '', section: rec.section || '', staffId: rec.empId || '',
          storeCode: inRoster ? rec.storeCode : '__custom',
          customStore: inRoster ? '' : (rec.storeCode + ' ' + rec.storeName),
          customInfo: inRoster ? null : { code: rec.storeCode, name: rec.storeName, section: '' },
          storeType: rec.storeType === '可拍照' ? 'photo' : 'nophoto',
          noPhotoReason: npr, noPhotoOther: npo,
        });
        setEditingRecordId(rec.id);
        setEditingMonth(rec.month || rocMonth(String(rec.time || '')));
        setTab('work');
      };

      const submit = () => {
        const isEdit = !!editingRecordId;
        // 題庫是計分依據：尚在載入或載入失敗(題庫為空)時送出，會把明細與分數寫成 0 分覆蓋掉原紀錄，必須先擋下
        if (loading) { alert('題庫仍在載入中，請稍候幾秒再送出'); return; }
        if (!checklist.categories.length) {
          alert('目前沒有載入到本月題庫，為避免分數被覆蓋成 0 分，已阻止送出。\n請重新整理頁面；若仍為空，請確認「維護專區→點檢題目」該月份已匯入題庫。');
          return;
        }
        if (!effStore) { alert('請先在「基本資料」選擇店鋪'); setTab('basic'); return; }
        if (!isEdit && inspectedCodes[normCode(effStore.code)]) { alert('這家店本月已有點檢紀錄，不可重複點檢（如需修正請至查詢紀錄編輯該筆）'); setTab('basic'); return; }
        if (!basic.storeType) { alert('請先在「基本資料」選擇可否拍照'); setTab('basic'); return; }
        if (!reasonOk) { alert('不可拍照店鋪請選擇原因'); setTab('basic'); return; }
        if (!basic.staffId) { alert('請先在「基本資料」選擇點檢人員'); setTab('basic'); return; }
        if (!sign.count) { alert('請選擇「在店店員人數」'); return; }
        if (!sign.identity) { alert('請選擇「簽名店鋪人員身分別」'); return; }

        // 是否已存在該照片欄位的舊照片（編輯時沿用；新建時一律沒有）
        const hasExisting = (parts) => (existingPhotos[parts.join('/')] || []).length > 0;

        // 紙本點檢表：所有店（含編輯）皆須有紙本，新傳或沿用原有皆可
        if (!paperForm.length && !hasExisting([monthFolder, 'SQC點檢表完成照片'])) { alert('所有店皆須上傳「紙本點檢表」才能送出'); return; }

        // 對外廁所：選「有」時，以下觀察題與符合/不符合皆為必填（不受可否拍照影響）
        if (toilet['O1'] === '有') {
          for (const o of checklist.toiletObservations) {
            if (o.id === 'O1') continue;
            if (!toilet[o.id]) { alert(`請填寫「${o.name}」`); return; }
          }
          for (const t of checklist.toiletInspect) {
            if (!toilet[t.id]) { alert(`請填寫廁所觀察「${t.name}」`); return; }
            if (toilet[t.id] === '不符合' && t.opts && t.opts.length && !(toiletReasons[t.id] || []).length) {
              alert(`廁所觀察「${t.name}」為不符合，請選擇不合格項目`); return;
            }
          }
        }

        // 照片必拍檢查：可拍照店鋪（含編輯），沿用原照片或本次新傳皆可滿足
        if (canPhoto) {
          for (const k of checklist.keyObservations) {
            if (!(keyObs[k.id] || []).length && !hasExisting([monthFolder, k.name])) { alert(`「${k.name}」為必拍重點觀察題`); return; }
          }
          if (noDeductDefect) {
            for (const z of PERFECT_ZONES) { if (!(perfectPhotos[z] || []).length && !hasExisting([monthFolder, '滿分照片', z])) { alert(`無缺失店鋪：滿分照片區「${z}」必須上傳照片`); return; } }
          } else {
            for (const c of checklist.categories) for (const it of c.items) {
              const s = scores[it.id]; const sc = (s && s.score != null) ? s.score : it.max; const ng = sc < it.max;
              if (ng && (!s?.photos || !s.photos.length) && !hasExisting([monthFolder, it.name, '缺失'])) { alert(`「${it.name}」有扣分，請補上缺失照片`); return; }
            }
          }
          if (toilet['O1'] === '有') {
            for (const t of checklist.toiletInspect) {
              if (toilet[t.id] === '不符合' && !(toiletPhotos[t.id] || []).length && !hasExisting([monthFolder, '廁所觀察', t.name, '缺失'])) { alert(`廁所觀察「${t.name}」為不符合，請補上缺失照片`); return; }
            }
          }
        }
        const staff = STAFFS.find(s => s.id === basic.staffId);
        const storeName = effStore ? effStore.name : '';
        const storeCode = effStore ? effStore.code : '';
        const recId = editingRecordId || ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now());

        const detail = {};
        checklist.categories.forEach(c => c.items.forEach(it => {
          const s = scores[it.id] || {};
          detail[it.id] = { name: it.name, score: (s.score != null ? s.score : it.max), ngSubs: s.ngSubs || [], customNames: s.customNames || {} };
        }));
        const observation = { toilet, obsText, toiletReasons };

        // 照片：編輯時以原有照片JSON 為基底，新增的接在後面
        const queue = [], photosJson = isEdit ? JSON.parse(JSON.stringify(existingPhotos || {})) : {};
        if (isEdit) {
          // 編輯時若項目已從缺失改為合格，清掉過時的缺失照片紀錄，避免資料不一致
          checklist.categories.forEach(c => c.items.forEach(it => {
            const s = scores[it.id] || {};
            const ng = (s.score != null ? s.score : it.max) < it.max;
            const key = [monthFolder, it.name, '缺失'].join('/');
            if (!ng) delete photosJson[key];
          }));
          checklist.toiletInspect.forEach(t => {
            const key = [monthFolder, '廁所觀察', t.name, '缺失'].join('/');
            if (toilet[t.id] !== '不符合') delete photosJson[key];
          });
        }
        const addPhotos = (pathParts, arr) => {
          if (!arr || !arr.length) return;
          const key = pathParts.join('/');
          photosJson[key] = photosJson[key] || [];
          arr.forEach((p) => {
            const idx = photosJson[key].length + 1;
            const name = `${storeCode || 'S'}_${basic.time.slice(0, 10)}_${key.replace(/[\/\s]/g, '')}_${idx}.jpg`;
            photosJson[key].push(name);
            queue.push({ blob: p.blob, name, pathParts, thumb: p.thumb });
          });
        };
        if (canPhoto) {
          checklist.categories.forEach(c => c.items.forEach(it => {
            const s = scores[it.id] || {};
            if ((s.score != null ? s.score : it.max) < it.max) addPhotos([monthFolder, it.name, '缺失'], s.photos);
          }));
          checklist.keyObservations.forEach(k => addPhotos([monthFolder, k.name], keyObs[k.id]));
          checklist.toiletInspect.forEach(t => { if (toilet[t.id] === '不符合') addPhotos([monthFolder, '廁所觀察', t.name, '缺失'], toiletPhotos[t.id]); });
          if (noDeductDefect) PERFECT_ZONES.forEach(z => addPhotos([monthFolder, '滿分照片', z], perfectPhotos[z]));
        }
        addPhotos([monthFolder, 'SQC點檢表完成照片'], paperForm);

        const record = {
          id: recId, month: workMonth, time: basic.time.replace('T', ' '),
          dept: basic.dept, section: basic.section, empId: basic.staffId, staffName: staff ? staff.name : user,
          storeCode, storeName, storeType: canPhoto ? '可拍照' : '不可拍照',
          total, grade: grade.txt, staffCount: sign.count, identity: sign.identity,
          note: [noPhotoReasonText, sign.remark.trim() ? '｜備註：' + sign.remark.trim() : ''].join(''),
          detail, observation, photos: photosJson, paperPhotos: (photosJson[[monthFolder, 'SQC點檢表完成照片'].join('/')] || []),
        };

        queue.forEach(q => SqcUploader.enqueue({ ...q, recordId: recId, month: workMonth }));

        // 紀錄依「點檢時間」分月存放。編輯時若把點檢時間改到別的月份，該筆就必須從原月份活頁搬到新月份，
        // 否則用新月份去更新會找不到原列(原紀錄不會被改到)。搬移採「先寫入新月份、成功後才刪原月份」的順序，
        // 中途失敗時寧可暫時重複(看得到、可補救)，也不要先刪造成資料遺失。
        const origMonth = editingMonth || workMonth;
        const crossMonth = isEdit && origMonth !== workMonth;
        if (crossMonth && !confirm(`點檢時間已改到 ${monthFolderOf(workMonth)}，這筆紀錄會從 ${monthFolderOf(origMonth)} 搬到 ${monthFolderOf(workMonth)}。\n確定要這樣做嗎？`)) return;

        const api = !isEdit ? SqcApi.submitRecord(record)
          : !crossMonth ? SqcApi.updateRecord(origMonth, recId, record)
            : SqcApi.submitRecord(record).then(res => {
              if (res && res.ok === false) return res; // 新月份該店已有紀錄 → 中止搬移，原紀錄保持不動
              return SqcApi.deleteRecord(origMonth, recId).then(() => res);
            });
        api.then((result) => {
          if (result && result.ok === false) {
            // 後端二次把關（如同店本月已被他人搶先送出）
            alert('⚠ ' + (result.message || '送出失敗，請稍後再試'));
            if (result.code === 'DUPLICATE') { setInspectedCodes(prev => ({ ...prev, [normCode(storeCode)]: true })); setTab('basic'); }
            return;
          }
          alert(`✅ ${isEdit ? '已更新' : '已送出'}\n店鋪：${storeName}　得分：${total}/${TOTAL_MAX}（${grade.txt}）` + (queue.length ? `\n新增照片 ${queue.length} 張背景上傳中` : ''));
          if (!isEdit) setInspectedCodes(prev => ({ ...prev, [normCode(storeCode)]: true }));
          resetWork(); setTab('records'); loadRecords();
        }).catch(e => alert((isEdit ? '更新' : '送出') + '失敗：' + e.message));
      };

      // ---- 查詢/彙總篩選 ----
      const [filter, setFilter] = useState({ from: taipeiToday(), to: taipeiToday(), section: '' });
      const filtered = records.filter(r => (!filter.from || r.date >= filter.from) && (!filter.to || r.date <= filter.to) && (!filter.section || r.section === filter.section));
      // 正式模式：進查詢/彙總頁或改條件時，重新向後端查當月
      // 只在切換進「查詢紀錄/彙總」分頁時自動查一次；改變日期/課別後需按「查詢」才會重新查詢
      useEffect(() => { if (CONFIGURED && (tab === 'records' || tab === 'summary')) loadRecords(); }, [tab]);
      const delRecord = (id, recordMonth) => {
        if (!confirm('確定刪除此筆評核紀錄？')) return;
        if (!CONFIGURED) { setRecords(records.filter(r => r.id !== id)); return; }
        SqcApi.deleteRecord(recordMonth || workMonth, id).then(() => loadRecords()).catch(e => alert('刪除失敗：' + e.message));
      };


      // 匯出「當月名單中尚未點檢」的店鋪（本月已點檢者排除；可依課別）
      const exportUninspected = async () => {
        let done = new Set();
        if (CONFIGURED) {
          const q = await SqcApi.queryRecords(workMonth, { section: filter.section });
          (q.records || []).forEach(r => done.add(normCode(r.storeCode)));
        } else {
          records.forEach(r => done.add(String(r.store)));
        }
        const roster = STORE_ROSTER.filter(s => !filter.section || s.section === filter.section);
        const pending = roster.filter(s => !done.has(normCode(s.code)) && !done.has(String(s.name)));
        if (!pending.length) { alert('當月名單中沒有尚未點檢的店鋪 🎉'); return; }
        const head = ['店號', '店名', '課別', '店鋪型態'];
        const data = [head].concat(pending.map(s => [padStoreCode(s.code), s.name, s.section, s.type || '一般店']));
        const ws = XLSX.utils.aoa_to_sheet(data);
        ws['!cols'] = [{ wch: 12 }, { wch: 18 }, { wch: 10 }, { wch: 10 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '尚未點檢');
        XLSX.writeFile(wb, `SQC尚未點檢_${workMonth}${filter.section ? '_' + filter.section : ''}.xlsx`);
      };

      // 產出課長版/客戶版月報表（管理者限定；後端已彙整明細+KPI+照片連結，這裡負責排版成跟人工版本對應的分頁）
      // 課長版：盤點中心&隨盤點、不及格店、查核店鋪名單、SQC Google點檢表單、SQC週彙總表
      // 客戶版：查核店鋪名單、SQC Google點檢表單、SQC週彙總表（不含內部管理用的部課對照與不及格店名單）
      // 註：顏色/格線樣式(查核店鋪名單) SheetJS免費版無法寫入，改用ExcelJS產出整份報表
      const [buildingManager, setBuildingManager] = useState(false);
      const [buildingCustomer, setBuildingCustomer] = useState(false);

      // 依 aoa(二維陣列)+merges 建立一般(無樣式)分頁
      const addPlainSheet = (wb, name, aoa, merges) => {
        const ws = wb.addWorksheet(name);
        aoa.forEach(row => ws.addRow(row));
        (merges || []).forEach(m => ws.mergeCells(m.s.r + 1, m.s.c + 1, m.e.r + 1, m.e.c + 1));
        return ws;
      };

      // 盤點中心&隨盤點：部/課對照表（來自點檢人員主檔）
      const buildDeptSectionSheet = (report) =>
        [['部', '課']].concat(report.deptSectionList.map(d => [d.部, d.課]));

      // 不及格店：本次查詢範圍內未達及格分數的店
      const buildFailStoreSheet = (report) => {
        const fails = report.rows.filter(r => r.合計 < report.passScore);
        const head = ['序號', '分數', '店號', '店名', '日期-時間', '主責課', '點檢人員', '部別', '課別', '擔當'];
        return [head].concat(fails.map((r, i) => [
          i + 1, `${r.合計} / 100`, padStoreCode(r.店號), r.店名, timeCompact(r.點檢時間), r.主責課, r.點檢人員, r.營業部, r.營業課別, r.營業擔當,
        ]));
      };

      // 查核店鋪名單：左半＝名單逐店的實際點檢狀態；右半＝課別KPI彙總(黃底標頭+全框線)
      // 註：人工版右側原本是逐週手動插入的日曆式進度表，會依每月點檢梯次數量而異，屬於人工排版產物、
      // 無法穩定重現；這裡改用等價、乾淨的一張「課別×期間KPI」表取代，資訊涵蓋範圍相同
      const buildRosterCheckSheet = (wb, report, customerFacing) => {
        const ws = wb.addWorksheet('查核店鋪名單');
        const byCode = {}; report.rows.forEach(r => { byCode[normCode(r.店號)] = r; });
        const head = customerFacing
          ? ['序', '既存店號', '店舖名稱', '部別', '課別', '擔當', '地址', '隨盤點', '預排梯次', '日期', '是(否)點檢']
          : ['序', '既存店號', '店舖名稱', '部別', '課別', '擔當', '地址', '隨盤點', '實際點檢課', '實際點檢人員', '實際點檢梯次', '主責課', '預排梯次', '日期', '是(否)點檢'];
        const rosterRows = report.roster.map((s, i) => {
          const rec = byCode[normCode(s.店號)];
          const common = [i + 1, padStoreCode(s.店號), s.店名, s.營業部, s.課別, s.營業擔當, s.地址, s.店鋪型態 === '隨盤點點檢店' ? 'V' : ''];
          const tail = rec ? [mmdd(rec.點檢時間), '已點檢'] : ['', '未點檢'];
          return customerFacing
            ? [...common, s.預排梯次 || '', ...tail]
            : [...common, rec ? rec.主責課 : '', rec ? rec.點檢人員 : '', rec ? s.預排梯次 : '', rec ? rec.主責課 : '', s.預排梯次 || '', ...tail];
        });
        const kpiHead = ['課別', '期間', '應點檢(店數)', '已點檢(店數)', '未點檢(店數)', '完成率',
          `≧${report.passScore}分(店數)`, `<${report.passScore}分(店數)`, `<${report.passScore}分(佔比)`, '平均分數', '最高分', '最低分', '不及格店'];
        const period = `${filter.from || ''}~${filter.to || ''}`;
        const kpiRows = report.kpi.map(k => [k.課別, period, k.應點檢, k.已點檢, k.未點檢, k.完成率, k.合格家數, k.不合格家數,
          (k.已點檢 ? Math.round(k.不合格家數 / k.已點檢 * 100) : 0) + '%', k.平均分, k.最高分, k.最低分, k.不及格店]);
        const blankLeft = new Array(head.length).fill('');
        const blankRight = new Array(kpiHead.length).fill('');
        const maxRows = Math.max(rosterRows.length, kpiRows.length);

        ws.addRow([...head, '', ...kpiHead]);
        for (let i = 0; i < maxRows; i++) ws.addRow([...(rosterRows[i] || blankLeft), '', ...(kpiRows[i] || blankRight)]);

        const thin = { style: 'thin', color: { argb: 'FF000000' } };
        const border = { top: thin, left: thin, bottom: thin, right: thin };
        const kpiStartCol = head.length + 2, kpiEndCol = kpiStartCol + kpiHead.length - 1;
        for (let c = kpiStartCol; c <= kpiEndCol; c++) {
          const cell = ws.getRow(1).getCell(c);
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF200' } };
          cell.font = { bold: true };
          cell.border = border;
        }
        for (let r = 2; r <= 1 + maxRows; r++) {
          for (let c = kpiStartCol; c <= kpiEndCol; c++) ws.getRow(r).getCell(c).border = border;
        }
        return ws;
      };

      // SQC週彙總表：逐店逐題分數彙整（大分類/項目/配分三層表頭），比照人工版排版；缺失子項只留13/17題
      const buildWeeklyScoreSheet = (report, customerFacing) => {
        const items = report.checklist;
        const catOrder = report.catOrder;
        const catMax = {}; catOrder.forEach(c => { catMax[c] = items.filter(it => it.cat === c).reduce((s, it) => s + it.max, 0); });
        const tItems = report.obsList.filter(o => o.type === '符合');
        const oItems = report.obsList.filter(o => o.type === '有無');
        const subItems = items.filter(it => ['13', '17'].includes(itemNumberOf(it.name)));
        const subNoteLabel = (it) => (itemNumberOf(it.name) === '13' ? 'FF區空架機台' : '被扣分的【垃圾桶】區域');

        const FIXED = 7; // NO,營業部,營業課別,店號,店名,營業擔當,年份-日期-時間
        const itemStart = FIXED, itemEnd = itemStart + items.length - 1;
        const obsStart = itemEnd + 1, obsEnd = obsStart + (1 + oItems.length) - 1; // 對外廁所(缺失觀察題)合併1欄 + 各O題
        const catStart = obsEnd + 1, catEnd = catStart + catOrder.length - 1;
        const totalCol = catEnd + 1;
        let col = totalCol + 1;
        const deptCols = customerFacing ? [] : [col, col + 1]; if (!customerFacing) col += 2;
        const staffCol = col++, countCol = col++, typeCol = col++;
        const subNoteStart = col; col += subItems.length;
        const totalCols = col;
        const blankRow = () => new Array(totalCols).fill('');

        const row0 = blankRow(); row0[0] = '序';
        items.forEach((it, i) => { row0[itemStart + i] = itemNumberOf(it.name); });
        row0[obsStart] = '觀察題';
        row0[catStart] = '各項\n得分數';
        row0[totalCol] = '合計';
        if (!customerFacing) { row0[deptCols[0]] = '主責部別'; row0[deptCols[1]] = '主責課別'; }
        row0[staffCol] = '點檢人員'; row0[countCol] = '店員在店人數'; row0[typeCol] = '店型態';

        const row1 = blankRow();
        const merges = [{ s: { r: 0, c: obsStart }, e: { r: 0, c: obsEnd } }, { s: { r: 0, c: catStart }, e: { r: 0, c: catEnd } }];
        catOrder.forEach(cat => {
          const idxs = items.map((it, i) => (it.cat === cat ? itemStart + i : -1)).filter(i => i >= 0);
          if (idxs.length) {
            row1[idxs[0]] = `${cat}共${catMax[cat]}分`;
            if (idxs.length > 1) merges.push({ s: { r: 1, c: idxs[0] }, e: { r: 1, c: idxs[idxs.length - 1] } });
          }
        });

        const row2 = blankRow();
        items.forEach((it, i) => { row2[itemStart + i] = bareNameOf(it.name); });
        row2[obsStart] = '對外廁所\n(缺失觀察題)';
        oItems.forEach((o, i) => { row2[obsStart + 1 + i] = o.name; });
        catOrder.forEach(cat => { row2[catStart + catOrder.indexOf(cat)] = `${cat}共${catMax[cat]}分`; });

        const row3 = blankRow();
        row3[0] = 'NO'; row3[1] = '營業部'; row3[2] = '營業課別'; row3[3] = '店號'; row3[4] = '店名'; row3[5] = '營業擔當'; row3[6] = '年份-日期-時間';
        items.forEach((it, i) => { row3[itemStart + i] = it.max; });
        catOrder.forEach(cat => { row3[catStart + catOrder.indexOf(cat)] = catMax[cat]; });
        subItems.forEach((it, i) => { row3[subNoteStart + i] = subNoteLabel(it); });

        const dataRows = report.rows.map((r, i) => {
          const line = blankRow();
          line[0] = i + 1; line[1] = r.營業部; line[2] = r.營業課別; line[3] = padStoreCode(r.店號); line[4] = r.店名; line[5] = r.營業擔當; line[6] = r.點檢時間;
          items.forEach((it, j) => { line[itemStart + j] = r.itemScores[it.id]; });
          const toilet = (r.觀察 || {}).toilet || {}, toiletReasons = (r.觀察 || {}).toiletReasons || {};
          const hasToilet = toilet['O1'] && toilet['O1'] !== '無';
          if (hasToilet) {
            const ngT = tItems.filter(t => toilet[t.id] === '不符合');
            line[obsStart] = ngT.length ? ngT.flatMap(t => toiletReasons[t.id] || []).join('、') : '無以上缺失';
            oItems.forEach((o, j) => { line[obsStart + 1 + j] = toilet[o.id] || ''; });
          } else {
            line[obsStart] = '';
            if (oItems[0]) line[obsStart + 1] = toilet['O1'] || '';
          }
          catOrder.forEach(cat => { line[catStart + catOrder.indexOf(cat)] = r.分類小計[cat]; });
          line[totalCol] = r.合計;
          if (!customerFacing) { line[deptCols[0]] = r.主責部; line[deptCols[1]] = r.主責課; }
          line[staffCol] = r.點檢人員; line[countCol] = r.在店人數; line[typeCol] = r.店型態;
          subItems.forEach((it, j) => { line[subNoteStart + j] = r.itemExtra[it.id] || ''; });
          return line;
        });

        return { aoa: [row0, row1, row2, row3, ...dataRows], merges };
      };

      const exportOneReport = async (customerFacing, setBuilding, label) => {
        if (!CONFIGURED) { alert('請先設定後端連線'); return; }
        setBuilding(true);
        const reportMonth = rocMonth(filter.from); // 依查詢的起始日期決定報表月份，而非「點檢作業」目前的時間
        try {
          const report = await SqcApi.buildMonthlyReport(reportMonth, { section: filter.section });
          // 該月「觀察題」活頁未匯入時後端回空陣列，但點檢當時是用內建預設題目進行的，
          // 報表改用同一份預設定義，否則觀察區的欄位與照片連結會整片空白
          if (!report.obsList || !report.obsList.length) report.obsList = defaultObsList();
          const wb = new ExcelJS.Workbook();
          if (!customerFacing) {
            addPlainSheet(wb, '盤點中心&隨盤點', buildDeptSectionSheet(report));
            addPlainSheet(wb, '不及格店', buildFailStoreSheet(report));
          }
          buildRosterCheckSheet(wb, report, customerFacing);
          addPlainSheet(wb, 'SQC Google點檢表單', buildRawFormSheet(report));
          const weekly = buildWeeklyScoreSheet(report, customerFacing);
          addPlainSheet(wb, 'SQC週彙總表', weekly.aoa, weekly.merges);

          const fromMMDD = (filter.from || '').replace(/-/g, '').slice(4);
          const toMMDD = (filter.to || '').replace(/-/g, '').slice(4);
          const fname = `(${reportMonth})SQC點檢彙總表-${fromMMDD}-${toMMDD}-${report.rows.length}-${label}.xlsx`;
          const buf = await wb.xlsx.writeBuffer();
          const blob = new Blob([buf], { type: 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = fname;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          alert(`✅ 已產出${label}（共 ${report.rows.length} 筆點檢紀錄）`);
        } catch (e) {
          alert(`產出${label}失敗：` + e.message);
        } finally {
          setBuilding(false);
        }
      };
      const exportManagerReport = () => exportOneReport(false, setBuildingManager, '課長版');
      const exportCustomerReport = () => exportOneReport(true, setBuildingCustomer, '客戶版');

      // ---- 請款金額（獨立檔案，比照人工版4分頁；計費基準＝已點檢的店）----
      const [buildingBilling, setBuildingBilling] = useState(false);
      const [billingAsk, setBillingAsk] = useState(null); // { report, sections:[課別], offshore:{課別:金額} }

      // 第一步：取資料並詢問外島交通費（無資料來源，需人工輸入）
      const startBilling = async () => {
        if (!CONFIGURED) { alert('請先設定後端連線'); return; }
        setBuildingBilling(true);
        const reportMonth = rocMonth(filter.from);
        try {
          const report = await SqcApi.buildMonthlyReport(reportMonth, { section: filter.section });
          if (!report.rows.length) { alert('查詢範圍內沒有已點檢紀錄，無法產生請款單'); return; }
          const grouped = SqcBilling.groupStores(report.rows.map(r => ({ 主責部: r.主責部, 主責課: r.主責課 })));
          const sections = [];
          grouped.deptOrder.forEach(d => grouped.byDept[d].sectionOrder.forEach(c => sections.push({ dept: d, section: c })));
          setBillingAsk({ report, reportMonth, sections, offshore: {} });
        } catch (e) {
          alert('取得請款資料失敗：' + e.message);
        } finally {
          setBuildingBilling(false);
        }
      };

      // 第二步：實際產檔
      const finishBilling = async () => {
        const ask = billingAsk;
        setBillingAsk(null);
        setBuildingBilling(true);
        try {
          const { report, reportMonth } = ask;
          const out = SqcBilling.buildBillingSheets(report, report.pricing, ask.offshore, { from: filter.from, to: filter.to });
          const wb = new ExcelJS.Workbook();
          const moneyFmt = (ws) => { ws.eachRow(row => row.eachCell(c => { if (typeof c.value === 'number' && c.value >= 1000) c.numFmt = '#,##0'; })); };
          const add = (name, aoa) => { const ws = addPlainSheet(wb, name, aoa); moneyFmt(ws); return ws; };
          const wsCust = add('請款明細(客戶)', out.客戶);
          // 明細表的「店號」欄鎖成文字格式，避免 Excel 又把 022320 轉成數字 22,320
          const noRow = out.客戶.findIndex(r => r[0] === 'NO');
          if (noRow >= 0) {
            const codeCol = out.客戶[noRow].indexOf('店號') + 1;
            for (let r = noRow + 2; r <= out.客戶.length; r++) wsCust.getRow(r).getCell(codeCol).numFmt = '@';
          }
          add('請款明細(內部)', out.內部);
          Object.keys(out.各課).forEach(n => add(n, out.各課[n]));

          const fromMMDD = (filter.from || '').replace(/-/g, '').slice(4);
          const toMMDD = (filter.to || '').replace(/-/g, '').slice(4);
          const fname = `(${reportMonth})SQC點檢彙總表-${fromMMDD}-${toMMDD}-${out.家數}-請款金額.xlsx`;
          const buf = await wb.xlsx.writeBuffer();
          const blob = new Blob([buf], { type: 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = fname;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          alert(`✅ 已產出請款金額\n計費店數：${out.家數} 家\n未稅 ${out.總表.未稅.toLocaleString()}　稅 ${out.總表.稅金.toLocaleString()}　總計 ${out.總表.總計.toLocaleString()}`);
        } catch (e) {
          alert('產出請款金額失敗：' + e.message);
        } finally {
          setBuildingBilling(false);
        }
      };

      const allSections = DEPTS.flatMap(d => d.sections);

      // ============================================================
      const TABS = [['basic', '📋 基本資料'], ['work', '📝 點檢作業'], ['records', '🔍 查詢紀錄'], ['summary', '📊 彙總專區']]
        .concat(isManager ? [['maintain', '⚙️ 維護專區']] : []);

      return (
        <div className="min-h-screen pb-32">
          <div className="sticky top-0 z-30 bg-emerald-700 text-white px-4 py-3 flex items-center justify-between shadow">
            <div className="flex items-center gap-2"><span className="font-bold">SQC 評核系統</span></div>
            <div className="flex items-center gap-3 text-sm"><span className="opacity-90">{user}</span><button onClick={logout} className="px-3 py-1 bg-white/20 rounded hover:bg-white/30">登出</button></div>
          </div>

          {/* Tabs */}
          <div className="bg-white border-b sticky top-[48px] z-20 overflow-x-auto">
            <div className="flex max-w-4xl mx-auto px-2">
              {TABS.map(([k, label]) => (
                <button key={k} onClick={() => setTab(k)} className={"px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 transition " + (tab === k ? "border-emerald-600 text-emerald-700" : "border-transparent text-slate-500")}>{label}</button>
              ))}
            </div>
          </div>

          <div className="max-w-4xl mx-auto p-4 space-y-4">
            {(loading || retryInfo) && (
              <div className="bg-white rounded-xl shadow-sm p-3">
                <div className="h-1 w-full bg-slate-200 rounded-full overflow-hidden">
                  <div className="h-full w-1/3 bg-emerald-500 rounded-full" style={{ animation: 'sqc-progress 1s ease-in-out infinite' }} />
                  <style>{`@keyframes sqc-progress { 0%{margin-left:0%} 50%{margin-left:67%} 100%{margin-left:0%} }`}</style>
                </div>
                <div className={"text-xs mt-1 " + (retryInfo ? "text-amber-600" : "text-emerald-600")}>{busyText || '載入當月資料中，請稍候…'}</div>
              </div>
            )}
            {bootAt && !loading && (
              <div className="text-xs text-slate-400 flex items-center gap-2 px-1">
                <span>資料更新時間：{fmtStamp(bootAt)}</span>
                <button onClick={() => { setLoading(true); reloadBoot(workMonth).catch(e => setBootWarn('連線不穩，目前顯示上次載入的資料（' + (e.message || '載入失敗') + '）')).finally(() => setLoading(false)); }} className="underline hover:text-slate-600">重新載入</button>
              </div>
            )}
            {bootWarn && <div className="bg-amber-50 border border-amber-200 text-amber-700 text-sm rounded-lg px-3 py-2 flex justify-between items-center gap-3"><span>⚠ {bootWarn}</span><span className="flex items-center gap-2 shrink-0"><button onClick={() => { setLoading(true); reloadBoot(workMonth).catch(e => setBootWarn('連線不穩，目前顯示上次載入的資料（' + (e.message || '載入失敗') + '）')).finally(() => setLoading(false)); }} className="text-amber-700 underline">重新載入</button><button onClick={() => setBootWarn('')} className="text-amber-400">✕</button></span></div>}
            {bootErr && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-3 py-2 flex justify-between items-center gap-3"><span>載入當月資料失敗：{bootErr}（可能連線逾時，請重新登入或稍後再試）</span><span className="flex items-center gap-2 shrink-0"><button onClick={() => { setLoading(true); reloadBoot(workMonth).catch(e => setBootErr(e.message || '載入失敗')).finally(() => setLoading(false)); }} className="text-red-700 underline">重試</button><button onClick={() => setBootErr('')} className="text-red-400">✕</button></span></div>}
            {/* ========== 基本資料 ========== */}
            {tab === 'basic' && (
              <div className="bg-white rounded-xl shadow-sm p-5 space-y-4">
                <h2 className="font-bold text-slate-700">📋 基本資料</h2>
                <div className="grid md:grid-cols-2 gap-4 text-sm">
                  <div><label className="block text-xs text-slate-500 mb-1">點檢時間</label>
                    <input type="datetime-local" value={basic.time} onChange={e => setBasic({ ...basic, time: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-lg" /></div>
                  <div><label className="block text-xs text-slate-500 mb-1">部別</label>
                    <select value={basic.dept} onChange={e => setBasic({ ...basic, dept: e.target.value, section: '' })} className="w-full px-3 py-2 border border-slate-300 rounded-lg">
                      <option value="">— 請選擇 —</option>{DEPTS.map(d => <option key={d.dept}>{d.dept}</option>)}</select></div>
                  <div><label className="block text-xs text-slate-500 mb-1">課別</label>
                    <select value={basic.section} onChange={e => setBasic({ ...basic, section: e.target.value, storeCode: '', staffId: '' })} className="w-full px-3 py-2 border border-slate-300 rounded-lg">
                      <option value="">— 請選擇 —</option>{(DEPTS.find(d => d.dept === basic.dept)?.sections || allSections).map(s => <option key={s}>{s}</option>)}</select></div>
                  <div><label className="block text-xs text-slate-500 mb-1">點檢人員<span className="text-slate-400">（依課別帶出）</span></label>
                    <select value={basic.staffId} onChange={e => { const st = STAFFS.find(x => x.id === e.target.value); setBasic({ ...basic, staffId: e.target.value, dept: st?.dept || basic.dept, section: st?.section || basic.section }); }} className="w-full px-3 py-2 border border-slate-300 rounded-lg">
                      <option value="">— 請選擇 —</option>{STAFFS.filter(s => !basic.section || s.section === basic.section).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
                </div>

                <div>
                  <label className="block text-xs text-slate-500 mb-1">點檢店鋪名單<span className="text-slate-400">（依課別自動帶出，亦可自行新增）</span></label>
                  <select value={basic.storeCode} onChange={e => setBasic({ ...basic, storeCode: e.target.value, customStore: '', customInfo: null })} className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                    <option value="">— 請選擇店鋪 —</option>
                    {sectionStores.map(s => {
                      const isEditingThis = !!editingRecordId && String(s.code) === String(basic.storeCode);
                      const done = inspectedCodes[normCode(s.code)] && !isEditingThis;
                      return <option key={s.code} value={s.code} disabled={done}>{s.code} {s.name}{s.type === '隨盤點點檢店' ? '（隨盤點點檢店）' : ''}{done ? ' ✓已點檢(不可選)' : (isEditingThis ? ' (編輯中)' : '')}</option>;
                    })}
                    <option value="__custom">＋ 自行新增店鋪…</option>
                  </select>
                  {basic.storeCode === '__custom' && (
                    <div className="mt-2">
                      <div className="flex gap-2">
                        <input value={basic.customStore} onChange={e => setBasic({ ...basic, customStore: e.target.value, customInfo: null })}
                          onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); doLookup(); } }}
                          placeholder="輸入店號 或 店名 → 查主檔" className="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm" />
                        <button type="button" onClick={doLookup} className="px-3 py-2 bg-slate-700 text-white rounded-lg text-sm whitespace-nowrap">🔍 查主檔</button>
                      </div>
                      {basic.customInfo && <div className="text-xs text-emerald-600 mt-1">✓ 已選：{basic.customInfo.code} {basic.customInfo.name}<span className="text-slate-400">（營業課：{basic.customInfo.section}；本筆盤點課別＝上方選的課別）</span></div>}
                      {!basic.customInfo && custResults.length > 0 && (
                        <div className="mt-1 border border-slate-200 rounded-lg divide-y max-h-48 overflow-y-auto">
                          {custResults.map(s => (
                            <button type="button" key={s.code} onClick={() => { setBasic({ ...basic, customInfo: s, customStore: s.code + ' ' + s.name }); setCustResults([]); }}
                              className="w-full text-left px-3 py-2 text-sm hover:bg-emerald-50">{s.code} {s.name} <span className="text-slate-400">（營業課：{s.section}）</span></button>
                          ))}
                        </div>
                      )}
                      {!basic.customInfo && custResults.length === 0 && basic.customStore && <div className="text-xs text-slate-400 mt-1">按「查主檔」搜尋；主檔有才可新增</div>}
                    </div>
                  )}
                </div>

                <div>
                  <label className="block text-xs text-slate-500 mb-1">可否拍照<span className="text-red-500">（必選）</span><span className="text-slate-400"> — 決定是否需上傳缺失照片</span></label>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setBasic({ ...basic, storeType: 'photo', noPhotoReason: '', noPhotoOther: '' })} className={"flex-1 py-2.5 rounded-lg border font-medium " + (basic.storeType === 'photo' ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-slate-600 border-slate-300")}>📷 可拍照店鋪</button>
                    <button type="button" onClick={() => setBasic({ ...basic, storeType: 'nophoto' })} className={"flex-1 py-2.5 rounded-lg border font-medium " + (basic.storeType === 'nophoto' ? "bg-amber-500 text-white border-amber-500" : "bg-white text-slate-600 border-slate-300")}>🚫 不可拍照店鋪</button>
                  </div>
                  {basic.storeType === 'nophoto' && (
                    <div className="mt-2 bg-amber-50 border border-amber-200 rounded-lg p-3">
                      <div className="text-xs text-amber-700 mb-1.5">不可拍照原因<span className="text-red-500">（必選）</span></div>
                      <div className="flex flex-wrap gap-2">
                        {['廠區店', '營區店', '其他'].map(r => (
                          <button type="button" key={r} onClick={() => setBasic({ ...basic, noPhotoReason: r })} className={"text-sm px-3 py-1.5 rounded-lg border " + (basic.noPhotoReason === r ? "bg-amber-500 text-white border-amber-500" : "bg-white text-slate-600 border-slate-300")}>{r}</button>
                        ))}
                      </div>
                      {basic.noPhotoReason === '其他' && (
                        <input value={basic.noPhotoOther} maxLength={30} onChange={e => setBasic({ ...basic, noPhotoOther: e.target.value.slice(0, 30) })}
                          placeholder="請輸入原因（上限30字）" className="w-full mt-2 px-3 py-2 border border-slate-300 rounded-lg text-sm" />
                      )}
                    </div>
                  )}
                </div>

                {effStore && basic.storeType && (
                  <div className={"text-sm px-3 py-2 rounded-lg " + (canPhoto ? "bg-emerald-50 text-emerald-700" : "bg-amber-50 text-amber-700")}>
                    <b>{canPhoto ? '可拍照店鋪' : '不可拍照店鋪'}</b>
                    {canPhoto ? 'NG 需缺失照片；無缺失需拍滿分照片區；所有店皆須上傳紙本' : `免拍各項照片，僅須上傳紙本點檢表${noPhotoReasonText ? '（原因：' + noPhotoReasonText + '）' : ''}`}
                  </div>
                )}

                <button onClick={() => setTab('work')} disabled={!readyToWork} className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-semibold rounded-lg">
                  {!effStore ? '請先選擇店鋪' : !basic.storeType ? '請先選擇可否拍照' : !reasonOk ? '請選擇不可拍照原因' : '前往點檢作業 →'}
                </button>
              </div>
            )}

            {/* ========== 點檢作業 ========== */}
            {tab === 'work' && (!readyToWork ? (
              <div className="bg-white rounded-xl shadow-sm p-8 text-center text-slate-500">請先到「基本資料」選好店鋪與店鋪型態<br /><button onClick={() => setTab('basic')} className="mt-3 px-4 py-2 bg-emerald-600 text-white rounded-lg">前往基本資料</button></div>
            ) : (
              <>
                {editingRecordId && <div className="bg-blue-50 border border-blue-200 text-blue-700 text-sm rounded-lg px-3 py-2">✏️ 編輯既有紀錄中——原照片沿用，新增照片為選填；送出將覆蓋這筆</div>}
                <div className="bg-white rounded-xl shadow-sm px-4 py-3 text-sm text-slate-600 flex flex-wrap gap-x-4 gap-y-1">
                  <span>🏪 {effStore.name}</span><span>👤 {STAFFS.find(s => s.id === basic.staffId)?.name || '—'}</span><span>📅 {basic.time.slice(0, 10)}</span>
                  <span className={"px-2 rounded " + (canPhoto ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700")}>{canPhoto ? '可拍照' : '不可拍照'}</span>
                </div>

                {checklist.categories.map(cat => {
                  const cs = cat.items.reduce((s, it) => { const sc = scores[it.id]; return s + ((sc && sc.score != null) ? sc.score : it.max); }, 0);
                  return (
                    <div key={cat.key} className="bg-white rounded-xl shadow-sm overflow-hidden">
                      <div className="bg-slate-700 text-white px-4 py-2.5 flex justify-between"><span className="font-bold">{cat.name}</span><span className="text-sm">{cs} / {cat.max}</span></div>
                      {cat.items.map(it => <ItemRow key={it.id} item={it} state={scores[it.id]} setState={st => setItemState(it.id, st)} canPhoto={canPhoto} monthFolder={monthFolder} existingCount={existingCountAt([monthFolder, it.name, '缺失'])} />)}
                    </div>
                  );
                })}

                {/* 觀察區 */}
                <div className="bg-white rounded-xl shadow-sm overflow-hidden">
                  <div className="bg-indigo-600 text-white px-4 py-2.5 font-bold">🔍 觀察區（不計分）</div>
                  <div className="p-4 space-y-3">
                    {/* 重點觀察題：僅可拍照店鋪需拍照 */}
                    {canPhoto && checklist.keyObservations.map(k => (
                      <PhotoUpload key={k.id} label={k.name} required photos={keyObs[k.id]} onChange={p => setKeyObs({ ...keyObs, [k.id]: p })} folderPath={`${DRIVE_ROOT}/${monthFolder}/${k.name}`} existingCount={existingCountAt([monthFolder, k.name])} />
                    ))}

                    {/* 對外廁所觀察記錄（條件式顯示） */}
                    <div className="border-t pt-3">
                      <div className="text-sm font-semibold text-slate-600 mb-2">對外廁所觀察記錄</div>
                      <div className="grid md:grid-cols-2 gap-2">
                        {checklist.toiletObservations.map(o => {
                          const o1 = toilet['O1'];
                          const visible = o.show === 'always' ? true : o.show === 'has' ? o1 === '有' : (o1 === '有' || o1 === '廁所封閉');
                          if (!visible) return null;
                          return (
                            <div key={o.id} className="text-sm flex items-center justify-between gap-2">
                              <span className="text-slate-700">{o.name}</span>
                              <div className="flex gap-1 shrink-0">{o.opts.map(v => <button key={v} onClick={() => setToilet({ ...toilet, [o.id]: v })} className={"px-3 py-1 text-xs rounded border " + (toilet[o.id] === v ? "bg-indigo-500 text-white border-indigo-500" : "bg-white text-slate-500 border-slate-300")}>{v}</button>)}</div>
                            </div>
                          );
                        })}
                      </div>
                      {/* 廁所觀察題：僅「有」對外廁所時填 */}
                      {toilet['O1'] === '有' && (
                        <div className="mt-3 space-y-2">
                          {checklist.toiletInspect.map(t => (
                            <div key={t.id} className="text-sm">
                              <div className="flex items-center justify-between gap-2">
                                <span className="text-slate-700 flex-1">{t.name}</span>
                                <div className="flex gap-1 shrink-0">{['符合', '不符合'].map(v => <button key={v} onClick={() => setToilet({ ...toilet, [t.id]: v })} className={"px-3 py-1 text-xs rounded border " + (toilet[t.id] === v ? (v === '符合' ? "bg-emerald-500 text-white border-emerald-500" : "bg-red-500 text-white border-red-500") : "bg-white text-slate-500 border-slate-300")}>{v}</button>)}</div>
                              </div>
                              {toilet[t.id] === '不符合' && t.opts && t.opts.length > 0 && (
                                <div className="mt-1.5 bg-red-50 border border-red-200 rounded-lg p-2">
                                  <div className="text-[11px] text-red-600 mb-1">請選擇不合格項目<span className="text-red-500">（必選）</span></div>
                                  <div className="flex flex-wrap gap-1.5">
                                    {t.opts.map(r => {
                                      const on = (toiletReasons[t.id] || []).includes(r);
                                      const toggle = () => { const cur = toiletReasons[t.id] || []; setToiletReasons({ ...toiletReasons, [t.id]: on ? cur.filter(x => x !== r) : [...cur, r] }); };
                                      return <button key={r} type="button" onClick={toggle} className={"text-xs px-2 py-1 rounded-full border " + (on ? "bg-red-500 text-white border-red-500" : "bg-white text-slate-500 border-slate-300")}>{on ? '✓ ' : ''}{r}</button>;
                                    })}
                                  </div>
                                </div>
                              )}
                              {toilet[t.id] === '不符合' && canPhoto && (
                                <PhotoUpload label="缺失照片（不符合必須拍照）" required photos={toiletPhotos[t.id]} onChange={p => setToiletPhotos({ ...toiletPhotos, [t.id]: p })} folderPath={`${DRIVE_ROOT}/${monthFolder}/廁所觀察/${t.name}/缺失`} existingCount={existingCountAt([monthFolder, '廁所觀察', t.name, '缺失'])} />
                              )}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <textarea value={obsText} onChange={e => setObsText(e.target.value)} rows="2" placeholder="其他觀察記錄（異味、動線阻擋等）…" className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" />
                  </div>
                </div>

                {/* 滿分照片區（僅可拍照店鋪、且全表無缺失時必拍） */}
                {canPhoto && noDeductDefect && (
                  <div className="bg-white rounded-xl shadow-sm overflow-hidden">
                    <div className="bg-amber-500 text-white px-4 py-2.5 font-bold">🏆 滿分照片區（無缺失店鋪必拍）</div>
                    <div className="p-4">
                      <p className="text-xs text-slate-500 mb-2">店鋪無缺失：請拍下列指定區域，每區可上傳 10 張；相鄰區域可共拍一張。</p>
                      <div className="grid md:grid-cols-2 gap-2">
                        {PERFECT_ZONES.map(z => <PhotoUpload key={z} label={z} required photos={perfectPhotos[z]} onChange={p => setPerfectPhotos({ ...perfectPhotos, [z]: p })} folderPath={`${DRIVE_ROOT}/${monthFolder}/滿分照片/${z}`} existingCount={existingCountAt([monthFolder, '滿分照片', z])} />)}
                      </div>
                    </div>
                  </div>
                )}

                {/* 簽核區（所有店）：在店店員人數 / 身分別 / 紙本表格上傳 */}
                <div className="bg-white rounded-xl shadow-sm overflow-hidden">
                  <div className="bg-slate-600 text-white px-4 py-2.5 font-bold">✍️ 簽核與紙本</div>
                  <div className="p-4 space-y-3">
                    <div className="grid md:grid-cols-2 gap-3 text-sm">
                      <div><label className="block text-xs text-slate-500 mb-1">在店店員人數</label>
                        <select value={sign.count} onChange={e => setSign({ ...sign, count: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-lg">
                          <option value="">— 請選擇 —</option>{Array.from({ length: 20 }, (_, i) => i + 1).map(n => <option key={n} value={n}>{n} 人</option>)}</select></div>
                      <div><label className="block text-xs text-slate-500 mb-1">簽名店鋪人員身分別</label>
                        <select value={sign.identity} onChange={e => setSign({ ...sign, identity: e.target.value })} className="w-full px-3 py-2 border border-slate-300 rounded-lg">
                          <option value="">— 請選擇 —</option>{IDENTITIES.map(i => <option key={i}>{i}</option>)}</select></div>
                    </div>
                    <div><label className="block text-xs text-slate-500 mb-1">備註<span className="text-slate-400">（選填，可記錄特殊情況）</span></label>
                      <textarea value={sign.remark} onChange={e => setSign({ ...sign, remark: e.target.value })} rows={2} className="w-full px-3 py-2 border border-slate-300 rounded-lg" placeholder="例：蕃薯機調理中、熱狗機已報修"></textarea></div>
                    <div>
                      <div className="text-sm font-semibold text-slate-600">📄 紙本點檢表上傳<span className="text-red-500 text-xs"> *所有店皆必須上傳才能送出</span></div>

            {/* ========== 維護專區 ========== */}

          {/* 外島交通費輸入（產出請款金額前；系統無此資料來源，需人工輸入，沒有就留空） */}

          {tab === 'work' && readyToWork && (
            <div className="fixed bottom-0 left-0 right-0 bg-white border-t shadow-2xl z-30">
              <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">

                <div className="flex gap-2">
                  {editingRecordId && <button onClick={() => { if (confirm('確定要放棄這次編輯的變更嗎？')) { resetWork(); setTab('records'); } }} className="px-5 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl">返回</button>}
                  <button onClick={submit} className="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg">{editingRecordId ? '完成編輯' : '送出評核'}</button>
                </div>
              </div>
