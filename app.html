<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQC 評核系統</title>
  <script src="vendor/tailwindcss-3.4.17.js"></script>
  <script src="vendor/react-18.3.1.min.js"></script>
  <script src="vendor/react-dom-18.3.1.min.js"></script>
  <script src="vendor/babel-standalone-8.0.4.min.js"></script>
  <!-- xlsx（0.91MB）與 exceljs（0.90MB）只有「產報表」與「Excel 匯入」用得到，
       但點檢人員從來不會用到那兩個功能。原本每次開 App 都要下載並解析這 1.81MB
       （佔全部前端資源的 37%），改為用到才載入 —— 見下方的 ensureLib()。 -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/db.js"></script>
  <script src="js/uploader.js"></script>
  <script src="js/billing.js"></script>
  <style>
    body { font-family: "Noto Sans TC", system-ui, "Microsoft JhengHei", sans-serif; }
    /* 不定量進度條的動畫。定義在這裡而不是各個元件內 —— 原本在五個條件區塊裡各寫一次，
       那些區塊都沒渲染時這段 CSS 就不存在，新加的進度條會不會動要看運氣。 */
    @keyframes sqc-progress { 0% { margin-left: 0%; } 50% { margin-left: 67%; } 100% { margin-left: 0%; } }
    /* 送出被必填擋下時，捲到該處並閃一圈紅框 —— 只捲到位置，使用者還是要自己找是哪一列。
       同樣定義在這裡而不是元件內：那些區塊沒渲染時 CSS 就不存在。 */
    @keyframes sqc-flash {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
      15%, 65% { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.85); }
    }
    .sqc-flash { animation: sqc-flash 2.2s ease-in-out 1; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
  </script>

  <!-- type 必須是 Babel 不認得的（text/plain）：Babel Standalone 會自動掃描並執行
       type="text/jsx" 的 script，而下面又手動 Babel.transform + eval 了一次 ——
       結果整份三千行 JSX 被編譯與執行兩次、createRoot 被呼叫兩次、開場 API 也打兩輪。
       實測（2026-08-26）：改成 text/plain 後求值次數由 2 降為 1。 -->
  <script type="text/plain" id="appCode">
    const { useState, useMemo, useEffect, useRef } = React;
    // 版本字串一律用「台灣時間」的 YYYYMMDD-HHMM。與部署關卡無關 ——
    // 那道關卡看的是資安報告的檔名日期，而 GitHub runner 跑 UTC，兩者不要混在一起。
    const APP_VERSION = '20260904-1117'; // 每次部署更新，用來確認瀏覽器跑的是哪一版（台灣時間）
    // 這一版前端「至少」需要的後端版本。前後端是各自演進的，版本號本來就不會相等
    // （只改前端時後端不動，反之亦然），所以不能用「兩者相等」當健康指標 ——
    // 要比的是「線上後端有沒有舊到缺少本前端需要的 API」。
    // 規則：改了 程式碼.gs 且前端會用到那個改動時，才把這個值提到該後端版本。
    // 需要：submitRecord 等冪、getInspectedCodes、sharePhotoLinks，
    // 以及 repairRecordPhotos 能真的執行（20260827-1519 之前它呼叫一支不存在的函式，
    // 一執行就 ReferenceError；下面開啟編輯時會自動呼叫它，所以列為必要版本）
    // 20260828-1100 起還需要：recomputeScores（維護專區的「分數重算」），
    // 以及報表不再把「有填名稱但沒勾選」的文字列成缺失（分數與報表要一致）
    // 20260828-1559 起還需要：Cloud Run 新格式網址進白名單、Origin 不合法時明確報錯、
    // 以及放行 photoUploadStuck 事件（否則卡住的原因會被後端丟掉，等於沒做）
    // 20260831-1100 起還需要：recordExists（待送佇列改用只讀一欄的確認，
    // 取代會讀整張活頁的 queryRecords —— 送出逾時的人越多、全表讀取越頻繁，
    // 後端會被自己的重試機制拖垮，2026-08-28 現場就是這個形狀）
    // 20260831-1650 起還需要：連線階段的滑動效期（getSession 每次通過驗證就把
    // 6 小時重新計算）。沒有它的話，早上登入的人下午會突然被踢出去。
    // 20260902 起還需要：photoState（照片JSON 為空要視為異常，不可寫成「已同步」）
    const NEEDS_GAS = '20260902-1226';

    /**
     * 從 LINE 等 App 內建瀏覽器開啟時，回傳那個 App 的名字，否則空字串。
     *
     * 為什麼要擋：內建瀏覽器是被託管的 WKWebView，儲存空間可能在 App 關閉時就被清掉 ——
     * 而本系統把待傳照片放在 IndexedDB，等於照片會無聲消失（點檢紀錄還在，照片欄是空的）。
     * 2026-08-28 有兩位同事是從 LINE 的連結進來的。
     * 只認明確的內建瀏覽器，不用「沒有 Safari/ 就算」這種推測，避免誤判 Chrome。
     */
    const IN_APP_BROWSER = (function () {
      const ua = navigator.userAgent || '';
      if (/\bLine\//i.test(ua)) return 'LINE';
      if (/FBAN|FBAV|FB_IAB/i.test(ua)) return 'Facebook';
      if (/Instagram/i.test(ua)) return 'Instagram';
      if (/MicroMessenger/i.test(ua)) return '微信';
      return '';
    })();

    // 全域錯誤攔截：任何未預期錯誤（含 async 事件處理器的未捕捉 rejection）都要顯示出來，
    // 否則按鈕會「按了沒反應」而完全查不到原因
    (function () {
      const seen = {};
      const show = (msg, src) => {
        if (!msg) return;
        const key = String(msg).slice(0, 200);
        if (seen[key]) return; // 同一個錯誤只提示一次，避免連續彈窗
        seen[key] = 1;
        console.error('[SQC 未預期錯誤]', src, msg);
        alert('系統發生未預期錯誤，請截圖此訊息回報：\n\n' + String(msg).slice(0, 800));
      };
      window.addEventListener('error', (e) => show((e.error && (e.error.stack || e.error.message)) || e.message, 'error'));
      window.addEventListener('unhandledrejection', (e) => show((e.reason && (e.reason.stack || e.reason.message)) || String(e.reason), 'promise'));
    })();

    // ============================================================
    // 共用：照片壓縮工具（上傳壓縮 + 縮圖預覽）
    //   目標 800KB~1200KB / 長邊1920px / 品質0.92起 每次-0.1 至<1200KB / 下限0.3 / JPEG
    //   縮圖：固定品質 0.7，僅供畫面顯示
    // ============================================================
    // THUMB_EDGE 320：縮圖只用來畫 64×64 的方框，在 3 倍解析度的手機上 192px 就夠，
    // 取 320 留點餘裕。原本是直接把 1920px 畫布轉 dataURL，等於存了第二份原圖。
    const MAX_EDGE = 1920, MAX_KB = 1200, MIN_Q = 0.3, START_Q = 0.92, THUMB_Q = 0.7, THUMB_EDGE = 320;

    function loadImage(file) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = URL.createObjectURL(file);
      });
    }
    // edge 省略時用 MAX_EDGE（上傳用的尺寸）；畫縮圖時傳 THUMB_EDGE。
    // 也接受 canvas 當來源（縮圖是從已縮好的畫布再縮一次，不必重新解一次原檔）。
    function drawScaled(img, edge) {
      const max = edge || MAX_EDGE;
      let { width: w, height: h } = img;
      if (Math.max(w, h) > max) {
        const r = max / Math.max(w, h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      return c;
    }
    function canvasToBlob(canvas, q) {
      return new Promise(res => canvas.toBlob(b => res(b), 'image/jpeg', q));
    }
    async function compressImage(file) {
      const img = await loadImage(file);
      const canvas = drawScaled(img);
      let q = START_Q;
      let blob = await canvasToBlob(canvas, q);
      while (blob.size / 1024 > MAX_KB && q > MIN_Q) {
        q = Math.round((q - 0.1) * 100) / 100;
        blob = await canvasToBlob(canvas, q);
      }
      /**
       * 縮圖要真的是縮圖。
       *
       * 原本這裡是 canvas.toDataURL(...) —— 而 canvas 就是那張完整的 1920px 畫布，
       * 所以「縮圖」其實是一張 1920px 的 JPEG 再轉成 base64（體積再 ×1.33），
       * 常常比 blob 本身還大。而它只被拿去畫一個 64×64 的小方框。
       * 兩份都存進 IndexedDB 的結果就是一張照片吃掉 1.5~2MB，
       * 一支手機測幾天累積數百 MB，最後在配額較小的瀏覽器上整個寫不進去。
       */
      const thumb = drawScaled(canvas, THUMB_EDGE).toDataURL('image/jpeg', THUMB_Q);
      return { name: file.name.replace(/\.[^.]+$/, '') + '.jpg', sizeKB: Math.round(blob.size / 1024), quality: q, thumb, blob };
    }

    // ============================================================
    // 既有照片（Drive）的縮圖載入與放大檢視
    //   照片在腳本擁有者的 Drive 資料夾裡，其他登入者沒有檢視權，所以縮圖一律由後端代取。
    //   同一個 fileId 只取一次（快取），並把同批請求合併成一次往返。
    // ============================================================
    const ThumbCache = { map: {}, waiting: [], timer: null, listeners: new Set() };
    function thumbOf(fileId) { return ThumbCache.map[fileId]; }   // undefined=還沒取、''=取不到、其他=dataURL
    function requestThumb(fileId) {
      if (!fileId || ThumbCache.map[fileId] !== undefined) return;
      if (ThumbCache.waiting.indexOf(fileId) < 0) ThumbCache.waiting.push(fileId);
      if (ThumbCache.timer) return;
      ThumbCache.timer = setTimeout(() => {
        const ids = ThumbCache.waiting.splice(0, 40);
        ThumbCache.timer = null;
        if (!ids.length) return;
        SqcApi.getPhotoThumbs(ids)
          .then(r => { Object.assign(ThumbCache.map, r.thumbs || {}); })
          .catch(() => { ids.forEach(id => { ThumbCache.map[id] = ''; }); })   // 失敗也要標記，否則會一直重取
          .finally(() => ThumbCache.listeners.forEach(fn => { try { fn(); } catch (e) { } }));
      }, 120);
    }
    /** 讓元件在縮圖取回後重繪 */
    function useThumbs(fileIds) {
      const [, bump] = useState(0);
      useEffect(() => {
        const fn = () => bump(n => n + 1);
        ThumbCache.listeners.add(fn);
        return () => ThumbCache.listeners.delete(fn);
      }, []);
      (fileIds || []).forEach(requestThumb);
    }
    // 放大檢視：由 App 掛上開啟函式，PhotoUpload 直接呼叫（避免把 props 一路穿過 ItemRow）
    const Lightbox = { open: null };

    function PhotoUpload({ label, photos, onChange, required, max = 10, folderPath, existingCount = 0,
      existing = [], onRemoveExisting = null, needShots = 0 }) {
      const [busy, setBusy] = useState(false);
      const list = photos || [];
      const handleFile = async (e) => {
        const files = Array.from(e.target.files);
        e.target.value = '';
        setBusy(true);
        const out = [];
        for (const f of files) {
          if (list.length + out.length >= max) break;
          try { out.push(await compressImage(f)); } catch (_) {}
        }
        onChange([...list, ...out]);
        setBusy(false);
      };
      const remove = (i) => onChange(list.filter((_, idx) => idx !== i));
      const exList = existing || [];
      useThumbs(exList.map(e => e && e.fileId).filter(Boolean));
      const satisfied = existingCount > 0 || list.length > 0;
      const need = required && !satisfied;
      return (
        <div className={"mt-2 rounded-lg border p-2 " + (need ? "border-red-300 bg-red-50" : "border-slate-200 bg-slate-50")}>
          <div className="flex items-center justify-between gap-2">
            <span className="text-xs font-medium text-slate-600">
              {label}{required && <span className="text-red-500"> *必須</span>}
              <span className="text-slate-400">（{existingCount > 0 ? `新增${list.length}` : list.length}/{max}）</span>
              {existingCount > 0 && <span className="ml-1 text-emerald-600">✓ 已有 {existingCount} 張原照片（免重傳）</span>}
              {needShots > 1 && (list.length + existingCount >= needShots
                ? <span className="ml-1 text-emerald-600 font-bold">✓ 已達需求 {needShots} 張</span>
                : <span className="ml-1 text-red-600 font-bold">需 {needShots} 張（還缺 {needShots - list.length - existingCount} 張）</span>)}
            </span>
            <div className="flex gap-1.5 shrink-0">
              <label className={"text-xs px-2 py-1 rounded cursor-pointer whitespace-nowrap " + (busy ? "bg-slate-300 text-slate-500" : "bg-slate-600 text-white hover:bg-slate-700")}>
                {busy ? '壓縮中…' : '🖼️ 相簿'}
                <input type="file" accept="image/*" multiple className="hidden" onChange={handleFile} disabled={busy} />
              </label>
              <label className={"text-xs px-2 py-1 rounded cursor-pointer whitespace-nowrap " + (busy ? "bg-slate-300 text-slate-500" : "bg-emerald-600 text-white hover:bg-emerald-700")}>
                {busy ? '壓縮中…' : '📷 拍照'}
                <input type="file" accept="image/*" capture="environment" multiple className="hidden" onChange={handleFile} disabled={busy} />
              </label>
            </div>
          </div>
          {folderPath && <div className="text-[10px] text-slate-400 mt-1">📁 {folderPath}</div>}
          {/* 既有照片（Drive）：點縮圖放大；× 標記刪除，按「完成編輯」才真的移入垃圾桶 */}
          {exList.length > 0 && (
            <div className="flex flex-wrap gap-2 mt-2">
              {exList.map((e, i) => {
                const fid = e && e.fileId;
                const nm = (e && e.name) || String(e || '');
                const src = fid ? thumbOf(fid) : '';
                return (
                  <div key={nm + i} className="relative">
                    {src ? (
                      <img src={src} title={nm} onClick={() => Lightbox.open && Lightbox.open({ fileId: fid, name: nm })}
                        className="w-16 h-16 object-cover rounded border-2 border-emerald-400 cursor-zoom-in" />
                    ) : (
                      <div title={nm}
                        onClick={() => fid && Lightbox.open && Lightbox.open({ fileId: fid, name: nm })}
                        className={"w-16 h-16 rounded border-2 border-emerald-400 bg-white flex items-center justify-center text-[9px] text-center px-1 " + (fid ? "cursor-zoom-in text-slate-500" : "text-slate-400")}>
                        {fid ? (src === '' ? '無法預覽' : '載入中…') : '無雲端連結'}
                      </div>
                    )}
                    <span className="absolute bottom-0 inset-x-0 bg-emerald-700/70 text-white text-[9px] text-center">原照片</span>
                    {onRemoveExisting && (
                      <button onClick={() => onRemoveExisting(i)} title="刪除這張（按完成編輯後生效）"
                        className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-xs leading-none">×</button>
                    )}
                  </div>
                );
              })}
            </div>
          )}
          {list.length > 0 && (
            <div className="flex flex-wrap gap-2 mt-2">
              {list.map((p, i) => (
                <div key={i} className="relative">
                  <img src={p.thumb} className="w-16 h-16 object-cover rounded border" />
                  <span className="absolute bottom-0 inset-x-0 bg-black/50 text-white text-[9px] text-center">{p.sizeKB}KB</span>
                  <button onClick={() => remove(i)} className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-xs leading-none">×</button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // MOCK DATA（正式由「維護專區」每月匯入）
    // ============================================================
    const DRIVE_ROOT = 'SQC照片 (Google Drive)';

    // 觀察題預設值（維護專區未匯入觀察題時的內建預設；題庫/店鋪/人員一律由後端載入）
    const DEFAULT_OBS = {
      keyObservations: [
        { id: 'KO1', name: '重點觀察題1.【店外全景照】' },
        { id: 'KO2', name: '重點觀察題2.【櫃台全景照】' },
        { id: 'KO3', name: '重點觀察題3.【FF區全景照】' },
      ],
      toiletObservations: [
        { id: 'O1', name: '店舖有無對外廁所', opts: ['有', '無', '廁所封閉'], show: 'always' },
        { id: 'O2', name: '店舖有無開放對外廁所', opts: ['有', '無'], show: 'has' },
        { id: 'O3', name: '店外招牌有無廁所標示', opts: ['有', '無'], show: 'hasOrClosed' },
        { id: 'O4', name: '店內有無廁所標示', opts: ['有', '無'], show: 'hasOrClosed' },
        { id: 'O5', name: '是否提供備品（衛生紙、洗手乳、芳香劑）', opts: ['有', '無'], show: 'has' },
      ],
      toiletInspect: [
        { id: 'T1', name: '廁所乾淨無髒污及垃圾桶無明顯滿溢' },
        { id: 'T2', name: '落實填寫廁間清潔表；無堆放雜物（ex.紙箱、物流籃、資源回收物…等）' },
      ],
    };
    const IDENTITIES = ['店長', '副店', '正職', 'PT'];
    /**
     * 用到才載入的大型函式庫（xlsx 0.91MB、exceljs 0.90MB，合計佔前端資源 37%）。
     * 只有「產報表」與「Excel 匯入」需要，點檢人員從來不會用到 ——
     * 原本每次開 App 都要下載並解析，在手機上是明顯的延遲。
     * 已載入就直接回；同一支重複呼叫共用同一個 Promise，不會載入兩次。
     * Service Worker 會快取檔案，所以第二次之後只剩解析成本。
     */
    const LIBS = {
      XLSX: 'vendor/xlsx-0.20.3.full.min.js',
      ExcelJS: 'vendor/exceljs-4.4.0.min.js',
    };
    const _libLoading = {};
    function ensureLib(name) {
      // 只允許白名單裡的名稱。目前呼叫端都是字面值，但沒有這道守衛的話，
      // 未知名稱會讓 s.src 變成 undefined 而插入一個指向「undefined」的 script 標籤。
      if (!LIBS[name]) return Promise.reject(new Error('未知的函式庫：' + name));
      if (window[name]) return Promise.resolve(window[name]);
      if (_libLoading[name]) return _libLoading[name];
      _libLoading[name] = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = LIBS[name];
        s.onload = () => window[name]
          ? resolve(window[name])
          : reject(new Error(name + ' 載入後仍不存在'));
        s.onerror = () => {
          delete _libLoading[name];   // 允許重試（例如剛好斷線）
          reject(new Error('無法載入 ' + name + ' 函式庫（' + LIBS[name] + '），請確認網路後再試'));
        };
        document.head.appendChild(s);
      });
      return _libLoading[name];
    }

    const PASS_SCORE = 85;
    // 送出後給照片上傳的緩衝期：這段時間內傳完就不彈進度畫面，只顯示一行成功提示。
    // 順利的店多數在 2~4 秒內完成，不必每一家都被擋一次。
    const POST_GRACE_MS = 4000;
    // 點檢時間的時/分下拉選項
    const pad2 = (n) => String(n).padStart(2, '0');
    const HOURS = Array.from({ length: 24 }, (_, i) => pad2(i));
    const MINUTES = Array.from({ length: 60 }, (_, i) => pad2(i));

    // 報表用的觀察題定義備援：該月「觀察題」活頁未匯入時後端會回空陣列，
    // 但 App 點檢時是用 DEFAULT_OBS 進行(照片資料夾也用這些名稱)，報表必須用同一份定義才對得上
    function defaultObsList() {
      const out = [];
      DEFAULT_OBS.keyObservations.forEach((k, i) => out.push({ id: k.id, type: '拍照', name: k.name, options: [], showIf: 'always', required: true, order: i + 1 }));
      DEFAULT_OBS.toiletObservations.forEach((o, i) => out.push({ id: o.id, type: '有無', name: o.name, options: o.opts || [], showIf: o.show || 'always', required: false, order: 10 + i }));
      DEFAULT_OBS.toiletInspect.forEach((t, i) => out.push({ id: t.id, type: '符合', name: t.name, options: t.opts || [], showIf: 'has', required: false, order: 20 + i }));
      return out;
    }

    // 後端是否已設定（未設定時停用，不載入任何內建假資料）
    const CONFIGURED = !!(window.SQC_CONFIG && window.SQC_CONFIG.GAS_URL && window.SQC_CONFIG.GAS_URL.indexOf('XXXXXXXX') < 0);
    const MONTH = (window.SQC_CONFIG && window.SQC_CONFIG.MONTH) || '11506';

    // 民國年月 11506 → 「115年06月」
    // 一律先轉字串：民國年月從 Sheet 讀出來可能是數字(11508)，直接 .slice() 會拋 TypeError
    function monthFolderOf(m) { const s = String(m == null ? '' : m); return s.slice(0, 3) + '年' + s.slice(3, 5) + '月'; }
    // 台北時間現在（datetime-local 預設值用）
    function taipeiNow() { return new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 16); }
    function taipeiToday() { return taipeiNow().slice(0, 10); }
    // 店號正規化：去除前導0與空白，避免不同來源(店鋪名單/店鋪主檔)格式不一致誤判成不同店
    function normCode(c) { const s = String(c == null ? '' : c).trim(); return s.replace(/^0+(?=\d)/, ''); }
    // 點檢時間(YYYY-MM-DDTHH:mm) → 民國年月，如 2026-07 → 11507
    function rocMonth(dt) { const s = String(dt == null ? '' : dt); if (s.length < 7) return MONTH; return String(parseInt(s.slice(0, 4)) - 1911) + s.slice(5, 7); }
    // 民國年月字串前後推移，如 shiftRocMonth('11512', 1) → '11601'（跨年）
    function shiftRocMonth(m, delta) {
      let y = parseInt(m.slice(0, 3), 10), mo = parseInt(m.slice(3, 5), 10) + delta;
      while (mo > 12) { mo -= 12; y++; }
      while (mo < 1) { mo += 12; y--; }
      return String(y) + String(mo).padStart(2, '0');
    }
    // 維護專區月份下拉選單：以目前月份為準，往前12個月＋往後1個月，確保換月後新月份一定選得到
    function monthOptions(center) {
      const list = [];
      for (let d = -12; d <= 1; d++) list.push(shiftRocMonth(center, d));
      return list;
    }

    // 將後端扁平題目陣列組成 categories 結構（附上固定的觀察題定義）
    function buildChecklist(items, month, obs) {
      const order = [];
      const map = {};
      items.forEach(function (it) {
        if (!map[it.cat]) { map[it.cat] = { key: it.cat, name: it.cat, max: 0, items: [] }; order.push(it.cat); }
        map[it.cat].items.push(it);
        map[it.cat].max += Number(it.max) || 0;
      });
      const O = obs || {};
      const pick = (arr, fb) => (arr && arr.length) ? arr : fb;
      return {
        version: month,
        categories: order.map(function (k) { return map[k]; }),
        keyObservations: pick(O.keyObservations, DEFAULT_OBS.keyObservations),
        toiletObservations: pick(O.toiletObservations, DEFAULT_OBS.toiletObservations),
        toiletInspect: pick(O.toiletInspect, DEFAULT_OBS.toiletInspect),
      };
    }

    // 滿分照片區（無缺失時拍指定區域，每區≤10張）
    const PERFECT_ZONES = ['1.店外全景', '2.櫃台區', '3.貨架區', '4.OC&鮮食區', '5.WI五門', '6.休息區', '7.FF區', '8.落地區'];

    function gradeOf(t) {
      return t >= 95 ? { txt: '優良', c: 'text-emerald-600', bg: 'bg-emerald-100 text-emerald-700' }
        : t >= PASS_SCORE ? { txt: '合格', c: 'text-blue-600', bg: 'bg-blue-100 text-blue-700' }
        : { txt: '不合格', c: 'text-red-600', bg: 'bg-red-100 text-red-700' };
    }

    // ============================================================
    // 報表排版工具（純函式，不依賴畫面狀態；置於元件外方便單獨驗證）
    // ============================================================
    const itemNumberOf = (name) => (String(name).split('.')[0] || '');
    const bareNameOf = (name) => { const s = String(name); const i = s.indexOf('.'); return i >= 0 ? s.slice(i + 1) : s; };
    const timeCompact = (t) => { // "2026-07-15 10:00" → "2026-0715-1000"（比照人工版原始表單時間格式）
      const s = String(t || ''); if (s.length < 16) return s;
      return `${s.slice(0, 4)}-${s.slice(5, 7)}${s.slice(8, 10)}-${s.slice(11, 13)}${s.slice(14, 16)}`;
    };
    const mmdd = (t) => { const s = String(t || ''); return s.length >= 10 ? `${s.slice(5, 7)}/${s.slice(8, 10)}` : ''; };
    const joinLinks = (arr) => (arr || []).join(', ');
    // 依「照片資料夾名稱」比對取連結，不依賴觀察題活頁的題目名稱與上傳當時完全一致
    const groupLinks = (groups, pred) => Object.keys(groups || {}).filter(pred).reduce((acc, k) => acc.concat(groups[k] || []), []);
    const toiletDefectLinks = (r) => groupLinks(r.photoGroups, k => k.indexOf('廁所觀察/') === 0);
    /**
     * 缺失照片的連結。
     *
     * 原本只有 photoGroups[`${it.name}/缺失`] 這一條精準比對，而那個鍵是「送出當時的
     * 題目名稱」，報表用的卻是「產出報表當時的題庫」。兩者只要有一個字不同，連結就會
     * 靜默消失 —— 而且完全沒有警訊：pendingPhotos 是 0（照片確實有 fileId）、
     * 同步狀態是「已同步」。2026-09-01 板橋金鑽店就是在換月匯入新題庫的那天出現這個現象。
     *
     * 重點觀察題早就有「用題號前綴退回比對」的退路，紙本與滿分照片用固定字串，
     * 只有缺失照片沒有退路 —— 補上同樣的做法：題目名稱一律是「N.題名」或「N-M.題名」，
     * 題號比題名穩定得多（改名很常見，改號等於換一題）。
     */
    const itemNoOf = (name) => (String(name || '').match(/^(\d+(?:-\d+)?)\./) || [])[1] || '';
    const itemDefectLinks = (r, it) => {
      const groups = r.photoGroups || {};
      const exact = groups[`${it.name}/缺失`];
      if (exact && exact.length) return exact;
      const no = itemNoOf(it.name);
      if (!no) return [];
      // 只認「同一個題號 + 以 /缺失 結尾」，避免 1. 誤中 10.／15-1. 誤中 15.
      return groupLinks(groups, k => k.indexOf(no + '.') === 0 && /\/缺失$/.test(k));
    };
    // 重點觀察題照片：先用題名精準比對，再退回用「重點觀察題N」前綴（題名被改過時仍找得到）
    const keyObsLinks = (r, obsItem, idx) => {
      const groups = r.photoGroups || {};
      if (groups[obsItem.name] && groups[obsItem.name].length) return groups[obsItem.name];
      const n = (String(obsItem.name).match(/重點觀察題\s*(\d+)/) || [])[1] || String(idx + 1);
      return groupLinks(groups, k => k.indexOf('重點觀察題' + n) === 0);
    };
    /**
     * 報表的「備註」欄。欄位標題本來就寫著「備註(例：廠區店無法拍照)」，
     * 但實際只填了不可拍照的「原因」（如「廠區店」），沒有「無法拍照」這句話。
     * 在報表端補而不是在送出時寫進紀錄的備註欄：後端每一列本來就帶「拍照類型」，
     * 所以已經送出的舊紀錄也會一起正確，不必另外跑一次資料修復。
     */
    const noteCell = (r) => (r.拍照類型 === '不可拍照')
      ? ('無法拍照' + (r.備註 ? '｜' + r.備註 : ''))
      : (r.備註 || '');

    // 店號補回前導0並確保以文字寫入(避免Excel開啟時把"017246"顯示成17246)
    const padStoreCode = (c) => { const s = String(c == null ? '' : c).trim(); return /^\d+$/.test(s) && s.length < 6 ? ('000000' + s).slice(-6) : s; };

    // 觀察區欄名：標準那幾題沿用人工版的原始字樣（保持與人工版對齊），
    // 新增的題目則依活頁題名自動產生欄位 → 觀察題數量不再有上限
    const KO_LEGACY_HEAD = {
      KO1: '重點觀察題1. 【 店外全景照】照片上傳',
      KO2: '重點觀察題2. 【 櫃台全景照】 照片上傳',
      KO3: '重點觀察題3.【  FF區全景照】照片上傳',
    };
    const O_LEGACY_HEAD = {
      O1: '【對外廁所觀察記錄 】店舖有無對外廁所',
      O2: '【對外廁所觀察記錄 】店舖有無開放對外廁所',
      O3: '【對外廁所觀察記錄 】店外招牌有無廁所標示',
      O4: '【對外廁所觀察記錄 】店內有無廁所標示',
      O5: '【對外廁所觀察記錄 】是否有提供以下備品(衛生紙、洗手乳、芳香劑)',
    };
    const koHeadOf = (k) => KO_LEGACY_HEAD[k.id] || (k.name + '照片上傳');
    const oHeadOf = (o) => O_LEGACY_HEAD[o.id] || ('【對外廁所觀察記錄 】' + o.name);

    // SQC Google點檢表單：逐店逐題原始資料，含每題缺失照片雲端連結（比照原本Google表單回覆試算表格式）
    function buildRawFormSheet(report) {
      const items = report.checklist;
      const obsList = report.obsList || [];
      const koItems = obsList.filter(o => o.type === '拍照');
      const oItems = obsList.filter(o => o.type === '有無');
      const oFirst = oItems.slice(0, 1), oRest = oItems.slice(1); // 人工版把O1排在觀察題/缺失照片之前，其餘排在之後
      const zonesA = PERFECT_ZONES.slice(0, 4), zonesB = PERFECT_ZONES.slice(4);

      const head = ['營業部', '營業課別', '營業擔當', '時間戳記', '分數', '店號', '店名', '日期-時間', '點檢人員', '在店店員人數', '簽名店鋪人員身分別'];
      items.forEach(it => {
        head.push(it.name);
        if (it.type === 'subdeduct') head.push(`${it.name}-缺失子項`);
        head.push(`${it.name}-缺失照片上傳`);
      });
      head.push(
        ...oFirst.map(oHeadOf),
        '對外廁所(觀察題) ', '缺失照片上傳',
        ...oRest.map(oHeadOf),
        ...koItems.map(koHeadOf),
        '100分照片上傳-1', '100分照片上傳-2', '備註(例：廠區店無法拍照)', 'SQC點檢表完成照片', '修正原因', '店型態');

      return [head].concat(report.rows.map(r => {
        const line = [r.營業部, r.營業課別, r.營業擔當, r.建立時間, `${r.合計} / 100`, padStoreCode(r.店號), r.店名, timeCompact(r.點檢時間), r.點檢人員, r.在店人數, r.身分別];
        items.forEach(it => {
          line.push(r.itemScores[it.id]);
          if (it.type === 'subdeduct') line.push(r.itemExtra[it.id] || '');
          line.push(joinLinks(itemDefectLinks(r, it)));
        });
        const toilet = (r.觀察 || {}).toilet || {}, toiletReasons = (r.觀察 || {}).toiletReasons || {};
        const hasToilet = toilet['O1'] && toilet['O1'] !== '無';
        // 缺失項目直接取紀錄裡勾選的內容，不經由題目名稱比對（活頁未匯入時仍正確）
        const ngReasons = Object.keys(toiletReasons).reduce((acc, k) => acc.concat(toiletReasons[k] || []), []);
        const oVal = (o) => ((o.showIf === 'always' || hasToilet) ? (toilet[o.id] || '') : '');
        line.push(
          ...oFirst.map(o => toilet[o.id] || ''),
          hasToilet ? (ngReasons.length ? ngReasons.join('、') : '無以上缺失') : '',
          joinLinks(toiletDefectLinks(r)),
          ...oRest.map(oVal),
          ...koItems.map((k, i) => joinLinks(keyObsLinks(r, k, i))),
          joinLinks(zonesA.reduce((acc, z) => acc.concat((r.photoGroups || {})[`滿分照片/${z}`] || []), [])),
          joinLinks(zonesB.reduce((acc, z) => acc.concat((r.photoGroups || {})[`滿分照片/${z}`] || []), [])),
          noteCell(r), joinLinks((r.photoGroups || {})['SQC點檢表完成照片']), '', r.店型態);
        return line;
      }));
    }
    /**
     * 照片檔名的下一個序號：取「既有最大序號+1」，不是陣列長度+1。
     * 為什麼：編輯時刪掉中間某張再新增，用長度會算出與仍存在的檔案相同的序號 →
     * 檔名撞名，而後端的冪等機制會把它當成同一張照片而去認領舊檔，新照片就永遠傳不上去。
     * list 內的項目可能是純檔名字串(舊資料)或 {name, fileId}。
     */
    function nextPhotoIdx(list) {
      let mx = 0;
      (list || []).forEach((e) => {
        const nm = typeof e === 'string' ? e : ((e && e.name) || '');
        const m = /_(\d+)\.jpg$/i.exec(nm);
        if (m) mx = Math.max(mx, parseInt(m[1], 10));
      });
      return mx + 1;
    }

    // ===== 報表共用樣式 =====
    const REPORT_FONT = '微軟正黑體';
    const REPORT_COLORS = {
      深綠: 'FF1F6B3B', 黃: 'FFFFFFCC', 淺綠: 'FFE2EFDA', 淺粉: 'FFF8CBCB',
      紅: 'FFFF0000', 白: 'FFFFFFFF', 粉: 'FFFFC7CE', 紅字: 'FF9C0006',
    };
    const thinBorder = () => { const t = { style: 'thin', color: { argb: 'FF000000' } }; return { top: t, left: t, bottom: t, right: t }; };
    /** 整張表套用字體與置中；leftCols 內的欄位靠左（例如地址不置中）*/
    const applyFontAndCenter = (ws, leftCols) => {
      const noCenter = leftCols || {};
      ws.eachRow({ includeEmpty: true }, (row) => {
        row.eachCell({ includeEmpty: true }, (cell, c) => {
          const prev = cell.font || {};
          // 字體大小要明確指定：只給名稱時 Excel 會套用自己的預設值，某些環境會連帶重算列高
          cell.font = Object.assign({}, prev, { name: REPORT_FONT, size: prev.size || 12 });
          const prevAlign = cell.alignment || {};
          cell.alignment = Object.assign({}, prevAlign, {
            vertical: 'middle',
            horizontal: noCenter[c] ? 'left' : (prevAlign.horizontal || 'center'),
          });
        });
      });
    };

    // ===== 每日店數表（星期/日期/合計/各部，逐週一列一列往下排）=====
    const WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];
    const ymdAdd = (ymd, n) => { const d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const ymdDiff = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000);
    const weekdayCN = (ymd) => WEEK_CN[new Date(ymd + 'T00:00:00Z').getUTCDay()];
    const slashMD = (ymd) => ymd.slice(5, 7) + '/' + ymd.slice(8, 10);
    const DEPT_RANK = { '一部': 1, '二部': 2, '業務部': 3 };
    const sortDepts = (list) => list.slice().sort((a, b) => {
      const ra = DEPT_RANK[a] || 99, rb = DEPT_RANK[b] || 99;
      return ra !== rb ? ra - rb : (a < b ? -1 : 1);
    });

    function buildDailyCountBlock(report, from, to) {
      if (!from) return [];
      const end = to || from;
      // 逐日統計（依主責部），日期取自點檢時間
      const perDay = {}, deptSet = {};
      (report.rows || []).forEach(r => {
        const d = String(r.點檢時間 || '').slice(0, 10);
        const dept = r.主責部 || '(未分類)';
        deptSet[dept] = true;
        if (!perDay[d]) perDay[d] = {};
        perDay[d][dept] = (perDay[d][dept] || 0) + 1;
        perDay[d].__all = (perDay[d].__all || 0) + 1;
      });
      const depts = sortDepts(Object.keys(deptSet));
      const days = ymdDiff(from, end) + 1;
      const weeks = Math.ceil(days / 7);            // 補滿整週（人工版也是排到當週結束）
      const aoa = [['星期', ...Array.from({ length: 7 }, (_, i) => weekdayCN(ymdAdd(from, i)))]];
      for (let w = 0; w < weeks; w++) {
        const cols = Array.from({ length: 7 }, (_, i) => ymdAdd(from, w * 7 + i));
        aoa.push(['日期', ...cols.map(slashMD)]);
        aoa.push(['合計', ...cols.map(d => (perDay[d] && perDay[d].__all) || 0)]);
        depts.forEach(dp => aoa.push([dp, ...cols.map(d => (perDay[d] && perDay[d][dp]) || 0)]));
      }
      return aoa;
    }

    // 課別排序：中文數字要按數值排（直接字串排序會變成 北一→北三→北二）
    // 註：billing.js 也有一份同邏輯，此處自帶以免相依外部檔案載入順序（載入失敗時排序不可默默跑掉）
    const CN_NUM = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
    const cmpSection = (a, b) => {
      const key = (n) => { const m = String(n).match(/^(.*?)([一二三四五六七八九十])(課|區|部)?$/); return (m && CN_NUM[m[2]]) ? [m[1], CN_NUM[m[2]]] : [String(n), 0]; };
      const ka = key(a), kb = key(b);
      if (ka[0] !== kb[0]) return ka[0] < kb[0] ? -1 : 1;
      return ka[1] - kb[1];
    };

    // 課別→部別對照：以「點檢人員主檔」的部課對照為主（涵蓋當月沒有點檢紀錄的課別），
    // 再用實際紀錄補齊；否則零點檢的課別會被歸成「(未分類)」而排到表格最後
    function sectionDeptMap(report) {
      const map = {};
      (report.deptSectionList || []).forEach(d => { if (d.課) map[d.課] = d.部; });
      (report.rows || []).forEach(r => { if (r.主責課 && !map[r.主責課]) map[r.主責課] = r.主責部 || '(未分類)'; });
      return map;
    }

    /**
     * 每家店的「有效課別」：實際由哪一課點的就算那一課，沒點過的才用名單的預排。
     * 與梯次同一個規則 —— 實際與預排不符時一律以實際為準，否則原課永遠掛著未點檢、
     * 新課出現已點檢大於應點檢，兩邊的完成率都到不了 100%。
     * 回傳 (店號, 名單課別) => 課別 的查詢函式（先建索引，避免每家店都掃一次紀錄）。
     */
    function effSectionOf(report) {
      const recOf = {};
      (report.rows || []).forEach(r => { const c = normCode(r.店號); if (c) recOf[c] = r; });
      return (code, planned) => {
        const c = normCode(code);
        const rec = c ? recOf[c] : null;
        return (rec && rec.主責課) || planned || '(未分類)';
      };
    }

    // ===== 課別KPI表：合計 → 各部的各課 → 該部小計（比照人工版含小計列）=====
    function buildKpiBlock(report, periodLabel) {
      const pass = Number(report.passScore) || 85;
      const roster = report.roster || [], rows = report.rows || [];
      const deptOfSection = sectionDeptMap(report);
      const sections = [];
      roster.forEach(s => { if (s.課別 && sections.indexOf(s.課別) < 0) sections.push(s.課別); });
      rows.forEach(r => { if (r.主責課 && sections.indexOf(r.主責課) < 0) sections.push(r.主責課); });
      sections.sort(cmpSection);

      // 應點檢的歸屬要跟著「實際由哪一課點的」走（與主責課、梯次同一個規則）。
      // 否則實際換課點的那家店會在原課永遠掛著未點檢、在新課出現已點檢>應點檢，兩邊都到不了 100%。
      const eff = effSectionOf(report);
      const planBySec = {}; roster.forEach(s => { const k = eff(s.店號, s.課別); planBySec[k] = (planBySec[k] || 0) + 1; });
      const doneBySec = {}; rows.forEach(r => { (doneBySec[r.主責課] = doneBySec[r.主責課] || []).push(r); });
      // 名單外自行新增的店：名單裡沒有它，應點檢也要補上，否則已點檢會大於應點檢
      const inRoster = {}; roster.forEach(s => { const c = normCode(s.店號); if (c) inRoster[c] = true; });
      rows.forEach(r => { if (!inRoster[normCode(r.店號)]) { const k = r.主責課 || '(未分類)'; planBySec[k] = (planBySec[k] || 0) + 1; } });

      // withFails：只有「課別」列要列出不及格店；合計列與部小計列留空，避免同一家店重複出現
      const stat = (secList, withFails) => {
        const plan = secList.reduce((a, s) => a + (planBySec[s] || 0), 0);
        const recs = secList.reduce((a, s) => a.concat(doneBySec[s] || []), []);
        const scores = recs.map(r => Number(r.合計)).filter(v => !isNaN(v));
        const okCnt = scores.filter(v => v >= pass).length;
        const ngCnt = scores.length - okCnt;
        const fails = recs.filter(r => Number(r.合計) < pass).map(r => r.店名);
        // 百分比輸出「比例數值」(0~1)、分數輸出數值，交由 Excel 套用百分比/小數格式，
        // 這樣欄位可繼續被計算，也不會出現文字型數字
        return [plan, scores.length, plan - scores.length,
          plan ? scores.length / plan : '',
          okCnt, ngCnt,
          scores.length ? ngCnt / scores.length : '',
          scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : '',
          scores.length ? Math.max.apply(null, scores) : '',
          scores.length ? Math.min.apply(null, scores) : '',
          withFails ? fails.join('、') : ''];
      };

      // 第一欄標頭＝期間，其下即為列名（合計/各課/各部），與資料列欄數必須一致
      const head = ['期間' + periodLabel, '應點檢\n(店數)', '已點檢\n(店數)', '未點檢\n(店數)', '完成率',
        `≧${pass}分\n(店數)`, `<${pass}分\n(店數)`, `<${pass}分\n(佔比)`, '平均分數', '最高分', '最低分', '不及格店'];
      const aoa = [head, ['合計', ...stat(sections, false)]];
      const byDept = {};
      sections.forEach(s => { const d = deptOfSection[s] || '(未分類)'; (byDept[d] = byDept[d] || []).push(s); });
      sortDepts(Object.keys(byDept)).forEach(d => {
        byDept[d].forEach(s => aoa.push([s, ...stat([s], true)])); // 不及格店只列在課別列
        aoa.push([d, ...stat(byDept[d], false)]);
      });
      return aoa;
    }

    // ===== 梯次表（各課/部的預計點檢 vs 實際點檢；預計來自店鋪名單的預排梯次）=====
    function buildBatchBlock(report, periodLabel) {
      const roster = report.roster || [], rows = report.rows || [];
      const batchOf = (v) => String(v || '').trim();
      const NONE = '(未列梯次)';   // 判不出梯次的也要有欄位，否則合計會少掉幾筆，數字對不起來
      const recOf = {};
      rows.forEach(r => { const c = normCode(r.店號); if (c) recOf[c] = r; });   // 店號空白不可當成一把「通用鑰匙」
      // 每家店的「有效梯次」：點過的以實際點檢日期落在哪一梯為準，沒點的用名單的預排。
      //   預計側也用有效梯次（而非原預排）—— 脫期的店若預計留在第一梯、實際算在第二梯，
      //   兩梯永遠各差一筆，全部點完也到不了 100%。原預排在名單裡另有一欄可查。
      const effOf = (code, planned) => {
        const c = normCode(code);
        const rec = c ? recOf[c] : null;
        return batchOf(rec ? (rec.實際梯次 || rec.預排梯次) : '') || batchOf(planned) || NONE;
      };
      const inRoster = {};
      roster.forEach(s => { const c = normCode(s.店號); if (c) inRoster[c] = true; });
      const batches = [];
      const addBatch = (b) => { if (b && batches.indexOf(b) < 0) batches.push(b); };
      roster.forEach(s => addBatch(effOf(s.店號, s.預排梯次)));
      rows.forEach(r => addBatch(effOf(r.店號, '')));   // 名單外自行新增的店也要有欄位
      batches.sort((a, b) => a === NONE ? 1 : b === NONE ? -1 : (a < b ? -1 : a > b ? 1 : 0));
      if (!batches.length) return [];
      const deptOfSection = sectionDeptMap(report); // 含零點檢課別，順序才會與KPI表一致
      const sections = [];
      roster.forEach(s => { if (s.課別 && sections.indexOf(s.課別) < 0) sections.push(s.課別); });
      rows.forEach(r => { if (r.主責課 && sections.indexOf(r.主責課) < 0) sections.push(r.主責課); });
      sections.sort(cmpSection);
      const plan = {}, actual = {};
      const bump = (obj, key, b) => { if (!obj[key]) obj[key] = {}; obj[key][b] = (obj[key][b] || 0) + 1; };
      // 課別也要用「有效課別」（實際點的那一課），否則實際換課點的店會算在原課的預計裡，
      // 跟 KPI 表的應點檢對不起來
      const effSec = effSectionOf(report);
      roster.forEach(s => bump(plan, effSec(s.店號, s.課別), effOf(s.店號, s.預排梯次)));
      rows.forEach(r => {
        const b = effOf(r.店號, '');
        bump(actual, r.主責課 || '(未分類)', b);
        // 名單外自行新增的店：名單裡沒有它，預計側也要補上，否則實際會大於預計
        if (!inRoster[normCode(r.店號)]) bump(plan, r.主責課 || '(未分類)', b);
      });

      const head1 = ['期間'], head2 = [periodLabel];
      batches.forEach(b => { head1.push(b, ''); head2.push('預計點檢店數', '實際點檢店數'); });
      const lineOf = (label, p, a) => [label, ...batches.reduce((acc, b) => acc.concat([(p && p[b]) || 0, (a && a[b]) || 0]), [])];
      const sumOf = (keys, src) => keys.reduce((acc, k) => { batches.forEach(b => { acc[b] = (acc[b] || 0) + ((src[k] && src[k][b]) || 0); }); return acc; }, {});

      const aoa = [head1, head2];
      aoa.push(lineOf('合計', sumOf(sections, plan), sumOf(sections, actual)));
      // 依部別分組列出各課，每個部後面接該部小計
      const byDept = {};
      sections.forEach(s => { const d = deptOfSection[s] || '(未分類)'; (byDept[d] = byDept[d] || []).push(s); });
      sortDepts(Object.keys(byDept)).forEach(d => {
        byDept[d].forEach(s => aoa.push(lineOf(s, plan[s], actual[s])));
        aoa.push(lineOf(d, sumOf(byDept[d], plan), sumOf(byDept[d], actual)));
      });
      return aoa;
    }

    // SQC週彙總表樣式：完整格線、微軟正黑體、資料置中、
    //   合計不及格→紅底白字、各項得分0分→粉紅底紅字、B~G欄有資料→淺綠底
    function styleWeeklySheet(ws, weekly) {
      const C = REPORT_COLORS, border = thinBorder();
      const m = weekly.meta, rowsTotal = weekly.aoa.length;
      const fillOf = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });

      for (let r = 1; r <= rowsTotal; r++) {
        for (let c = 1; c <= m.totalCols; c++) ws.getRow(r).getCell(c).border = border; // 完整格線
      }
      // 表頭四列淺黃底粗體
      for (let r = 1; r <= m.headRows; r++) {
        for (let c = 1; c <= m.totalCols; c++) {
          const cell = ws.getRow(r).getCell(c);
          cell.fill = fillOf(C.黃); cell.font = { bold: true };
        }
      }
      for (let r = m.headRows + 1; r <= rowsTotal; r++) {
        // B~G欄（營業部/營業課別/店號/店名/營業擔當/年份-日期-時間）有資料就淺綠底
        for (let c = 2; c <= 7; c++) {
          const cell = ws.getRow(r).getCell(c);
          if (cell.value !== '' && cell.value != null) cell.fill = fillOf(C.淺綠);
        }
        // 各項得分 0 分 → 粉紅底紅字
        for (let c = m.itemStart + 1; c <= m.itemEnd + 1; c++) {
          const cell = ws.getRow(r).getCell(c);
          if (cell.value === 0) { cell.fill = fillOf(C.粉); cell.font = { bold: true, color: { argb: C.紅字 } }; }
        }
        // 合計未達及格分數 → 紅底白字
        const tot = ws.getRow(r).getCell(m.totalCol + 1);
        if (typeof tot.value === 'number' && tot.value < m.passScore) {
          tot.fill = fillOf(C.紅); tot.font = { bold: true, color: { argb: C.白 } };
        }
      }

      // 欄寬：避免店名/擔當/機台等文字被截斷（原本未設定，內容一律被切掉）
      const W = { 1: 5, 2: 10, 3: 11, 4: 9, 5: 17, 6: 10, 7: 17 }; // NO/營業部/營業課別/店號/店名/營業擔當/年份-日期-時間
      for (let c = m.itemStart + 1; c <= m.itemEnd + 1; c++) W[c] = 6;          // 各題得分
      W[m.obsStart + 1] = 22;                                                   // 對外廁所(缺失觀察題)
      for (let c = m.obsStart + 2; c <= m.obsEnd + 1; c++) W[c] = 15;            // 各廁所有無題
      for (let c = m.catStart + 1; c <= m.catEnd + 1; c++) W[c] = 9;             // 分類小計
      W[m.totalCol + 1] = 7;                                                    // 合計
      for (let c = m.totalCol + 2; c <= m.subNoteStart; c++) W[c] = 11;          // 主責部/課、點檢人員、在店人數、店型態
      for (let c = m.subNoteStart + 1; c <= m.totalCols; c++) W[c] = 24;         // 缺失子項(機台/垃圾桶區域)
      Object.keys(W).forEach(c => { ws.getColumn(Number(c)).width = W[c]; });

      // dyDescent 必須是合理小數(0~1)。ExcelJS 預設寫 55，Excel 會判定格式異常而在
      // 「開檔時重算整張表的列高」，這正是列高一直變成 12 的根本原因
      ws.properties.dyDescent = 0.25;
      ws.properties.defaultRowHeight = 18; // 連未明確設定的列也是18
      for (let r = 1; r <= rowsTotal; r++) ws.getRow(r).height = 18; // 全表列高統一18
      applyFontAndCenter(ws);
      return ws;
    }

    // 依 aoa(二維陣列)+merges 建立一般(無樣式)分頁
    function addPlainSheet(wb, name, aoa, merges) {
      const ws = wb.addWorksheet(name);
      aoa.forEach(row => ws.addRow(row));
      (merges || []).forEach(m => ws.mergeCells(m.s.r + 1, m.s.c + 1, m.e.r + 1, m.e.c + 1));
      return ws;
    }

    // 不及格店：本次查詢範圍內未達及格分數的店
    function buildFailStoreSheet(report) {
      const fails = report.rows.filter(r => r.合計 < report.passScore);
      const head = ['序號', '分數', '店號', '店名', '日期-時間', '主責課', '點檢人員', '部別', '課別', '擔當'];
      return [head].concat(fails.map((r, i) => [
        i + 1, `${r.合計} / 100`, padStoreCode(r.店號), r.店名, timeCompact(r.點檢時間), r.主責課, r.點檢人員, r.營業部, r.營業課別, r.營業擔當,
      ]));
    }

    // 查核店鋪名單（比照人工版三段式版面）：
    //   左＝名單逐店的實際點檢狀態｜中＝每日店數表（逐週）｜右＝上：課別KPI彙總、下：梯次表
    function buildRosterCheckSheet(wb, report, customerFacing, filter) {
      const ws = wb.addWorksheet('查核店鋪名單');
      const byCode = {}; report.rows.forEach(r => { byCode[normCode(r.店號)] = r; });
      // D/E/F 是「營業組織」（部/課/擔當，取自店鋪主檔），與 SQC 的「主責課」是兩回事 ——
      // 原本 E 欄誤用店鋪名單的課別，導致它與後面的「主責課」欄完全重複，而真正的營業課反而沒出現。
      const head = customerFacing
        ? ['序', '既存店號', '店舖名稱', '部別', '營業課', '擔當', '地址', '隨盤點', '預排梯次', '日期', '是(否)點檢']
        : ['序', '既存店號', '店舖名稱', '部別', '營業課', '擔當', '地址', '隨盤點', '實際點檢課', '實際點檢人員', '實際點檢梯次', '主責課', '預排梯次', '日期', '是(否)點檢'];
      const rosterRows = report.roster.map((s, i) => {
        const rec = byCode[normCode(s.店號)];
        const common = [i + 1, padStoreCode(s.店號), s.店名, s.營業部, s.營業課, s.營業擔當, s.地址, s.店鋪型態 === '隨盤點點檢店' ? 'V' : ''];
        const tail = rec ? [mmdd(rec.點檢時間), '已點檢'] : ['', '未點檢'];
        return customerFacing
          ? [...common, (rec ? rec.預排梯次 : s.預排梯次) || '', ...tail]
          // 主責課與梯次都以「實際」為準（跟梯次同一個規則）：這家店實際由哪一課點的，
          // 主責課就改成那一課；沒點檢的店才沿用名單的預排值。
          // 兩個「實際點檢」欄位只有點過才填，未點檢留空。
          : [...common, rec ? rec.主責課 : '', rec ? rec.點檢人員 : '', rec ? (rec.實際梯次 || '') : '',
            (rec ? rec.主責課 : s.課別) || '', (rec ? rec.預排梯次 : s.預排梯次) || '', ...tail];
      });
      // 期間文字：0801-0819（不含斜線）
      const mmddPlain = (ymd) => String(ymd || '').slice(5, 7) + String(ymd || '').slice(8, 10);
      const periodLabel = `${mmddPlain(filter.from)}-${mmddPlain(filter.to)}`;

      // 中段：每日店數表；右段：KPI（上）＋梯次表（下），中間空一列分隔
      // 客戶版只要左邊的名單本體（A~K欄），不含每日店數表、KPI與梯次表（皆為內部管理用）
      const daily = customerFacing ? [] : buildDailyCountBlock(report, filter.from, filter.to);
      const batch = customerFacing ? [] : buildBatchBlock(report, periodLabel); // 第二列首欄放期間區間文字（第一列已有「期間」標題）
      const right = customerFacing ? [] : buildKpiBlock(report, periodLabel);
      const kpiRowCount = right.length;
      if (batch.length) { right.push([], []); batch.forEach(r => right.push(r)); }

      const LEFT_W = head.length, DAILY_W = daily.length ? 8 : 0;
      const rightW = right.reduce((m, r) => Math.max(m, r.length), 0);
      const pad = (arr, w) => { const o = []; for (let i = 0; i < w; i++) o.push(arr && arr[i] != null ? arr[i] : ''); return o; };
      const n = Math.max(rosterRows.length + 1, daily.length, right.length);

      // 沒有中/右區塊時（客戶版）不可補分隔空欄，否則會多出空白欄位
      const rowOf = (leftArr, i) => {
        const out = pad(leftArr, LEFT_W);
        if (DAILY_W) out.push('', ...pad(daily[i], DAILY_W));
        if (rightW) out.push('', ...pad(right[i], rightW));
        return out;
      };
      ws.addRow(rowOf(head, 0));
      for (let i = 1; i < n; i++) ws.addRow(rowOf(rosterRows[i - 1], i));

      // ===== 樣式 =====
      const border = thinBorder();
      const C = REPORT_COLORS;
      const batchW = batch.length ? batch[0].length : 0; // 梯次表比KPI表窄，樣式不可畫到KPI表的寬度
      const fillOf = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
      const dailyStart = LEFT_W + 2, dailyEnd = dailyStart + DAILY_W - 1;
      const kpiStart = dailyEnd + (DAILY_W ? 2 : 1), kpiEnd = kpiStart + rightW - 1;
      const batchHeadRow = kpiRowCount + 3; // 梯次表第一層表頭所在列

      // 部別名稱（用來判斷小計列上色）：以點檢人員主檔為主，紀錄補齊
      const deptNames = {};
      (report.deptSectionList || []).forEach(d => { if (d.部) deptNames[d.部] = true; });
      report.rows.forEach(r => { if (r.主責部) deptNames[r.主責部] = true; });

      // 整塊套框線（不論有無資料都要有格線）
      const frame = (r1, r2, c1, c2) => {
        for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) ws.getRow(r).getCell(c).border = border;
      };
      frame(1, 1 + rosterRows.length, 1, LEFT_W);                       // 左：名單明細
      if (DAILY_W) frame(1, daily.length, dailyStart, dailyEnd);        // 中：每日店數表
      frame(1, kpiRowCount, kpiStart, kpiEnd);                         // 右上：KPI
      if (batch.length) frame(batchHeadRow, batchHeadRow + batch.length - 1, kpiStart, kpiStart + batchW - 1);

      // 左側標題列：深綠底白字
      for (let c = 1; c <= LEFT_W; c++) {
        const cell = ws.getRow(1).getCell(c);
        cell.fill = fillOf(C.深綠);
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
      }

      // 標頭列（黃底粗體置中）：中段星期列/各週日期列、右上KPI表頭、梯次表兩層表頭
      const headerRows = { 1: true, [batchHeadRow]: true, [batchHeadRow + 1]: true };
      const markHeader = (r, c) => {
        const cell = ws.getRow(r).getCell(c);
        cell.fill = fillOf(C.黃); cell.font = { bold: true };
        cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
      };
      for (let c = dailyStart; c <= dailyEnd; c++) {
        for (let r = 1; r <= daily.length; r++) {
          if (r === 1 || ws.getRow(r).getCell(dailyStart).value === '日期') markHeader(r, c);
        }
      }
      for (let c = kpiStart; c <= kpiEnd; c++) markHeader(1, c);                      // KPI表頭
      for (let c = kpiStart; c < kpiStart + batchW; c++) {                            // 梯次表兩層表頭（僅其自身寬度）
        markHeader(batchHeadRow, c); markHeader(batchHeadRow + 1, c);
      }

      // 合計列淺綠、部別小計列淺粉（KPI表、梯次表、每日店數表同規則）
      const tintRow = (r, c1, c2, argb) => {
        for (let c = c1; c <= c2; c++) ws.getRow(r).getCell(c).fill = fillOf(argb);
      };
      const labelAt = (arr, i) => (arr[i] && arr[i][0] != null ? String(arr[i][0]) : '');
      for (let i = 1; i < right.length; i++) {
        const label = labelAt(right, i), r = i + 1;
        if (r === batchHeadRow || r === batchHeadRow + 1) continue;
        const cEnd = r > batchHeadRow ? kpiStart + batchW - 1 : kpiEnd; // 梯次表區段只塗自身寬度
        if (label === '合計') tintRow(r, kpiStart, cEnd, C.淺綠);
        else if (deptNames[label]) tintRow(r, kpiStart, cEnd, C.淺粉);
      }
      if (DAILY_W) {
        for (let i = 1; i < daily.length; i++) {
          const label = labelAt(daily, i), r = i + 1;
          if (label === '合計') tintRow(r, dailyStart, dailyEnd, C.淺綠);
          else if (deptNames[label]) tintRow(r, dailyStart, dailyEnd, C.淺粉);
        }
      }

      // 數字格式：整數千分位、百分比、分數兩位小數
      const setFmt = (r, c, fmt) => { const cell = ws.getRow(r).getCell(c); if (typeof cell.value === 'number') cell.numFmt = fmt; };
      for (let r = 2; r <= kpiRowCount; r++) {
        [1, 2, 3, 5, 6].forEach(o => setFmt(r, kpiStart + o, '#,##0'));   // 應點檢/已點檢/未點檢/≧/<
        [4, 7].forEach(o => setFmt(r, kpiStart + o, '0.00%'));            // 完成率/不合格佔比
        [8, 9, 10].forEach(o => setFmt(r, kpiStart + o, '0.00'));         // 平均/最高/最低分
      }
      if (batch.length) {
        for (let r = batchHeadRow + 2; r <= batchHeadRow + batch.length - 1; r++) {
          for (let c = kpiStart + 1; c < kpiStart + batchW; c++) setFmt(r, c, '#,##0');
        }
      }
      if (DAILY_W) {
        for (let r = 2; r <= daily.length; r++) for (let c = dailyStart; c <= dailyEnd; c++) setFmt(r, c, '#,##0');
      }

      // 梯次表的「第一梯/第二梯」跨兩欄置中（其下為 預計/實際 兩欄）
      if (batch.length) {
        const batchCount = Math.floor((batch[0].length - 1) / 2);
        for (let j = 0; j < batchCount; j++) {
          const c1 = kpiStart + 1 + j * 2, c2 = c1 + 1;
          try { ws.mergeCells(batchHeadRow, c1, batchHeadRow, c2); } catch (e) { /* 已合併則略過 */ }
          const cell = ws.getRow(batchHeadRow).getCell(c1);
          cell.alignment = { vertical: 'middle', horizontal: 'center' };
          cell.fill = fillOf(C.黃); cell.font = { bold: true }; cell.border = border;
        }
      }

      // 欄寬：避免店名/地址/課別等被截斷
      const wideOf = (name) => ({ '序': 5, '既存店號': 10, '店舖名稱': 17, '部別': 10, '課別': 10, '擔當': 10, '地址': 34, '隨盤點': 8 }[name] || 12);
      head.forEach((h, i) => { ws.getColumn(i + 1).width = wideOf(h); });
      if (DAILY_W) for (let c = dailyStart; c <= dailyEnd; c++) ws.getColumn(c).width = 9;
      if (rightW) { // 客戶版沒有右段，不可建立多餘欄位
        ws.getColumn(kpiStart).width = 13;
        for (let c = kpiStart + 1; c <= kpiEnd - 1; c++) ws.getColumn(c).width = 11;
        ws.getColumn(kpiEnd).width = 42; // 不及格店名單較長
      }

      ws.properties.dyDescent = 0.25; // 同上：避免 Excel 開檔重算列高
      ws.properties.defaultRowHeight = 18;
      for (let r = 1; r <= n; r++) ws.getRow(r).height = 18; // 列高統一
      const leftAlignCols = { [head.indexOf('地址') + 1]: true };
      if (rightW) leftAlignCols[kpiEnd] = true; // 不及格店名單較長，靠左
      applyFontAndCenter(ws, leftAlignCols);
      return ws;
    }

    // SQC週彙總表：逐店逐題分數彙整（大分類/項目/配分三層表頭），比照人工版排版；缺失子項只留13/17題
    function buildWeeklyScoreSheet(report, customerFacing) {
      const items = report.checklist;
      const catOrder = report.catOrder;
      const catMax = {}; catOrder.forEach(c => { catMax[c] = items.filter(it => it.cat === c).reduce((s, it) => s + it.max, 0); });
      const tItems = report.obsList.filter(o => o.type === '符合');
      const oItems = report.obsList.filter(o => o.type === '有無');
      const subItems = items.filter(it => ['13', '17'].includes(itemNumberOf(it.name)));
      const subNoteLabel = (it) => (itemNumberOf(it.name) === '13' ? 'FF區空架機台' : '被扣分的【垃圾桶】區域');

      const FIXED = 7; // NO,營業部,營業課別,店號,店名,營業擔當,年份-日期-時間
      const itemStart = FIXED, itemEnd = itemStart + items.length - 1;
      const obsStart = itemEnd + 1, obsEnd = obsStart + (1 + oItems.length) - 1; // 對外廁所(缺失觀察題)合併1欄 + 各O題
      const catStart = obsEnd + 1, catEnd = catStart + catOrder.length - 1;
      const totalCol = catEnd + 1;
      let col = totalCol + 1;
      const deptCols = customerFacing ? [] : [col, col + 1]; if (!customerFacing) col += 2;
      const staffCol = col++, countCol = col++, typeCol = col++;
      const subNoteStart = col; col += subItems.length;
      const totalCols = col;
      const blankRow = () => new Array(totalCols).fill('');

      const row0 = blankRow(); row0[0] = '序';
      items.forEach((it, i) => { row0[itemStart + i] = itemNumberOf(it.name); });
      row0[obsStart] = '觀察題';
      row0[catStart] = '各項得分數'; // 單行化：配合統一列高18，避免兩行文字被切掉
      row0[totalCol] = '合計';
      if (!customerFacing) { row0[deptCols[0]] = '主責部別'; row0[deptCols[1]] = '主責課別'; }
      row0[staffCol] = '點檢人員'; row0[countCol] = '店員在店人數'; row0[typeCol] = '店型態';
      subItems.forEach((it, i) => { row0[subNoteStart + i] = subNoteLabel(it); }); // 缺失子項標題也放首列，之後整欄縱向合併

      const row1 = blankRow(); row1[0] = '大分類';
      const merges = [{ s: { r: 0, c: obsStart }, e: { r: 0, c: obsEnd } }, { s: { r: 0, c: catStart }, e: { r: 0, c: catEnd } }];
      for (let r = 0; r <= 3; r++) merges.push({ s: { r: r, c: 0 }, e: { r: r, c: FIXED - 1 } }); // 序/大分類/項目/配分 橫跨固定欄
      // 後段欄位(合計/主責部課/點檢人員/在店人數/店型態/缺失子項)標題縱向合併整個表頭，比照人工版
      const tailCols = [totalCol].concat(customerFacing ? [] : deptCols).concat([staffCol, countCol, typeCol])
        .concat(subItems.map((_, i) => subNoteStart + i));
      tailCols.forEach(c => merges.push({ s: { r: 0, c: c }, e: { r: 4, c: c } }));
      catOrder.forEach(cat => {
        const idxs = items.map((it, i) => (it.cat === cat ? itemStart + i : -1)).filter(i => i >= 0);
        if (idxs.length) {
          row1[idxs[0]] = `${cat}共${catMax[cat]}分`;
          if (idxs.length > 1) merges.push({ s: { r: 1, c: idxs[0] }, e: { r: 1, c: idxs[idxs.length - 1] } });
        }
      });

      const row2 = blankRow(); row2[0] = '項目';
      items.forEach((it, i) => { row2[itemStart + i] = bareNameOf(it.name); });
      row2[obsStart] = '對外廁所(缺失觀察題)';
      oItems.forEach((o, i) => { row2[obsStart + 1 + i] = o.name; });
      catOrder.forEach(cat => { row2[catStart + catOrder.indexOf(cat)] = `${cat}共${catMax[cat]}分`; });

      // 配分獨立一列（比照人工版），欄位名稱另成一列，兩者不再擠在同一列
      const row3 = blankRow();
      row3[0] = '配分';
      items.forEach((it, i) => { row3[itemStart + i] = it.max; });
      catOrder.forEach(cat => { row3[catStart + catOrder.indexOf(cat)] = catMax[cat]; });

      const row4 = blankRow();
      row4[0] = 'NO'; row4[1] = '營業部'; row4[2] = '營業課別'; row4[3] = '店號'; row4[4] = '店名'; row4[5] = '營業擔當'; row4[6] = '年份-日期-時間';

      const dataRows = report.rows.map((r, i) => {
        const line = blankRow();
        // 「年份-日期-時間」格式與 SQC Google點檢表單 一致（2026-0805-1350）
        line[0] = i + 1; line[1] = r.營業部; line[2] = r.營業課別; line[3] = padStoreCode(r.店號); line[4] = r.店名; line[5] = r.營業擔當; line[6] = timeCompact(r.點檢時間);
        items.forEach((it, j) => { line[itemStart + j] = r.itemScores[it.id]; });
        const toilet = (r.觀察 || {}).toilet || {}, toiletReasons = (r.觀察 || {}).toiletReasons || {};
        const hasToilet = toilet['O1'] && toilet['O1'] !== '無';
        if (hasToilet) {
          const ngT = tItems.filter(t => toilet[t.id] === '不符合');
          line[obsStart] = ngT.length ? ngT.flatMap(t => toiletReasons[t.id] || []).join('、') : '無以上缺失';
          oItems.forEach((o, j) => { line[obsStart + 1 + j] = toilet[o.id] || ''; });
        } else {
          line[obsStart] = '';
          if (oItems[0]) line[obsStart + 1] = toilet['O1'] || '';
        }
        catOrder.forEach(cat => { line[catStart + catOrder.indexOf(cat)] = r.分類小計[cat]; });
        line[totalCol] = r.合計;
        if (!customerFacing) { line[deptCols[0]] = r.主責部; line[deptCols[1]] = r.主責課; }
        line[staffCol] = r.點檢人員; line[countCol] = r.在店人數; line[typeCol] = r.店型態;
        subItems.forEach((it, j) => { line[subNoteStart + j] = r.itemExtra[it.id] || ''; });
        return line;
      });

      // meta：供樣式套用（欄位位置為0-based，套用時需+1）
      return {
        aoa: [row0, row1, row2, row3, row4, ...dataRows], merges,
        meta: { headRows: 5, itemStart, itemEnd, totalCol, totalCols, passScore: PASS_SCORE, FIXED, obsStart, obsEnd, catStart, catEnd, subNoteStart },
      };
    }



    /**
     * 請款金額活頁簿：依 buildBillingSheets 回報的 frames 畫滿格線（含範圍內沒有資料的儲存格）。
     * 抽成獨立函式是為了能在真實瀏覽器裡驗證產出的 xlsx，而不是只在 Node 驗算資料。
     */
    const buildBillingWorkbook = (out) => {
      const wb = new ExcelJS.Workbook();
      const border = thinBorder();
      const moneyFmt = (ws) => { ws.eachRow(row => row.eachCell(c => { if (typeof c.value === 'number' && c.value >= 1000) c.numFmt = '#,##0'; })); };
      const applyFrames = (ws, frames) => {
        (frames || []).forEach(f => {
          for (let r = f.r1 + 1; r <= f.r2 + 1; r++) {               // frames 為0-based，Excel為1-based
            for (let c = f.c1 + 1; c <= f.c2 + 1; c++) ws.getRow(r).getCell(c).border = border;
          }
        });
      };
      const add = (name, sheet) => {
        const ws = addPlainSheet(wb, name, sheet.aoa);
        moneyFmt(ws);
        applyFrames(ws, sheet.frames);
        ws.properties.dyDescent = 0.25;                              // 避免 Excel 開檔重算列高
        ws.eachRow({ includeEmpty: true }, row => { row.height = 18; });
        applyFontAndCenter(ws);
        return ws;
      };
      const wsCust = add('請款明細(客戶)', out.客戶);
      // 明細表的「店號」欄鎖成文字格式，避免 Excel 又把 022320 轉成數字 22,320
      const noRow = out.客戶.aoa.findIndex(r => r[0] === 'NO');
      if (noRow >= 0) {
        const codeCol = out.客戶.aoa[noRow].indexOf('店號') + 1;
        for (let r = noRow + 2; r <= out.客戶.aoa.length; r++) wsCust.getRow(r).getCell(codeCol).numFmt = '@';
      }
      add('請款明細(內部)', out.內部);
      Object.keys(out.各課).forEach(n => add(n, out.各課[n]));
      return wb;
    };

    window.SqcReport = { buildRawFormSheet, buildDailyCountBlock, buildBatchBlock, buildKpiBlock,
      buildFailStoreSheet, addPlainSheet, styleWeeklySheet, buildRosterCheckSheet, buildWeeklyScoreSheet,
      buildBillingWorkbook, thinBorder, applyFontAndCenter }; // 供離線驗證報表排版用

    // ============================================================
    // 點檢項目列
    // ============================================================
    // 缺失單位數（＝扣分項數）：固定子項用其 units；可填子項用填入的名稱數（至少1）。
    // 抽到 module scope 是因為「送出前檢查缺失照片張數」也要用同一份定義 ——
    // 兩邊各算一次總有一天會不一致（畫面扣 4 分卻只要求 1 張照片之類）。
    const subLabelOf = (sub) => typeof sub === 'string' ? sub : sub.label;
    const subIsCustom = (sub) => typeof sub === 'object' && sub.custom;
    const subFixedUnits = (sub) => (typeof sub === 'object' && sub.units) ? sub.units : 1;
    // 分隔符不含空白：貨架名稱本身就常有空格（「TM 前貨架」、「報架(第二排 靠門)」），
    // 把空白當分隔符會讓一個貨架被算成兩個、多扣一份分數。改成只認明確的符號，
    // 並逐段 trim，這樣「日用品架、 寵物架」也只算兩個。
    const splitNames = (v) => String(v || '').split(/[,，、;；\/|]+/).map(x => x.trim()).filter(Boolean);
    function ngUnitsOf(item, st) {
      const s = st || {};
      return (s.ngSubs || []).reduce((sum, lbl) => {
        const sub = (item.subs || []).find(x => subLabelOf(x) === lbl);
        if (!sub) return sum;
        const named = splitNames(s.customNames?.[lbl]).length;
        return sum + (subIsCustom(sub) ? Math.max(1, named) : subFixedUnits(sub));
      }, 0);
    }
    // 一題最多能扣幾個單位：扣到 0 分之後再多勾也不會更低，
    // 所以缺失照片的張數也不該再往上要求（原本會出現「已經 0 分卻還要 11 張照片」）。
    const maxUnitsOf = (item) => (item.perPoint > 0) ? Math.floor(item.max / item.perPoint) : Infinity;
    const shotsNeededOf = (item, st) => item.type === 'subdeduct'
      ? Math.max(1, Math.min(ngUnitsOf(item, st), maxUnitsOf(item)))
      : 1;
    /**
     * 單一題目的得分 —— 全 App 只有這一個算式。
     *
     * 分區扣分題「不儲存」算出來的分數，一律在用到的當下現算。
     * 原本是由 ItemRow 的 useEffect 把分數寫回 state，而合計／分類小計／送出的明細
     * 都讀那個寫回的值 —— useEffect 是 passive effect，在畫面繪製後才由排程器沖洗，
     * 所以存在「題目列已經顯示新分數、合計卻還是舊的」的窗口（2026-08-27 實測：
     * 取消勾選後的 microtask 階段，題目列 18、分類小計 14/18、合計 96）。
     * 若送出落在那個窗口裡，存進去的分數會比 ngSubs 應得的少扣或多扣，
     * 而編輯時是重算 → 分數又變了。現場回報的「填寫 88、編輯 92」就是這個。
     * 手機上照片壓縮會佔住主執行緒，那個窗口會被拉得更長。
     */
    const scoreOfItem = (item, st) => {
      const s = st || {};
      if (item.type === 'subdeduct') return Math.max(0, item.max - ngUnitsOf(item, s) * item.perPoint);
      return (s.score != null) ? s.score : item.max;
    };

    function ItemRow({ item, state, setState, canPhoto, monthFolder, existingCount = 0, existing = [], onRemoveExisting = null, flash = '' }) {
      const s = state || {};
      const labelOf = subLabelOf;
      const isCustom = subIsCustom;
      const fixedUnits = subFixedUnits;
      const nameUnits = (lbl) => splitNames(s.customNames?.[lbl]).length;

      // 分數一律現算（scoreOfItem），不再寫回 state 也不再有 useEffect 同步 ——
      // 合計、分類小計、送出的明細用的是同一支函式，三處不可能再對不起來。
      const score = scoreOfItem(item, s);
      const isNG = score < item.max;

      /**
       * 一律用「更新函式」改狀態，不可展開 render 當下的 s。
       * s 是快照：同一批更新裡（或照片壓縮這種非同步流程完成時）用它去 spread，
       * 會把期間其他欄位的變更整包蓋回舊值。分數本身已改為現算而不儲存，
       * 但 ngSubs／customNames／photos 仍然是真資料，蓋掉就是掉資料。
       */
      const patch = (fn) => setState(fn);
      const toggleSub = (lbl) => patch(p => {
        const ng = p.ngSubs || [];
        const on = ng.includes(lbl);
        const next = { ...p, ngSubs: on ? ng.filter(x => x !== lbl) : [...ng, lbl] };
        // 取消勾選時要把已填的名稱一起清掉。留著的話那段文字就成了「畫面上看不到、
        // 卻仍在紀錄裡」的隱藏資料 —— 報表會把它列成缺失，分數卻沒扣到它，
        // 兩邊對不起來（現場就是這樣核不出來的）。
        if (on && p.customNames && p.customNames[lbl] != null) {
          const cn = { ...p.customNames };
          delete cn[lbl];
          next.customNames = cn;
        }
        return next;
      });
      const setCustomName = (lbl, v) => patch(p => ({ ...p, customNames: { ...(p.customNames || {}), [lbl]: v } }));

      return (
        <div id={`item-${item.id}`} className={"px-4 py-3 border-b border-slate-100 last:border-0 " + flash}>
          <div className="flex items-start justify-between gap-3">
            <div className="flex-1">
              <div className="font-semibold text-slate-800 text-sm">{item.name}
                <span className="ml-2 text-xs text-slate-400">配分 {item.max}</span>
                <span className={"ml-1 text-[10px] px-1.5 py-0.5 rounded " + (item.type === 'subdeduct' ? "bg-blue-100 text-blue-600" : "bg-amber-100 text-amber-600")}>{item.type === 'subdeduct' ? '分區扣分' : '扣分題'}</span>
              </div>
              <div className="text-xs text-slate-500 mt-0.5 leading-relaxed">{item.desc}</div>
            </div>
            <div className="text-right shrink-0">
              <div className={"text-lg font-bold " + (isNG ? "text-red-500" : "text-emerald-600")}>{score}</div>
              <div className="text-[10px] text-slate-400">得分</div>
            </div>
          </div>

          {item.type === 'subdeduct' && (
            <div className="mt-2">
              <div className="text-[11px] text-slate-400 mb-1">點選「有缺失」的項目（每項 -{item.perPoint} 分，由滿分往下扣）</div>
              <div className="flex flex-wrap gap-1.5">
                {item.subs.map(sub => {
                  const lbl = labelOf(sub);
                  const on = (s.ngSubs || []).includes(lbl);
                  const u = isCustom(sub) ? Math.max(1, nameUnits(lbl)) : fixedUnits(sub);
                  // 顯示的扣分要蓋住配分上限：填了 11 個貨架時原本會顯示 -22，
                  // 但這一題最多只會少 18 分，寫 -22 是騙人的
                  const shown = Math.min(u * item.perPoint, item.max);
                  return <button key={lbl} onClick={() => toggleSub(lbl)} title={sub.note || ''} className={"text-xs px-2 py-1 rounded-full border transition " + (on ? "bg-red-500 text-white border-red-500" : "bg-white text-slate-500 border-slate-300")}>{on ? '✕ ' : ''}{lbl}{sub.note ? ' ⓘ' : ''} -{shown}</button>;
                })}
              </div>
              {/* 可填寫子項：填入名稱（多個以、,/ 分隔，不可用空白），每個名稱扣一個缺失 */}
              {item.subs.filter(sub => isCustom(sub) && (s.ngSubs || []).includes(labelOf(sub))).map(sub => {
                const lbl = labelOf(sub);
                const n = Math.max(1, nameUnits(lbl));
                return (
                  <div key={lbl} className="mt-2">
                    <div className="text-[10px] text-slate-500 mb-0.5">填入{lbl}名稱；<b className="text-red-500">多個貨架請用「、」或「,」「/」隔開</b>，系統依隔開的數量計算扣分。<b>名稱本身可以有空格</b>（如 TM 前貨架）</div>
                    <input value={s.customNames?.[lbl] || ''} onChange={e => setCustomName(lbl, e.target.value)}
                      placeholder="例：日用品架、寵物貨架"
                      className="w-full text-xs px-2 py-1.5 border border-red-300 rounded bg-red-50" />
                    <div className="text-[10px] text-red-500 mt-0.5">辨識為 {nameUnits(lbl)} 個貨架 → 扣 {Math.min(n * item.perPoint, item.max)} 分（{splitNames(s.customNames?.[lbl]).join('｜') || '尚未填寫'}）</div>
                  </div>
                );
              })}
            </div>
          )}

          {item.type === 'deduct' && (
            <div className="flex items-center gap-2 mt-2">
              <button onClick={() => patch(p => ({ ...p, score: item.max }))} className={"text-xs px-4 py-1 rounded border " + (score === item.max ? "bg-emerald-500 text-white border-emerald-500" : "bg-white text-slate-500 border-slate-300")}>合格 ({item.max})</button>
              <button onClick={() => patch(p => ({ ...p, score: 0 }))} className={"text-xs px-4 py-1 rounded border " + (score === 0 ? "bg-red-500 text-white border-red-500" : "bg-white text-slate-500 border-slate-300")}>缺失 (0)</button>
            </div>
          )}

          {isNG && canPhoto && (
            <PhotoUpload label="缺失照片（NG 項目必須拍照記錄）" required needShots={shotsNeededOf(item, s)} photos={s.photos} onChange={ph => patch(p => ({ ...p, photos: ph }))} folderPath={`${DRIVE_ROOT}/${monthFolder}/${item.name}/缺失`} existingCount={existingCount} existing={existing} onRemoveExisting={onRemoveExisting} />
          )}
        </div>
      );
    }

    // ============================================================
    // 主應用
    // ============================================================
    function App() {
      // 統一走 SqcSession（api.js）—— 它會讀 localStorage，並把升級前留在
      // sessionStorage 的舊登入搬過來，所以拿到新版的人不會被登出一次
      const currentUser = (window.SqcSession ? SqcSession.read() : {}) || {};
      const user = currentUser.name || '';
      const isManager = currentUser.role === '管理者';
      const [tab, setTab] = useState('basic');

      // ---- 基本資料 ----（時間用台北；月份由點檢時間決定；登入預帶自己的部/課/姓名）
      // 點檢時間：日期預設當天、時間留空（送出前必填，見 doSubmit 的檢查）
      const [basic, setBasic] = useState({ time: taipeiToday(), dept: currentUser.dept || '', section: currentUser.section || '', staffId: currentUser.empId || '', storeCode: '', customStore: '', customInfo: null, storeType: '', noPhotoReason: '', noPhotoOther: '' });
      const workMonth = rocMonth(basic.time); // 依點檢時間對應的民國年月

      // ---- 開場資料（依 workMonth 由後端載入；載入前為空）----
      const [boot, setBoot] = useState({ checklist: buildChecklist([], MONTH), stores: [], staffs: [], depts: [] });
      const [inspectedCodes, setInspectedCodes] = useState({}); // 當月已有點檢紀錄的店號
      // loaded＝已確認過（可以放心讓人選店）；err＝這次查詢失敗（防重複機制目前是失效的）
      const [inspectedState, setInspectedState] = useState({ loaded: false, err: '' });
      const [custResults, setCustResults] = useState([]);
      const [loading, setLoading] = useState(CONFIGURED);
      const [bootErr, setBootErr] = useState('');
      const [bootWarn, setBootWarn] = useState(''); // 用快取撐著時的提示（非阻斷式）
      const [bootAt, setBootAt] = useState(null);   // 目前這份開場資料是何時取得的（供現場判斷名單夠不夠新）
      const [gasVer, setGasVer] = useState('');     // 後端版本；貼上 程式碼.gs 卻沒重新部署時，這裡不會變
      const [gasStale, setGasStale] = useState(false); // gasVer 目前來自開場快取（尚未真的連上後端）
      /**
       * 連線階段過期。
       *
       * 以前 api.js 遇到 AUTH 會直接跳轉回登入頁，但那條路徑對背景補傳也成立 ——
       * 有人正在填點檢表、連線階段剛好過期，15 秒內的背景重試就會把整頁換掉，
       * 表單全部消失（本系統沒有草稿保存）。改成顯示橫幅，由使用者自己決定何時登入。
       */
      const [authLost, setAuthLost] = useState(false);
      const [authReason, setAuthReason] = useState('');   // 'missing' | 'expired'
      useEffect(() => {
        if (!window.SqcApi || !SqcApi.onAuthLost) return;
        const mark = () => {
          setAuthLost(true);
          setAuthReason(SqcApi.authReason ? SqcApi.authReason() : '');
        };
        if (SqcApi.authLost()) mark();   // 這個元件掛載前就過期了
        return SqcApi.onAuthLost(mark);
      }, []);
      // 背景待處理量：照片沒傳完就關掉 App 會延後上傳，點檢員必須看得到
      const [pendingUp, setPendingUp] = useState({ pending: 0, done: 0, unfinished: 0, orphan: 0, queuedRecords: 0, busy: false, phase: '', lastError: '' });
      useEffect(() => {
        if (!window.SqcUploader) return;
        let alive = true;
        const refresh = () => SqcUploader.counts().then(c => { if (alive) setPendingUp(c); }).catch(() => { });
        refresh();
        const off = SqcUploader.onChange(refresh);   // 每批處理完才觸發，不做輪詢
        return () => { alive = false; off(); };
      }, []);
      /**
       * 送出後的上傳進度畫面。
       * 順利的店幾秒內就傳完，沒必要每一家都彈一次畫面擋人 —— 先給一段緩衝期，
       * 真的還沒完成才彈出來（見 doSubmit 的 POST_GRACE_MS）。
       * 完成與否只能看「這一筆」的照片：全域數字會被別筆還沒傳完的照片污染，
       * 那樣不但永遠等不到完成，還會出現「本筆 8 張都好了」卻同時顯示「未完成 8 張」的矛盾。
       */
      const [postSubmit, setPostSubmit] = useState(null);
      const [postStat, setPostStat] = useState(null);
      const [toast, setToast] = useState('');
      /**
       * 上傳診斷：把這支手機佇列裡每一張的狀態與「失敗原因」攤出來。
       *
       * 為什麼需要：每次上傳失敗的原因本來就存進了 photo.error，但介面只顯示張數 ——
       * 2026-08-27 有人一小時內重試幾百次全數失敗，而事後只能靠猜，因為那個字串
       * 一直躺在她手機的 IndexedDB 裡，沒有任何地方會把它拿出來。
       * 佇列是每支手機各自獨立的，所以這個畫面必須讓點檢人員本人打得開，不能只給管理者。
       */
      const [diag, setDiag] = useState(null);   // null=關閉、[]=沒東西、[...]=清單
      const [diagBusy, setDiagBusy] = useState(false);
      const openDiag = async () => {
        setDiagBusy(true);
        try {
          const list = await SqcDB.photoDiagnostics();
          // 被跳過的照片只存在 uploader 的記憶體裡，photoDiagnostics 讀不到 ——
          // 不併進來的話它們會顯示成「還沒進雲端、沒有任何錯誤」，
          // 看起來像「還沒輪到」，而實際上這一輪根本不會再碰它們。
          const skip = (window.SqcUploader && SqcUploader.skipped) ? SqcUploader.skipped() : {};
          const merged = list.map(p => (skip[p.id] ? { ...p, skipReason: skip[p.id] } : p));
          // 卡最久的排前面，現場要先看的就是那幾張；被跳過的最優先（那是真正卡住的）
          merged.sort((a, b) => (b.skipReason ? 1 : 0) - (a.skipReason ? 1 : 0) || (b.tries || 0) - (a.tries || 0));
          setDiag(merged);
        } catch (e) {
          setDiag([{ id: 'err', name: '(讀取佇列失敗)', status: '?', where: '', tries: 0, error: String(e && e.message || e) }]);
        } finally { setDiagBusy(false); }
      };
      /**
       * 手動清空待傳佇列。
       * 'finished' 只刪已完成的（檔案在雲端、連結已寫回，刪掉不會遺失任何東西）。
       * 'all' 會遺失還沒進雲端的照片，所以確認訊息必須把「幾張會不見」講出來 ——
       * 「確定要清空嗎」這種問法在現場等於沒問。
       */
      const purgeQueue = async (kind) => {
        const lost = diag.filter(p => p.status === 'pending').length;
        const linkOnly = diag.filter(p => p.status === 'done' || p.status === 'orphan').length;
        if (kind === 'all') {
          const lines = ['即將清空這支手機的整個待傳佇列。', ''];
          if (lost) lines.push('⚠ ' + lost + ' 張還沒進雲端的照片會永久遺失，無法補回。');
          if (linkOnly) lines.push('・' + linkOnly + ' 張已在雲端，但會失去連結（可用「維護專區 → 照片連結修復」補回）。');
          if (!lost && !linkOnly) lines.push('目前沒有未完成的照片，這個動作不會遺失任何東西。');
          lines.push('', '確定要清空嗎？');
          if (!confirm(lines.join('\n'))) return;
        }
        setDiagBusy(true);
        try {
          const n = await SqcUploader.purge(kind);
          await openDiag();
          setToast(kind === 'all' ? `🗑 已清空佇列（${n} 筆）` : `🧹 已清掉 ${n} 筆已完成的照片`);
        } catch (e) {
          alert('清理失敗：' + (e && e.message || e));
        } finally { setDiagBusy(false); }
      };
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(''), 4000);
        return () => clearTimeout(t);
      }, [toast]);
      const postRecId = postSubmit && postSubmit.recordId;
      // 這一筆每一張照片的狀態（只取狀態與題目路徑，不取 blob 與 thumb ——
      // thumb 是整張 1920px 的 dataURL，19 張抓進 state 會吃掉十幾MB）
      const [postShots, setPostShots] = useState([]);
      useEffect(() => {
        if (!postRecId || !window.SqcUploader) { setPostStat(null); setPostShots([]); return; }
        let alive = true;
        const refresh = () => {
          SqcUploader.countsOfRecord(postRecId)
            .then(c => { if (alive) setPostStat(c); }).catch(() => { });
          if (window.SqcDB && SqcDB.photosOfRecord) {
            SqcDB.photosOfRecord(postRecId)
              .then(list => {
                if (!alive) return;
                setPostShots(list.map(p => ({
                  id: p.id, status: p.status,
                  // 「115年08月/題目/缺失」→ 只留題目，現場要看的是「哪一題還沒傳完」
                  where: (p.pathParts || []).slice(1).join('/'),
                })));
              }).catch(() => { });
          }
        };
        refresh();
        const off = SqcUploader.onChange(refresh);
        return () => { alive = false; off(); };
      }, [postRecId]);
      /**
       * 兩個不同的門檻，不可以混用：
       *   cloudSafe ＝ 沒有 pending → 所有檔案都已進雲端硬碟 → **可以離開現場**
       *   postDone  ＝ 連 done 都沒有 → 連結也寫回紀錄了 → 整筆結案、面板可自動關閉
       * 現場真正需要的判斷是前者。原本只有 postDone 一個標準，於是照片明明都安全進了雲端，
       * 畫面還在說「請留在現場」、離開還要按確認並記進異動紀錄 —— 那是假警報。
       */
      const cloudSafe = !!postStat && postStat.pending === 0;
      const postDone = !!postStat && postStat.pending === 0 && postStat.done === 0;
      useEffect(() => {
        // 傳完就自動關閉，不必再按一次「完成」；有需要人工處理的才留著讓人看清楚
        if (!postDone || !postStat || postStat.orphan) return;
        const t = setTimeout(() => {
          setToast(`✅ ${postSubmit.store}　${postStat.total} 張照片已全部完成`);
          setPostSubmit(null);
          loadRecords(true);   // 連結已寫回 → 順手刷新清單，「缺 N 張」才不會留在畫面上
        }, 1200);
        return () => clearTimeout(t);
      }, [postDone, postStat && postStat.orphan]);
      // 瀏覽器可能為了回收空間把本站資料清掉（iOS 尤其），照片佇列會跟著消失 →
      // 主動要求「持久化儲存」。要不到也沒關係，只是機率問題。
      useEffect(() => {
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persisted().then(ok => { if (!ok) navigator.storage.persist().catch(() => { }); }).catch(() => { });
        }
      }, []);
      /**
       * 一進來就先踢一次補傳。
       * uploader 只有 setInterval(15秒)、online 事件與「切回前景」三個觸發點，
       * 所以「上次沒傳完、這次重開 App」的情況要白等最多 15 秒才會開始 ——
       * 而使用者常常就是為了補傳才打開的。
       * 放在 App（登入後）而不是 uploader 載入時：pumpRecords 會呼叫需要權杖的
       * queryRecords，未登入時觸發只會失敗並白白累加重試次數。
       */
      useEffect(() => {
        if (CONFIGURED && window.SqcUploader) SqcUploader.pump();
      }, []);
      /**
       * 還有東西沒送完就提醒關掉分頁。
       *
       * 只看 pending（＝檔案還沒進雲端硬碟）與待送出的紀錄，不可以看 unfinished ——
       * unfinished = pending + done，而 done 的檔案「已經在雲端硬碟了」，只差把連結寫回紀錄。
       * 那種情況攔人是假警報：關掉也不會遺失任何照片，連結之後用「照片連結修復」補得回來。
       * 而假警報最大的代價是「訓練大家忽略警告」—— 等到真的有照片沒傳完時也不會理。
       */
      useEffect(() => {
        if (!((pendingUp.pending || 0) + (pendingUp.queuedRecords || 0))) return;
        const warn = (e) => { e.preventDefault(); e.returnValue = ''; return ''; };
        window.addEventListener('beforeunload', warn);
        return () => window.removeEventListener('beforeunload', warn);
      }, [pendingUp.pending, pendingUp.queuedRecords]);
      const fmtStamp = (ts) => {
        if (!ts) return '';
        const d = new Date(ts);
        return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      };
      // 開場資料快取：Google 轉送層偶發不穩時，用上次成功的資料先讓 App 可用，
      // 避免整頁卡在「載入失敗」，也避免題庫為空導致分數被算成 0
      /**
       * 載入失敗的說法要對得上原因。原本一律叫「連線不穩」，等於把四種完全不同的狀況
       * 混在一起（逾時、Google 轉送層異常、登入逾時、後端版本太舊），使用者只會去檢查
       * 自己的網路 —— 而實測 2026-08-26 那次的成因是 Google 服務回應過慢，網路沒問題。
       */
      const bootFailMsg = (e) => {
        const raw = (e && e.message) || '載入失敗';
        const head = /逾時|忙碌|非 JSON/.test(raw) ? 'Google 服務回應過慢（不是你的網路問題）'
          : /網路連線中斷/.test(raw) ? '網路連線中斷'
            : /重新部署|未回傳資料/.test(raw) ? '線上後端版本過舊'
              : '載入失敗';
        return head + '，目前顯示上次載入的資料（' + raw + '）';
      };
      const bootCacheKey = (m) => 'sqc_boot_' + m;
      const readBootCache = (m) => { try { const raw = localStorage.getItem(bootCacheKey(m)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } };
      const writeBootCache = (m, b) => { try { localStorage.setItem(bootCacheKey(m), JSON.stringify({ at: Date.now(), b })); } catch (e) { /* 空間不足就算了 */ } };
      const applyBoot = (b, mo) => setBoot({
        checklist: buildChecklist(b.checklist || [], mo, b.observations),
        stores: b.stores || [],
        staffs: (b.staffs || []).map(s => ({ id: s.empId, name: s.name, dept: s.dept, section: s.section })),
        depts: b.depts || [],
      });
      /**
       * 門市名單改為分開載入（2026-08-26）。
       * 原本 getBootstrap 一併搬 1500+ 家店（近 200KB、伺服器端六次整表讀取），
       * 常常撞上逾時 → 畫面顯示載入失敗、其實只是太慢。拆開後題庫與人員 1~2 秒就到，
       * 畫面立刻可用；名單在背景補，而選店本來就發生在選完課別之後。
       * 後端回的是「欄位名一次 + 每列一個陣列」的精簡格式，照 cols 還原成物件。
       */
      const expandStores = (r) => {
        const cols = (r && r.cols) || [];
        return ((r && r.rows) || []).map(row => {
          const o = {};
          cols.forEach((c, i) => { o[c] = row[i]; });
          return o;
        });
      };
      const [storesState, setStoresState] = useState({ loaded: false, err: '' });
      // 名單是背景載入的，切換月份時前一個月的請求可能晚到 —— 用這個記住「現在要的是哪個月」，
      // 回來時月份已經不同就丟掉，否則會把上個月的名單灌進這個月
      const storesReq = useRef('');
      const loadStores = (m) => {
        const mo = m || workMonth;
        if (!CONFIGURED) { setStoresState({ loaded: true, err: '' }); return Promise.resolve(); }
        storesReq.current = mo;
        setStoresState(s => ({ loaded: s.loaded, err: '' }));   // 重載時先留著舊名單，不要讓畫面閃空
        return SqcApi.getStoreList(mo, '').then(r => {
          if (storesReq.current !== mo) return [];   // 已經切到別的月份，這份結果作廢
          const stores = expandStores(r);
          setBoot(b => ({ ...b, stores }));
          setStoresState({ loaded: true, err: '' });
          // 名單也一起進快取，下次開 App 才能立刻畫出來
          try {
            const raw = localStorage.getItem(bootCacheKey(mo));
            const c = raw ? JSON.parse(raw) : null;
            if (c && c.b) writeBootCache(mo, { ...c.b, stores });
          } catch (e) { /* 空間不足就算了 */ }
          return stores;
        }).catch(e => {
          if (storesReq.current === mo) setStoresState(s => ({ loaded: s.loaded, err: e.message || '載入失敗' }));
          throw e;
        });
      };
      const reloadBoot = (m) => {
        const mo = m || workMonth;
        // light=true：不要名單。名單由 loadStores 另外取（舊版後端會忽略這個參數並照舊全帶）
        return SqcApi.getBootstrap(mo, '', true).then(b => {
          // 後端若是舊版仍會帶名單，那就直接沿用，不必再多打一次
          const hasStores = !!(b.stores && b.stores.length);
          applyBoot(b, mo);
          if (hasStores) setStoresState({ loaded: true, err: '' });
          writeBootCache(mo, b);
          setBootErr(''); setBootWarn(''); setBootAt(Date.now());
          setGasVer(b.gasVersion || '(舊版後端)'); setGasStale(false);
          if (!hasStores) loadStores(mo).catch(() => { });   // 背景補名單，失敗有自己的提示
          return b;
        });
      };
      /**
       * 載入「本月已點檢的店號」。
       * 這支的狀態必須外顯，因為它同時是防重複點檢的唯一依據：
       *   1. 還沒回來之前，店鋪名單不可以看起來像是可選 —— 店鋪名單走 localStorage 快取、
       *      開 App 就立刻畫出來，而這支要等一趟後端往返，中間那幾秒每家店都會顯示成沒點過。
       *      2026-08-25 現場就是這樣誤選了昨天已點檢的店，填完整份表才在送出時被擋下。
       *   2. 失敗時不可以靜音 —— 原本 catch 是空的，只要這一次查詢失敗（權杖過期、
       *      Google 轉送層不穩），整個 session 的防重複機制就靜靜失效，畫面上完全看不出來。
       */
      const loadInspected = (m) => {
        const mo = m || workMonth;
        if (!CONFIGURED) { setInspectedState({ loaded: true, err: '' }); return Promise.resolve(); }
        setInspectedState({ loaded: false, err: '' });
        // 只取店號清單。原本呼叫 queryRecords(mo, {}) 取「全部紀錄」，但這裡只用得到店號 ——
        // 而那支會把每一列的明細/觀察/照片JSON 全部解析後整包傳過來，月底上千筆就是好幾 MB。
        // 舊版後端沒有 getInspectedCodes（會回「未知動作」），此時退回舊做法，功能不受影響。
        const viaCodes = () => SqcApi.getInspectedCodes(mo).then(r => (r.codes || []));
        const viaRecords = () => SqcApi.queryRecords(mo, {}).then(r => (r.records || []).map(x => x.storeCode));
        return viaCodes()
          .catch(e => (/未知動作/.test(e.message || '') ? viaRecords() : Promise.reject(e)))
          .then(codes => {
            const map = {}; codes.forEach(c => { const k = normCode(c); if (k) map[k] = true; });
            setInspectedCodes(map);
            setInspectedState({ loaded: true, err: '' });
          })
          .catch(e => setInspectedState({ loaded: false, err: e.message || '查詢失敗' }));
      };
      useEffect(() => {
        if (!CONFIGURED) return;
        const cached = readBootCache(workMonth);
        if (cached && cached.b) {
