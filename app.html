       *
       * 查詢紀錄：所有登入者皆可查全部（不依登入者工號過濾）。
       * 因為名冊多數人未填 AD、登入後取不到工號，用工號過濾會失效或誤擋；
       * 權限差異僅在「維護專區」與報表/請款產出限管理者。
       */
      const loadRecords = (useApplied) => {
        if (!CONFIGURED) return;
        const silent = useApplied === true;
        const src = (silent && appliedFilter.current) || filter;
        const f = { from: src.from, to: src.to, section: src.section };
        appliedFilter.current = f;
        const months = queryMonthsOf(f.from, f.to);
        // 背景自動刷新不顯示進度條、失敗也不彈視窗 —— 使用者沒有按查詢，
        // 跳出「查詢失敗」只會讓人以為自己做錯了什麼。下一次刷新或手動查詢會再試。
        if (!silent) setQueryLoading(true);
        // 逐月查，但「那個月讀不到」不可以被當成「那個月沒有紀錄」。
        // 原本是 .catch(() => ({ records: [] }))：Google 轉送層偶發逾時或回 404 時
        // （實測過一次 33 秒後 404），使用者看到的是「執行店數 0」而不是「查詢失敗」，
        // 而他們會相信那個 0。所以要把失敗的月份記下來並攤在畫面上。
        return Promise.all(months.map(m =>
          SqcApi.queryRecords(m, f)
            .then(r => ({ ok: true, month: m, records: (r && r.records) || [] }))
            .catch(e => ({ ok: false, month: m, error: e, records: [] }))
        ))
          .then(results => {
            const bad = results.filter(r => !r.ok);
            // 背景刷新遇到部分失敗時，寧可留著上一次完整的清單，也不要用不完整的覆蓋掉
            if (bad.length && silent) { setLoadWarn(warnTextOf(bad)); return; }
            setLoadWarn(bad.length ? warnTextOf(bad) : '');
            const all = results.flatMap(r => r.records);
            setRecords(all.map(x => ({
              id: x.id, date: String(x.time).slice(0, 10), store: x.storeName, section: x.section,
              staff: x.staffName, version: x.month, total: Number(x.total), grade: x.grade,
              pendingPhotos: Number(x.pendingPhotos) || 0, photoState: x.photoState || '', _raw: x,
            })));
            // 連線階段過期時不可以說「請重新查詢一次」—— 重查一定也是失敗，
            // 而 2026-08-31 現場就是照著這句話一直重查。這種情況要講的是「重新登入」，
            // 上方也會同時出現橫幅。
            if (bad.length) {
              const isAuth = bad.some(b => /未登入|連線逾時/.test((b.error && b.error.message) || ''));
              alert('⚠ ' + warnTextOf(bad) + '\n\n下方的筆數與統計並不完整。'
                + (isAuth ? '\n請按畫面上方的「重新登入」，登入後再查詢。' : '\n請重新查詢一次。'));
            }
          })
          .catch(e => { if (!silent) alert('查詢失敗：' + e.message); })
          .finally(() => { if (!silent) setQueryLoading(false); });
      };

      // 依賴一定要含 checklist：題庫是開場 API 回來才有的，第一次算的時候 categories 還是空陣列。
      // 原本只寫 [scores]，於是「使用者還沒動過任何一題」時合計就一直停在 0 ——
      // 分區小計是在 render 內即時算的（顯示 5/5），合計卻是 0/10，兩個數字同頁互相矛盾；
      // 若全店滿分、點檢人員沒去動任何得分就送出，會寫進一筆 0 分「不合格」的紀錄。
      const total = useMemo(() => {
        let t = 0;
        checklist.categories.forEach(c => c.items.forEach(it => { t += scoreOfItem(it, scores[it.id]); }));
        return t;
      }, [scores, checklist]);

      // 是否「無缺失」→ 所有題目皆滿分（沒有任何扣分）
      const noDeductDefect = useMemo(() => checklist.categories.every(c => c.items.every(it => scoreOfItem(it, scores[it.id]) === it.max)), [scores, checklist]);

      const grade = gradeOf(total);
      // fn 是「更新函式」而不是新物件：外層的 map 本來就用 updater，但單一題目的內容
      // 若由呼叫端展開 render 快照組好再傳進來，那一層照樣會蓋掉期間的其他變更。
      // 兩層都用 prev 才是真的安全。
      const setItemState = (id, fn) => setScores(prev => ({ ...prev, [id]: fn(prev[id] || {}) }));
      // SqcSession.clear() 會把 localStorage 與 sessionStorage 兩邊都清掉 ——
      // 登出必須真的登出，留下舊位置的殘值會在下一次被讀回來
      const logout = () => { SqcSession.clear(); location.href = 'index.html'; };

      /**
       * 自行新增店鋪：主檔查到之後還要通過三道檢查才算選定。
       *
       * 原本只確認「店鋪主檔有這家店」就直接選上。但主檔是「所有店」，
       * 本月名單才是「這個月要點檢的店」—— 於是名單外的店可以一路填完整份表，
       * 而本月已點檢的店也要等按下送出才被擋（整份表白填）。
       *
       * 這個功能仍然必要：畫面上的清單是 STORE_ROSTER.filter(課別 === 所選課別)，
       * 所以「在本月名單、但主責課別不同」的店不會出現在清單上，只能靠這裡撈出來。
       */
      const acceptCustomStore = (s) => {
        const code = normCode(s.code);
        // 名單／已點檢還沒載完就不能判斷。這時放行等於把 2026-08-25 那個
        // 「空窗期選到已點檢店」的競態原封不動搬回來，所以寧可要使用者等幾秒。
        if (!pickReady) { alert('本月店鋪名單還在載入中，請稍候幾秒再新增。'); return false; }
        const inRoster = STORE_ROSTER.find(x => normCode(x.code) === code);
        if (!inRoster) {
          alert(`「${s.code} ${s.name}」不在本月（${monthFolderOf(workMonth)}）的店鋪名單內，不可點檢。\n\n`
            + '若這家店本月確實要點檢，請先請管理者到「維護專區 → 店鋪名單」把它加入本月名單。');
          return false;
        }
        if (inspectedCodes[code]) {
          alert(`「${inRoster.name}」本月已有點檢紀錄，不可重複點檢。\n（如需修正請到「查詢紀錄」編輯那一筆。）`);
          return false;
        }
        // 在名單裡但屬別的課 —— 這正是本功能最主要的用途，放行，但要講清楚課別的歸屬
        if (basic.section && inRoster.section && inRoster.section !== basic.section) {
          alert(`「${inRoster.name}」在本月名單內，但主責課別是「${inRoster.section}」，`
            + `與上方選的「${basic.section}」不同。\n\n仍可繼續點檢；本筆紀錄的課別會記為上方所選的課別。`);
        }
        // 用名單裡的那一筆（帶課別與店鋪型態），主檔只補上營業部等額外欄位。
        // 這裡一定要用 updater：doLookup 是在 await lookupStore()（一次網路往返）之後才走到這裡，
        // 展開 basic 快照會把使用者在等待期間改過的部別／課別／可否拍照整包蓋回舊值。
        setBasic(prev => ({ ...prev, customInfo: { ...s, ...inRoster }, customStore: inRoster.code + ' ' + inRoster.name }));
        setCustResults([]);
        return true;
      };

      // 自行新增店鋪：查店鋪主檔
      const doLookup = async () => {
        const q = (basic.customStore || '').trim();
        if (!q) { setCustResults([]); return; }
        try {
          const r = await SqcApi.lookupStore(q);
          const rows = r.rows || [];
          const exact = rows.filter(s => String(s.code) === q || s.name === q);
          if (exact.length === 1) acceptCustomStore(exact[0]);
          else { setCustResults(rows); if (!rows.length) alert('店鋪主檔查無此店，無法新增（請確認店號/店名）'); }
        } catch (e) { alert('查詢失敗：' + e.message); }
      };

      const resetWork = () => { setScores({}); setKeyObs({}); setToilet({}); setToiletPhotos({}); setToiletReasons({}); setObsText(''); setPerfectPhotos({}); setPaperForm([]); setSign({ count: '', identity: '', remark: '' }); setEditingRecordId(null); setEditingMonth(null); setExistingPhotos({}); setRemovedPhotos([]); setEditPass(''); };

      // 編輯既有紀錄：把該筆載回點檢作業
      const openEdit = async (row) => {
        const rec = row._raw || row;
        // 非當週的紀錄要先過密碼才讓它進編輯畫面；密碼留著，完成編輯時一併送後端把關
        const pass = await askCrossWeekPass(rec.time, '編輯');
        if (pass === null) return;
        setEditPass(pass);
        const d = rec.detail || {}, o = rec.observation || {};
        const sc = {};
        Object.keys(d).forEach(id => { sc[id] = { score: d[id].score, ngSubs: d[id].ngSubs || [], customNames: d[id].customNames || {} }; });
        setScores(sc);
        setToilet(o.toilet || {}); setObsText(o.obsText || ''); setToiletReasons(o.toiletReasons || {});
        setKeyObs({}); setToiletPhotos({}); setPerfectPhotos({}); setPaperForm([]);
        setExistingPhotos(rec.photos || {});
        // 照片已在 Drive 但紀錄裡只剩檔名（上傳完成後回寫連結那一步被網路中斷或關頁面打掉）→
        // 縮圖會顯示「無雲端連結」，報表也沒有連結。檔名是固定規則，直接請後端補回來。
        const needFix = Object.keys(rec.photos || {}).some(k =>
          (rec.photos[k] || []).some(e => e && !(typeof e === 'object' && e.fileId)));
        if (needFix && CONFIGURED) {
          SqcApi.repairRecordPhotos(rec.month || workMonth, rec.id)
            .then(r => {
              if (!r || !r.filled) return;
              return SqcApi.queryRecords(rec.month || workMonth, {}).then(q => {
                const fresh = (q.records || []).find(x => String(x.id) === String(rec.id));
                if (fresh) setExistingPhotos(fresh.photos || {});
              });
            })
            .catch(() => { /* 補不回來也不影響編輯，縮圖維持「無雲端連結」 */ });
        }
        // 備註欄與「不可拍照原因」共用同一個後端欄位，用固定分隔字串拆開還原
        const rawNote = String(rec.note || '');
        const sepIdx = rawNote.indexOf('｜備註：');
        const note = sepIdx >= 0 ? rawNote.slice(0, sepIdx) : rawNote;
        const remark = sepIdx >= 0 ? rawNote.slice(sepIdx + 4) : '';
        setSign({ count: String(rec.staffCount || ''), identity: rec.identity || '', remark });
        // 不可拍照原因還原
        const npr = note.indexOf('其他') === 0 ? '其他' : (note === '廠區店' || note === '營區店' ? note : '');
        const npo = note.indexOf('其他') === 0 ? note.replace(/^其他[:：]?/, '') : '';
        /**
         * 拿紀錄的店號回頭找名單，必須用 normCode 比 —— 兩邊的前導零不一定一致。
         *
         * 名單是文字（匯入時有 setNumberFormat('@')，023661 保得住），
         * 但點檢紀錄的寫入沒有鎖文字格式，Sheets 會把 '023661' 轉成數字 23661。
         * 原本這裡是 String(s.code) === String(rec.storeCode)，於是比不到 ——
         * 就會落到 __custom 用紀錄的 5 碼店號，而店號正是照片檔名的前綴，
         * 所以「編輯後重新上傳」會在 Drive 產生一個換了名字的孿生檔
         * （2026-09-03 現場：023661_… 與 23661_… 同時存在）。
         * 更糟的是後端「查同檔名就不重傳」那道防線也跟著失效。
         *
         * 專案裡其他比對店號的地方都已經用 normCode（1963 行的 inRoster、
         * 防重複點檢、主檔對照），員編也有 normEmp 當退路 —— 只有這裡漏了。
         *
         * ★ 命中之後要存「名單的店號」而不是紀錄的店號：
         *   下面 store 是用嚴格比對再找一次（s.code === basic.storeCode），
         *   存 5 碼進去那一次就會找不到 → store 是 undefined，而 inRoster 命中時
         *   customInfo 又被設成 null → effStore 為 null → 編輯畫面會變成
         *   「請先在基本資料選擇店鋪」，整個編輯流程壞掉。
         */
        const inRoster = STORE_ROSTER.find(s => normCode(s.code) === normCode(rec.storeCode));
        const t = String(rec.time || taipeiNow()).replace(' ', 'T').slice(0, 16);
        // 時分欄位有自己的狀態，載回舊紀錄時要一起還原，否則畫面會是空的卻通得過必填檢查
        setTimeParts(t.length > 10 ? { h: t.slice(11, 13), m: t.slice(14, 16) } : { h: '', m: '' });
        setBasic({
          time: t,
          dept: rec.dept || '', section: rec.section || '', staffId: rec.empId || '',
          storeCode: inRoster ? inRoster.code : '__custom',
          customStore: inRoster ? '' : (rec.storeCode + ' ' + rec.storeName),
          customInfo: inRoster ? null : { code: rec.storeCode, name: rec.storeName, section: '' },
          storeType: rec.storeType === '可拍照' ? 'photo' : 'nophoto',
          noPhotoReason: npr, noPhotoOther: npo,
        });
        setEditingRecordId(rec.id);
        setEditOrigStaff({ id: rec.empId || '', name: rec.staffName || '' });
        setEditingMonth(String(rec.month || rocMonth(rec.time))); // 轉字串：Sheet 的題庫版本可能是數字，比對月份時會誤判成跨月
        setTab('work');
      };

      /**
       * 必填擋下：提示 → 切到正確頁籤 → 捲到該處並閃紅框。
       * alert 是阻塞的，所以關掉視窗之後才會切頁與捲動，順序剛好。
       * 捲動放在 useEffect 裡而不是這裡：切頁後那個元素要等下一次渲染才存在。
       */
      const jumpTo = (id, msg, toTab) => {
        alert(msg);
        if (toTab && toTab !== tab) setTab(toTab);
        setFlashId('');          // 先清掉，連續兩次擋在同一個 id 時動畫才會重播
        setTimeout(() => setFlashId(id), 0);
      };

      const doSubmit = async () => {
        const isEdit = !!editingRecordId;
        // 題庫是計分依據：尚在載入或載入失敗(題庫為空)時送出，會把明細與分數寫成 0 分覆蓋掉原紀錄，必須先擋下
        if (loading) { alert('題庫仍在載入中，請稍候幾秒再送出'); return; }
        if (!checklist.categories.length) {
          alert('目前沒有載入到本月題庫，為避免分數被覆蓋成 0 分，已阻止送出。\n請重新整理頁面；若仍為空，請確認「維護專區→點檢題目」該月份已匯入題庫。');
          return;
        }
        if (basic.time.length <= 10) { jumpTo('basic-time', '請先在「基本資料」填寫點檢時間（時間為必填）', 'basic'); return; }
        if (!effStore) { jumpTo('basic-store', '請先在「基本資料」選擇店鋪', 'basic'); return; }
        if (!isEdit && inspectedCodes[normCode(effStore.code)]) { jumpTo('basic-store', '這家店本月已有點檢紀錄，不可重複點檢（如需修正請至查詢紀錄編輯該筆）', 'basic'); return; }
        if (!basic.storeType) { jumpTo('basic-phototype', '請先在「基本資料」選擇可否拍照', 'basic'); return; }
        if (!reasonOk) { jumpTo('basic-phototype', '不可拍照店鋪請選擇原因', 'basic'); return; }
        if (!basic.staffId) { jumpTo('basic-staff', '請先在「基本資料」選擇點檢人員', 'basic'); return; }
        if (!sign.count) { jumpTo('sign-count', '請選擇「在店店員人數」', 'work'); return; }
        if (!sign.identity) { jumpTo('sign-identity', '請選擇「簽名店鋪人員身分別」', 'work'); return; }

        // 是否已存在該照片欄位的舊照片（編輯時沿用；新建時一律沒有）
        const hasExisting = (parts) => (existingPhotos[parts.join('/')] || []).length > 0;

        // 紙本點檢表：所有店（含編輯）皆須有紙本，新傳或沿用原有皆可
        if (!paperForm.length && !hasExisting([monthFolder, 'SQC點檢表完成照片'])) { jumpTo('paper-form', '所有店皆須上傳「紙本點檢表」才能送出', 'work'); return; }

        // 觀察區：畫面上看得到的題目全部必填（含「店舖有無對外廁所」本身）
        for (const o of checklist.toiletObservations) {
          if (obsVisible(o.show) && !toilet[o.id]) { jumpTo(`toilet-${o.id}`, `觀察區必填：請選擇「${o.name}」`, 'work'); return; }
        }
        if (toilet['O1'] === '有') {
          for (const t of checklist.toiletInspect) {
            if (!toilet[t.id]) { jumpTo(`toilet-${t.id}`, `觀察區必填：請選擇廁所觀察「${t.name}」`, 'work'); return; }
            if (toilet[t.id] === '不符合' && t.opts && t.opts.length && !(toiletReasons[t.id] || []).length) {
              jumpTo(`toilet-reasons-${t.id}`, `廁所觀察「${t.name}」為不符合，請選擇不合格項目`, 'work'); return;
            }
          }
        }

        // 照片必拍檢查：可拍照店鋪（含編輯），沿用原照片或本次新傳皆可滿足
        if (canPhoto) {
          for (const k of checklist.keyObservations) {
            if (!(keyObs[k.id] || []).length && !hasExisting([monthFolder, k.name])) { jumpTo(`keyobs-${k.id}`, `「${k.name}」為必拍重點觀察題`, 'work'); return; }
          }
          if (noDeductDefect) {
            for (const z of PERFECT_ZONES) { if (!(perfectPhotos[z] || []).length && !hasExisting([monthFolder, '滿分照片', z])) { jumpTo(`perfect-${z}`, `無缺失店鋪：滿分照片區「${z}」必須上傳照片`, 'work'); return; } }
          } else {
            for (const c of checklist.categories) for (const it of c.items) {
              const s = scores[it.id]; const ng = scoreOfItem(it, s) < it.max;
              // 多缺失項的題目：鎖定幾個扣分項就要幾張缺失照片（一個缺失一張憑證）。
              // 「填寫型」子項填了幾個名稱就算幾個扣分項，與扣分邏輯同一份定義（ngUnitsOf）。
              // 既有照片（編輯時的原照片）也算在內，不需要重傳。
              // 用 shotsNeededOf（與畫面上的 PhotoUpload 同一支）：它會蓋住配分上限，
              // 否則會出現「這一題已經扣到 0 分了，卻還要求再上傳照片才能送出」。
              const needShots = shotsNeededOf(it, s);
              const haveShots = (s?.photos || []).length + existingCountAt([monthFolder, it.name, '缺失']);
              if (ng && haveShots < needShots) {
                jumpTo(`item-${it.id}`,
                  `「${it.name}」鎖定了 ${needShots} 個扣分項，需上傳 ${needShots} 張缺失照片（目前 ${haveShots} 張）`, 'work');
                return;
              }
            }
          }
          if (toilet['O1'] === '有') {
            for (const t of checklist.toiletInspect) {
              // 廁所觀察與分區扣分題一致：勾了幾個不合格項目就要幾張缺失照片（一個缺失一張憑證）
              if (toilet[t.id] === '不符合') {
                const needT = Math.max(1, (toiletReasons[t.id] || []).length);
                const haveT = (toiletPhotos[t.id] || []).length + existingCountAt([monthFolder, '廁所觀察', t.name, '缺失']);
                if (haveT < needT) {
                  jumpTo(`toilet-${t.id}`,
                    `廁所觀察「${t.name}」勾了 ${needT} 個不合格項目，需上傳 ${needT} 張缺失照片（目前 ${haveT} 張）`, 'work');
                  return;
                }
              }
            }
          }
        }
        let staff = findStaff(basic.staffId);
        // 編輯舊紀錄時，該員編可能已不在「點檢人員」名單（離職、或名單重匯後工號格式改變）。
        // 這種情況不該把人卡在現場：沿用紀錄原本存的點檢人員即可，既不會誤植也不會擋住編輯。
        if (!staff && isEdit && editOrigStaff && String(editOrigStaff.id) === String(basic.staffId) && editOrigStaff.name) {
          staff = { id: editOrigStaff.id, name: editOrigStaff.name, dept: basic.dept, section: basic.section };
        }
        // 新增時找不到就擋下：寧可要求重選，也不要默默把紀錄掛到登入者名下（會造成點檢人員誤植）
        if (!staff) {
          jumpTo('basic-staff', `找不到所選點檢人員的資料（員編 ${basic.staffId || '空白'}），請重新選擇「點檢人員」`, 'basic');
          return;
        }
        const storeName = effStore ? effStore.name : '';
        const storeCode = effStore ? effStore.code : '';
        const recId = editingRecordId || ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now());

        // 分數用 scoreOfItem 現算，與畫面上的合計、分類小計是同一支函式 ——
        // 原本讀 s.score（由 useEffect 非同步寫回），會在同步完成前送出就存到舊分數
        const detail = {};
        checklist.categories.forEach(c => c.items.forEach(it => {
          const s = scores[it.id] || {};
          detail[it.id] = { name: it.name, score: scoreOfItem(it, s), ngSubs: s.ngSubs || [], customNames: s.customNames || {} };
        }));
        const observation = { toilet, obsText, toiletReasons };

        // 照片：編輯時以原有照片JSON 為基底，新增的接在後面
        const queue = [], photosJson = isEdit ? JSON.parse(JSON.stringify(existingPhotos || {})) : {};
        if (isEdit) {
          // 編輯時若項目已從缺失改為合格，清掉過時的缺失照片紀錄，避免資料不一致
          checklist.categories.forEach(c => c.items.forEach(it => {
            const ng = scoreOfItem(it, scores[it.id]) < it.max;
            const key = [monthFolder, it.name, '缺失'].join('/');
            if (!ng) delete photosJson[key];
          }));
          checklist.toiletInspect.forEach(t => {
            const key = [monthFolder, '廁所觀察', t.name, '缺失'].join('/');
            if (toilet[t.id] !== '不符合') delete photosJson[key];
          });
        }
        const addPhotos = (pathParts, arr) => {
          if (!arr || !arr.length) return;
          const key = pathParts.join('/');
          photosJson[key] = photosJson[key] || [];
          arr.forEach((p) => {
            const idx = nextPhotoIdx(photosJson[key]);
            const name = `${storeCode || 'S'}_${basic.time.slice(0, 10)}_${key.replace(/[\/\s]/g, '')}_${idx}.jpg`;
            photosJson[key].push(name);
            queue.push({ blob: p.blob, name, pathParts, thumb: p.thumb });
          });
        };
        if (canPhoto) {
          checklist.categories.forEach(c => c.items.forEach(it => {
            const s = scores[it.id] || {};
            if (scoreOfItem(it, s) < it.max) addPhotos([monthFolder, it.name, '缺失'], s.photos);
          }));
          checklist.keyObservations.forEach(k => addPhotos([monthFolder, k.name], keyObs[k.id]));
          checklist.toiletInspect.forEach(t => { if (toilet[t.id] === '不符合') addPhotos([monthFolder, '廁所觀察', t.name, '缺失'], toiletPhotos[t.id]); });
          if (noDeductDefect) PERFECT_ZONES.forEach(z => addPhotos([monthFolder, '滿分照片', z], perfectPhotos[z]));
        }
        addPhotos([monthFolder, 'SQC點檢表完成照片'], paperForm);

        /**
         * 照片先進佇列，再依「真的存進去的那幾張」組出紀錄。
         * 原本是 queue.forEach(q => SqcUploader.enqueue(...)) —— 沒有 await 也沒有 catch。
         * enqueue 是寫進 IndexedDB，手機儲存空間不足時會失敗（每張照片上限 1200KB，
         * 一家店 19 張約 22MB，連續幾家沒訊號就可能撞到配額），而那個 rejection 沒人接：
         * 照片JSON 已經記下檔名、照片卻從來沒進佇列，畫面上什麼都不會說 ——
         * 之後就永遠是「照片未齊」，而「照片連結修復」會回報 Drive 找不到這個檔案。
         * 改為先寫佇列、把失敗的那幾張從照片JSON 移除，並明確告訴使用者。
         */
        const enqueueResults = await Promise.allSettled(
          queue.map(q => SqcUploader.enqueue({ ...q, recordId: recId, month: workMonth }))
        );
        const failedNames = queue
          .filter((_, i) => enqueueResults[i].status === 'rejected')
          .map(q => q.name);
        if (failedNames.length) {
          const bad = new Set(failedNames);
          Object.keys(photosJson).forEach(k => {
            photosJson[k] = (photosJson[k] || []).filter(e => !bad.has(typeof e === 'string' ? e : (e && e.name)));
            if (!photosJson[k].length) delete photosJson[k];
          });
          const why = enqueueResults.find(r => r.status === 'rejected');
          const msg = (why && why.reason && why.reason.name === 'QuotaExceededError')
            ? '手機儲存空間不足'
            : ('原因：' + ((why && why.reason && (why.reason.message || why.reason.name)) || '未知'));
          alert(`⚠ 有 ${failedNames.length} 張照片沒能存進待傳佇列（${msg}）。\n\n`
            + '這些照片不會被上傳，紀錄裡也不會記到它們。\n'
            + '請清出手機空間後，到「查詢紀錄」找到這筆按「編輯」重新加入照片。');
          if (CONFIGURED) {
            SqcApi.logEvent('photoQueueFull', `${storeName}：${failedNames.length} 張存不進佇列（${msg}）`).catch(() => { });
          }
        }
        const queuedCount = queue.length - failedNames.length;

        const record = {
          id: recId, month: workMonth, time: basic.time.replace('T', ' '),
          dept: basic.dept, section: basic.section, empId: basic.staffId, staffName: staff.name,
          storeCode, storeName, storeType: canPhoto ? '可拍照' : '不可拍照',
          total, grade: grade.txt, staffCount: sign.count, identity: sign.identity,
          note: [noPhotoReasonText, sign.remark.trim() ? '｜備註：' + sign.remark.trim() : ''].join(''),
          detail, observation, photos: photosJson,
          // 紙本照片欄存的是「檔名清單」。編輯既有紀錄時 photosJson 的項目是 {name, fileId} 物件，
          // 直接丟過去後端會 join 成 "[object Object]" 把這一欄寫爛，所以一律取出檔名。
          paperPhotos: (photosJson[[monthFolder, 'SQC點檢表完成照片'].join('/')] || [])
            .map(e => (e && typeof e === 'object') ? e.name : e).filter(Boolean),
        };

        // 紀錄依「點檢時間」分月存放。編輯時若把點檢時間改到別的月份，該筆就必須從原月份活頁搬到新月份，
        // 否則用新月份去更新會找不到原列(原紀錄不會被改到)。搬移採「先寫入新月份、成功後才刪原月份」的順序，
        // 中途失敗時寧可暫時重複(看得到、可補救)，也不要先刪造成資料遺失。
        const origMonth = String(editingMonth || workMonth);
        const crossMonth = isEdit && origMonth !== String(workMonth);
        if (crossMonth && !confirm(`點檢時間已改到 ${monthFolderOf(workMonth)}，這筆紀錄會從 ${monthFolderOf(origMonth)} 搬到 ${monthFolderOf(workMonth)}。\n確定要這樣做嗎？`)) return;

        setSubmitting(true); // 送出到後端期間顯示進度條並鎖住按鈕，避免重複送出
        // 送出失敗(尤其現場網路中斷)時要能自動重送：照片已經先進佇列，紀錄若沒寫進後端而使用者
        // 又沒重送，這筆點檢就消失了(照片在 Drive、紀錄不存在)。編輯不排隊 —— 原紀錄仍完整，沒有遺失風險。
        if (!isEdit) SqcDB.queueRecord({ id: recId, status: 'pending', month: workMonth, record, tries: 0, at: Date.now() }).catch(() => { });
        const api = !isEdit ? SqcApi.submitRecord(record)
          : !crossMonth ? SqcApi.updateRecord(origMonth, recId, record, editPass)
            : SqcApi.submitRecord(record).then(res => {
              if (res && res.ok === false) return res; // 新月份該店已有紀錄 → 中止搬移，原紀錄保持不動
              return SqcApi.deleteRecord(origMonth, recId).then(() => res);
            });
        api.then((result) => {
          if (result && result.ok === false) {
            // 後端二次把關（如同店本月已被他人搶先送出）
            if (!isEdit) SqcDB.delQueuedRecord(recId).catch(() => { });   // 後端明確拒絕，重送也不會成功
            alert('⚠ ' + (result.message || '送出失敗，請稍後再試'));
            if (result.code === 'DUPLICATE') { setInspectedCodes(prev => ({ ...prev, [normCode(storeCode)]: true })); setTab('basic'); }
            return;
          }
          if (!isEdit) SqcDB.delQueuedRecord(recId).catch(() => { });   // 已確認寫入後端，不需重送
          // 紀錄已更新成功，才把被標記刪除的原照片移入 Drive 垃圾桶（可還原）
          if (removedPhotos.length) {
            SqcApi.trashPhotos(removedPhotos.map(x => x.fileId), storeName + ' ' + basic.time.slice(0, 10))
              .catch(e => alert('紀錄已更新，但刪除舊照片失敗：' + e.message + '。照片仍在 Drive，可再編輯一次重試。'));
          }
          if (!isEdit) setInspectedCodes(prev => ({ ...prev, [normCode(storeCode)]: true }));
          // 為下一家店重設基本資料：
          //   店鋪與拍照類型清掉（這家已變成「已點檢」，留著只會被自己的警告攔下來）
          //   時間只保留日期、清掉時分 —— 一整天連續點好幾家時日期不必重選，但時分一定要
          //   重新填。留著上一家的時分是實際的資料錯誤風險（點檢時間會寫錯，還會影響梯次判定）。
          //   部別/課別/點檢人員保留：同一個人接著點下一家。
          setBasic(b => ({
            ...b, time: b.time.slice(0, 10),
            storeCode: '', customStore: '', customInfo: null, storeType: '', noPhotoReason: '', noPhotoOther: '',
          }));
          setTimeParts({ h: '', m: '' });   // 時分要重填（見上面的說明）
          resetWork(); setTab('records'); loadRecords();
          // 已點檢清單要向後端重查，不能只靠上面那行本機樂觀更新 ——
          // 同一時間別人也在送出，只加自己這一筆的話，同事剛點完的店在這台裝置上仍是可選的。
          loadInspected(workMonth);
          // 照片還沒傳完就放人走，是「報表沒有照片連結」的唯一成因 —— 照片只存在那一台裝置上，
          // 人離開、裝置失聯就再也兌現不了。所以送出後改成擋在上傳進度畫面，傳完才放行。
          if (queuedCount) {
            // 紀錄剛寫進後端 → 立刻踢一次上傳，並清掉退避。
            // 照片是在紀錄寫入「之前」就開始傳的，所以第一次回寫連結常會收到「找不到紀錄」而退避；
            // 不清掉的話要等下一輪 setInterval（15 秒）才會再試，每一家店都會白等十幾秒。
            SqcUploader.pump({ force: true, recordId: recId });
            // 順利的店幾秒就傳完了，先不要彈畫面擋人；緩衝期過後還沒完成才彈出來
            const info = { recordId: recId, store: storeName, total, grade: grade.txt, added: queuedCount };
            setTimeout(() => {
              SqcUploader.countsOfRecord(recId)
                .then(c => {
                  if (c.pending || c.done) { setPostSubmit(info); return; }
                  setToast(c.orphan
                    ? `⚠ ${storeName}　${c.orphan} 張照片需人工處理（維護專區 → 照片連結修復）`
                    : `✅ ${storeName}　${c.total} 張照片已全部完成`);
                })
                .catch(() => setPostSubmit(info));   // 查不到就照舊彈出來，寧可多問一次
            }, POST_GRACE_MS);
          } else {
            // resent＝這一筆先前其實已經寫入成功，只是回應在網路上遺失而自動重送。
            // 這是成功，不是錯誤 —— 但要講清楚，否則使用者會納悶「我明明按一次怎麼等這麼久」。
            setToast(result && result.resent
              ? `✅ ${storeName} 已送出（先前的回應在網路上遺失，已確認資料只有一筆）`
              : `✅ ${isEdit ? '已更新' : '已送出'}　${storeName}　${total}/${TOTAL_MAX}（${grade.txt}）`);
          }
        }).catch(e => {
          /**
           * 逾時／連線中斷不可以說「送出失敗」。
           *
           * 2026-09-03 現場：畫面說「送出失敗：伺服器逾時未回應（12 秒）」，
           * 但查詢時那筆紀錄與照片連結都在 —— 後端做完了，只是回應沒在 12 秒內回來。
           * 而說成「失敗」的直接後果是同事再按一次送出，每一次都要搶後端的腳本鎖，
           * 於是更多人逾時：這個訊息本身有放大效應，是唯一會自我加劇的一項。
           *
           * 新增紀錄其實很安全：送出前就先進了待送佇列，補送每輪會先問 recordExists
           * （只讀「紀錄ID」一欄、不搶鎖），已存在就把佇列項刪掉，不會寫成兩列。
           * 所以正確的說法是「還在確認」，而且要明確叫她不要重複送出。
           *
           * 編輯不進佇列（原紀錄仍完整、沒有遺失風險），所以要請她自己再存一次
           * —— 但同一個紀錄ID 重存是覆寫，不會產生第二筆。
           */
          const unsure = !!(e && (e.transient || e.timedOut));
          if (unsure && !isEdit) {
            alert('⏳ 伺服器沒有在時限內回應：' + e.message
              + '\n\n這不代表失敗 —— 後端很可能已經寫入成功了。'
              + '\n系統會自動確認（通常幾十秒內），確認後上方提示就會消失。'
              + '\n\n請不要重複按「送出評核」，重複送出只會讓伺服器更慢。');
            return;
          }
          if (unsure && isEdit) {
            alert('⏳ 伺服器沒有在時限內回應：' + e.message
              + '\n\n這次修改可能已經存進去了。請到「查詢紀錄」確認那一筆'
              + '\n若還是舊的，再存一次即可（同一筆會覆寫，不會變成兩筆）。');
            return;
          }
          alert((isEdit ? '更新' : '送出') + '失敗：' + e.message
            + (isEdit ? '' : '\n\n這筆已存入待送佇列，網路恢復後會自動重送，請保持頁面開啟。'));
        }).finally(() => setSubmitting(false));
      };

      // 包一層例外攔截：任何未預期的錯誤都要顯示出來，不可讓按鈕「按了沒反應」而查不出原因
      const submit = () => {
        if (submitting) return; // 正在送出就忽略重複點擊
        // doSubmit 現在是 async（要等照片寫進佇列才知道有幾張成功），
        // 所以除了 try/catch 還要接住 rejection —— 否則錯誤會變成沒人接的 promise，
        // 按鈕鎖在「送出中」而畫面上什麼都不說。
        const oops = (e) => {
          setSubmitting(false);
          console.error('[SQC] 送出時發生未預期錯誤', e);
          alert('送出時發生錯誤，請截圖此訊息：\n' + (e && (e.stack || e.message) || e));
        };
        try { Promise.resolve(doSubmit()).catch(oops); }
        catch (e) { oops(e); }
      };

      // ---- 查詢/彙總篩選 ----
      const [filter, setFilter] = useState({ from: taipeiToday(), to: taipeiToday(), section: '' });
      // 整月快捷：offset 0=本月、-1=上月（次月請上月款時用「上月」一鍵帶入，避免手選日期出錯）
      const setMonthRange = (offset) => {
        const t = taipeiToday();
        let y = Number(t.slice(0, 4)), m = Number(t.slice(5, 7)) + offset;
        while (m > 12) { m -= 12; y++; }
        while (m < 1) { m += 12; y--; }
        const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
        const p = (n) => String(n).padStart(2, '0');
        setFilter(f => ({ ...f, from: `${y}-${p(m)}-01`, to: `${y}-${p(m)}-${p(lastDay)}` }));
      };
      // 「只看照片未齊」：照片還在點檢人員手機裡時要當天就追，越晚越救不回來
      const [onlyPending, setOnlyPending] = useState(false);
      const filtered = records.filter(r => (!filter.from || r.date >= filter.from) && (!filter.to || r.date <= filter.to) && (!filter.section || r.section === filter.section)
        && (!onlyPending || r.pendingPhotos > 0));
      const pendingCount = records.filter(r => r.pendingPhotos > 0).length;
      /**
       * 照片傳完後，「📷 缺 N 張」要自己消失。
       * 那個數字是後端從照片JSON 現算的，連結回寫成功的瞬間伺服器就已經是對的，
       * 但前端手上的清單是上一次查詢的快照 —— 不重查就會一直掛著紅字，
       * 使用者會以為照片還沒傳上去（現場就是這樣回報的）。
       * 觸發點選「佇列變少」而不是「佇列歸零」：一次回寫只會讓某一筆的照片轉成
       * linked 而離開佇列，其他筆可能還在傳，等歸零會等太久。
       * 沿用上一次查詢的條件（不是當下的 filter），否則使用者改了日期還沒按查詢時，
       * 背景刷新會把新條件偷偷套上去。
       */
      const prevUnfinished = useRef(null);
      useEffect(() => {
        const cur = pendingUp.unfinished || 0;
        const prev = prevUnfinished.current;
        prevUnfinished.current = cur;
        if (prev === null || cur >= prev) return;      // 只在變少時才刷新
        if (!pendingCount) return;                     // 畫面上沒有紅字就不必打擾後端
        // 稍等一下再查：回寫成功與佇列狀態更新幾乎同時，留點餘裕給後端寫完
        const t = setTimeout(() => loadRecords(true), 1500);
        return () => clearTimeout(t);
      }, [pendingUp.unfinished]);
      // 正式模式：進查詢/彙總頁或改條件時，重新向後端查當月
      // 只在切換進「查詢紀錄/彙總」分頁時自動查一次；改變日期/課別後需按「查詢」才會重新查詢
      useEffect(() => { if (CONFIGURED && (tab === 'records' || tab === 'summary')) loadRecords(); }, [tab]);
      // ---- 跨週修改保護 ----
      // 編輯/刪除只限「當週」(週一~週日)；非當週要輸入密碼。
      // 前端先問一次是為了體驗（不必填完整份表單才被拒），真正的把關在後端 ——
      // 前端的驗證用開發者工具就能繞過，密碼也不該寫在前端程式裡。
      const weekMondayOf = (ymd) => {
        const s = String(ymd || '').slice(0, 10);
        if (s.length !== 10) return '';
        const d = new Date(s + 'T00:00:00Z');
        d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));   // 週一=0
        return d.toISOString().slice(0, 10);
      };
      const isCrossWeek = (recTime) => {
        const w = weekMondayOf(recTime);
        return !!w && w !== weekMondayOf(taipeiToday());
      };
      /** 需要密碼時就問並向後端驗證；回傳 null＝使用者取消或密碼錯誤（呼叫端應中止） */
      const askCrossWeekPass = async (recTime, actionText) => {
        if (!isCrossWeek(recTime)) return '';
        const p = prompt(`這筆是 ${String(recTime).slice(0, 10)} 的紀錄，不在本週（週一~週日）範圍內。\n${actionText}非當週紀錄需要輸入密碼：`);
        if (p === null) return null;
        if (!CONFIGURED) return String(p).trim();
        try {
          const r = await SqcApi.checkEditPass(String(p).trim());
          // 連錯多次會被鎖一段時間，要講清楚是鎖定而非密碼打錯，否則使用者會一直重試
          if (!r.ok) { alert(r.code === 'THROTTLED' ? ('⚠ ' + r.message) : '密碼錯誤，已取消'); return null; }
          return String(p).trim();
        } catch (e) { alert('無法驗證密碼：' + e.message); return null; }
      };

      const delRecord = async (id, recordMonth, recTime) => {
        const pass = await askCrossWeekPass(recTime, '刪除');
        if (pass === null) return;
        if (!confirm('確定刪除此筆評核紀錄？')) return;
        if (!CONFIGURED) { setRecords(records.filter(r => r.id !== id)); return; }
        SqcApi.deleteRecord(recordMonth || workMonth, id, pass)
          .then(res => { if (res && res.ok === false) { alert('⚠ ' + (res.message || '刪除失敗')); return; } loadRecords(); })
          .catch(e => alert('刪除失敗：' + e.message));
      };


      // 匯出「當月名單中尚未點檢」的店鋪（本月已點檢者排除；可依課別）
      const exportUninspected = async () => {
        let done = new Set();
        if (CONFIGURED) {
          const q = await SqcApi.queryRecords(workMonth, { section: filter.section });
          (q.records || []).forEach(r => done.add(normCode(r.storeCode)));
        } else {
          records.forEach(r => done.add(String(r.store)));
        }
        const roster = STORE_ROSTER.filter(s => !filter.section || s.section === filter.section);
        const pending = roster.filter(s => !done.has(normCode(s.code)) && !done.has(String(s.name)));
        if (!pending.length) { alert('當月名單中沒有尚未點檢的店鋪 🎉'); return; }
        const head = ['店號', '店名', '課別', '店鋪型態'];
        const data = [head].concat(pending.map(s => [padStoreCode(s.code), s.name, s.section, s.type || '一般店']));
        await ensureLib('XLSX');
        const ws = XLSX.utils.aoa_to_sheet(data);
        ws['!cols'] = [{ wch: 12 }, { wch: 18 }, { wch: 10 }, { wch: 10 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '尚未點檢');
        XLSX.writeFile(wb, `SQC尚未點檢_${workMonth}${filter.section ? '_' + filter.section : ''}.xlsx`);
      };

      // 產出課長版/客戶版月報表（管理者限定；後端已彙整明細+KPI+照片連結，這裡負責排版成跟人工版本對應的分頁）
      // 課長版：不及格店、查核店鋪名單、SQC Google點檢表單、SQC週彙總表
      // 客戶版：查核店鋪名單、SQC Google點檢表單、SQC週彙總表（不含內部管理用的部課對照與不及格店名單）
      // 註：顏色/格線樣式(查核店鋪名單) SheetJS免費版無法寫入，改用ExcelJS產出整份報表
      const [buildingManager, setBuildingManager] = useState(false);
      const [buildingCustomer, setBuildingCustomer] = useState(false);

      // 報表/請款一律依「查詢的起訖日期」取資料，讓畫面看到的＝報表內容＝請款金額
      // （依賴畫面上的 filter，必須留在元件內）
      const reportFilter = () => ({ from: filter.from, to: filter.to, section: filter.section });
      const spansMonths = () => rocMonth(filter.from) !== rocMonth(filter.to);

      const exportOneReport = async (customerFacing, setBuilding, label) => {
        if (!CONFIGURED) { alert('請先設定後端連線'); return; }
        // 應點檢/完成率是以「當月店鋪名單」為分母，跨月的完成率沒有明確定義，故限制在同一月份內
        if (spansMonths()) { alert(`${label}的完成率是以「當月店鋪名單」計算，日期範圍請勿跨月。\n可用「上月」或「本月」按鈕一鍵帶入整個月份。`); return; }
        setBuilding(true);
        const reportMonth = rocMonth(filter.from); // 依查詢的起始日期決定報表月份，而非「點檢作業」目前的時間
        try {
          const report = await SqcApi.buildMonthlyReport(reportMonth, reportFilter());
          // 該月「觀察題」活頁未匯入時後端回空陣列，但點檢當時是用內建預設題目進行的，
          // 報表改用同一份預設定義，否則觀察區的欄位與照片連結會整片空白
          if (!report.obsList || !report.obsList.length) report.obsList = defaultObsList();
          // 沒有梯次期間就算不出「實際點檢梯次」，報表那一欄會整片空白 —— 要講清楚原因，
          // 否則使用者只看到空白欄位，無從判斷是資料問題還是功能沒生效
          if (!(report.batchPeriods || []).length) {
            alert('⚠ 本月尚未載入「梯次期間」，所以「實際點檢梯次」會是空白，梯次表也只能依名單的預排統計。\n'
              + '請到「維護專區 → 店鋪名單」重新匯入官方委外名單（檔案右側需含「梯次／評核日期區間」小表），'
              + '匯入後訊息會顯示「同時轉入梯次期間 N 筆」才算成功。');
          }
          await ensureLib('ExcelJS');
          const wb = new ExcelJS.Workbook();
          if (!customerFacing) addPlainSheet(wb, '不及格店', buildFailStoreSheet(report));
          buildRosterCheckSheet(wb, report, customerFacing, filter);
          addPlainSheet(wb, 'SQC Google點檢表單', buildRawFormSheet(report));
          const weekly = buildWeeklyScoreSheet(report, customerFacing);
          styleWeeklySheet(addPlainSheet(wb, 'SQC週彙總表', weekly.aoa, weekly.merges), weekly);

          const fromMMDD = (filter.from || '').replace(/-/g, '').slice(4);
          const toMMDD = (filter.to || '').replace(/-/g, '').slice(4);
          const fname = `(${reportMonth})SQC點檢彙總表-${fromMMDD}-${toMMDD}-${report.rows.length}-${label}.xlsx`;
          const buf = await wb.xlsx.writeBuffer();
          const blob = new Blob([buf], { type: 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = fname;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          alert(`✅ 已產出${label}（共 ${report.rows.length} 筆點檢紀錄）`);
        } catch (e) {
          alert(`產出${label}失敗：` + e.message);
        } finally {
          setBuilding(false);
        }
      };
      const exportManagerReport = () => exportOneReport(false, setBuildingManager, '課長版');
      const exportCustomerReport = () => exportOneReport(true, setBuildingCustomer, '客戶版');

      // ---- 請款金額（獨立檔案，比照人工版4分頁；計費基準＝已點檢的店）----
      const [buildingBilling, setBuildingBilling] = useState(false);
      const [billingAsk, setBillingAsk] = useState(null); // { report, sections:[課別], offshore:{課別:金額} }

      // 第一步：取資料並詢問外島交通費（無資料來源，需人工輸入）
      const startBilling = async () => {
        if (!CONFIGURED) { alert('請先設定後端連線'); return; }
        setBuildingBilling(true);
        const reportMonth = rocMonth(filter.from);
        try {
          // 請款只需要逐店紀錄，故支援跨月（分月活頁各取一次再合併）
          const months = Array.from(new Set([rocMonth(filter.from), rocMonth(filter.to)]));
          const parts = await Promise.all(months.map(m => SqcApi.buildMonthlyReport(m, reportFilter())));
          const report = Object.assign({}, parts[0], {
            rows: parts.reduce((acc, p) => acc.concat(p.rows || []), []),
          });
          if (!report.rows.length) { alert('查詢範圍內沒有已點檢紀錄，無法產生請款單'); return; }
          const grouped = SqcBilling.groupStores(report.rows.map(r => ({ 主責部: r.主責部, 主責課: r.主責課 })));
          const sections = [];
          grouped.deptOrder.forEach(d => grouped.byDept[d].sectionOrder.forEach(c => sections.push({ dept: d, section: c })));
          setBillingAsk({ report, reportMonth, sections, offshore: {} });
        } catch (e) {
          alert('取得請款資料失敗：' + e.message);
        } finally {
          setBuildingBilling(false);
        }
      };

      // 第二步：實際產檔
      const finishBilling = async () => {
        const ask = billingAsk;
        setBillingAsk(null);
        setBuildingBilling(true);
        try {
          const { report, reportMonth } = ask;
          const out = SqcBilling.buildBillingSheets(report, report.pricing, ask.offshore, { from: filter.from, to: filter.to });
          await ensureLib('ExcelJS');   // 只有產請款金額才需要，用到才載入
          const wb = buildBillingWorkbook(out);

          const fromMMDD = (filter.from || '').replace(/-/g, '').slice(4);
          const toMMDD = (filter.to || '').replace(/-/g, '').slice(4);
          const fname = `(${reportMonth})SQC點檢彙總表-${fromMMDD}-${toMMDD}-${out.家數}-請款金額.xlsx`;
          const buf = await wb.xlsx.writeBuffer();
          const blob = new Blob([buf], { type: 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = fname;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          alert(`✅ 已產出請款金額\n計費店數：${out.家數} 家\n未稅 ${out.總表.未稅.toLocaleString()}　稅 ${out.總表.稅金.toLocaleString()}　總計 ${out.總表.總計.toLocaleString()}`);
        } catch (e) {
          alert('產出請款金額失敗：' + e.message);
        } finally {
          setBuildingBilling(false);
        }
      };

      const allSections = DEPTS.flatMap(d => d.sections);

      // 課別是全系統的比對鍵（店鋪名單帶店、人員下拉、報表分組都靠它）。
      // 兩邊名稱若不一致（例如人員主檔寫「教育訓練課」、店鋪名單寫「訓練課」），
      // 會出現「選了人卻沒有店可選」這種難以察覺的問題 → 這裡主動比對並提示。
      const sectionMismatch = useMemo(() => {
        if (!STORE_ROSTER.length || !allSections.length) return null;
        const inRoster = {}; STORE_ROSTER.forEach(s => { if (s.section) inRoster[s.section] = true; });
        const inStaff = {}; allSections.forEach(s => { if (s) inStaff[s] = true; });
        const onlyRoster = Object.keys(inRoster).filter(s => !inStaff[s]);
        const onlyStaff = Object.keys(inStaff).filter(s => !inRoster[s]);
        return (onlyRoster.length || onlyStaff.length) ? { onlyRoster, onlyStaff } : null;
      }, [STORE_ROSTER, DEPTS]);
      const [hideMismatch, setHideMismatch] = useState(false);

      // ============================================================
      const TABS = [['basic', '📋 基本資料'], ['work', '📝 點檢作業'], ['records', '🔍 查詢紀錄'], ['summary', '📊 彙總專區']]
        .concat(isManager ? [['maintain', '⚙️ 維護專區']] : []);

      return (
        <div className="min-h-screen pb-32">
          <div className="sticky top-0 z-30 bg-emerald-700 text-white px-4 py-3 flex items-center justify-between shadow">
            <div className="flex items-center gap-2"><span className="font-bold">SQC 評核系統</span></div>
            <div className="flex items-center gap-3 text-sm"><span className="opacity-90">{user}</span><button onClick={logout} className="px-3 py-1 bg-white/20 rounded hover:bg-white/30">登出</button></div>
          </div>

          {/* Tabs */}
          <div className="bg-white border-b sticky top-[48px] z-20 overflow-x-auto">
            <div className="flex max-w-4xl mx-auto px-2">
              {TABS.map(([k, label]) => (
                <button key={k} onClick={() => setTab(k)} className={"px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 transition " + (tab === k ? "border-emerald-600 text-emerald-700" : "border-transparent text-slate-500")}>{label}</button>
              ))}
            </div>
          </div>

          <div className="max-w-4xl mx-auto p-4 space-y-4">
            {(loading || retryInfo) && (
              <div className="bg-white rounded-xl shadow-sm p-3">
                <div className="h-1 w-full bg-slate-200 rounded-full overflow-hidden">
                  <div className="h-full w-1/3 bg-emerald-500 rounded-full" style={{ animation: 'sqc-progress 1s ease-in-out infinite' }} />
                </div>
                <div className={"text-xs mt-1 " + (retryInfo ? "text-amber-600" : "text-emerald-600")}>{busyText || '載入當月資料中，請稍候…'}</div>
              </div>
            )}
            {bootAt && !loading && (
              <div className="text-xs text-slate-400 flex items-center gap-2 px-1">
                <span>資料更新時間：{fmtStamp(bootAt)}</span>
                <span className="text-slate-300">|</span>
                <span title="前端版本（YYYYMMDD-HHMM，台灣時間）。回報問題時請一併提供">前端 {APP_VERSION}</span>
                <span className="text-slate-300">|</span>
                {/* 載入失敗時整份開場資料是 localStorage 的快取，這個版本號也是 ——
                    不標示的話會被當成線上的即時值，使用者會以為後端沒貼成功而白忙。 */}
                {/* 只有真的連上後端拿到的版本號才能拿去比對：
                    bootWarn = 這次載入失敗、顯示的是快取；
                    gasStale = 開場那一趟還沒回來、先用快取墊著（後端忙時要 30~45 秒）。
                    兩種情況都不可以掛警告，否則會叫人去重貼一份其實已經貼好的後端。 */}
                {(() => {
                  const cachedVer = bootWarn || gasStale;
                  const outdated = !cachedVer && gasVer && gasVer < NEEDS_GAS;
                  return (
                    <span title={cachedVer
                      ? '這是「上次成功載入時」看到的後端版本，不是現在線上的版本。等這次載入完成後才會是即時值。'
                      : (outdated
                        ? '線上後端比本前端需要的版本舊（需 ' + NEEDS_GAS + '）：請貼上 程式碼.gs 並「部署→管理部署作業→新版本」'
                        : '後端版本（YYYYMMDD-HHMM，台灣時間）。前後端各自演進，版本號不需相同；只要不低於 ' + NEEDS_GAS + ' 就是正常')}
                      className={cachedVer ? 'text-slate-400' : (outdated ? 'text-amber-600 font-semibold' : '')}>
                      後端 {gasVer || '—'}{cachedVer ? '（上次載入時）' : ''}
                      {outdated && <span className="ml-1">⚠ 需 {NEEDS_GAS} 以上</span>}
                    </span>
                  );
                })()}
                {/* 店鋪名單、人員與「本月已點檢」都只在開 App 時載入一次；
                    主管中途重新匯入名單、或同事剛點完別的店時，要有辦法手動更新 */}
                <button title="重新向後端取店鋪名單、人員與「本月已點檢」清單"
                  onClick={() => { setLoading(true); reloadBoot(workMonth).catch(e => setBootWarn(bootFailMsg(e))).finally(() => setLoading(false)); loadInspected(workMonth); }}
                  className="underline hover:text-slate-600">重新載入</button>
              </div>
            )}
            {/* 一行式提示，取代「每送出一家店就要按一次確定」的 alert */}
            {toast && (
              <div className="fixed left-1/2 -translate-x-1/2 bottom-24 z-40 max-w-[92vw]">
                <div className="bg-slate-800 text-white text-sm rounded-xl shadow-lg px-4 py-2.5 flex items-center gap-3">
                  <span>{toast}</span>
                  <button onClick={() => setToast('')} className="text-slate-300 hover:text-white text-xs">✕</button>
                </div>
              </div>
            )}
            {/**
              * 上傳診斷：把佇列裡每一張的狀態與失敗原因攤出來，讓現場的人（或截圖）就能看到。
              *
              * ★ z-[60] 不可以降回 z-50。
              * 下面「送出後的上傳進度面板」也是 fixed inset-0，原本兩個同為 z-50 而面板
              * 在 DOM 裡比較後面 —— 同層時 CSS 依 DOM 順序疊，所以面板永遠蓋在這個診斷上面。
              * 而「查看原因」那顆按鈕就長在面板裡，於是 2026-09-03 現場出現：
              *   按「查看原因」→ 診斷確實開了，但被面板整片蓋住，畫面看起來毫無反應
              *   → 去按面板的「關閉」→ 面板消失，底下的診斷突然浮出來
              *   → 看起來像「關閉關不掉」，其實是關掉一個、露出另一個。
              * 選 z-[60] 而不是「diag 開著時不渲染面板」：後者要負責把面板正確地帶回來，
              * 而面板承載「照片沒進雲端就不放人走」的責任，不可以被意外吃掉。
              */}
            {diag && (
              <div className="fixed inset-0 z-[60] bg-black/60 flex items-start justify-center p-3 overflow-y-auto">
                <div className="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-4 my-4">
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <div className="text-lg font-bold text-slate-800">🔎 上傳診斷</div>
                      <div className="text-xs text-slate-500 mt-0.5">
                        這是<b>這支手機</b>待傳佇列的內容 —— 換手機或換瀏覽器就看不到。
                        傳不上去時請把這個畫面截圖回報。
                        下面每一張的狀態是<b>這支手機自己的紀錄</b>，不是去問雲端 ——
                        「尚未確認進雲端」有可能是檔案其實已經上去了、只是手機沒記錄到。
                      </div>
                    </div>
                    <button onClick={() => setDiag(null)} className="text-slate-400 hover:text-slate-600 text-xl leading-none px-1">×</button>
                  </div>
                  {/* 版本一定要在這裡：這個視窗就是給人截圖回報用的，而「他到底有沒有拿到
                      修正版」是每次回報第一個要確認的事。2026-08-31 就因為少了這一行，
                      收到截圖後還得多猜一輪。 */}
                  {/* 佔用量是判斷「是不是空間問題」的唯一依據 ——
                      少了它，每次回報都只能從「有幾筆、每筆幾 KB」自己加。
                      只算還握著 blob 的（已釋放的那些不再佔空間）。 */}
                  <div className="text-xs text-slate-500 mt-2 font-mono break-all">
                    前端 {APP_VERSION}　佇列 {diag.length} 筆
                    {(() => {
                      const held = diag.filter(p => p.hasBlob).reduce((s, p) => s + (p.blobSize || 0), 0);
                      return held ? '（佔用 ' + (held / 1048576).toFixed(1) + ' MB）' : '（未佔用空間）';
                    })()}
                    <br />
                    {/* 上傳器現在在做什麼。2026-09-03 那次卡死完全沒有線索 ——
                        沒有錯誤訊息、沒有重試次數，畫面上只有一個灰掉的「正在重試…」。
                        「卡在哪一步」是診斷最基本的一項，之前完全沒有。 */}
                    目前狀態：{pendingUp.busy ? (pendingUp.phase || '進行中…') : '閒置'}
                    <br />
                    來源網址：{location.origin}
                  </div>
                  {/* 整輪失敗的原因（例如 IndexedDB 寫不進去）。這種失敗不屬於任何單一張照片，
                      沒有這一塊就完全看不到 —— 而它正是「所有照片都停住」時最該先知道的事。 */}
                  {pendingUp && pendingUp.lastError && (
                    <div className="mt-2 text-xs bg-red-50 border border-red-200 text-red-700 rounded-lg p-2.5 break-all">
                      <b>整體錯誤：</b>{pendingUp.lastError}
                    </div>
                  )}
                  {!diag.length ? (
                    <p className="text-sm text-emerald-700 mt-3">佇列是空的 —— 這支手機沒有待傳的照片。</p>
                  ) : (
                    <div className="mt-3 space-y-2">
                      {diag.map(p => (
                        <div key={p.id} className={"border rounded-lg p-2.5 text-xs "
                          + (p.status === 'pending' ? 'border-red-200 bg-red-50'
                            : p.status === 'orphan' ? 'border-amber-200 bg-amber-50' : 'border-slate-200 bg-slate-50')}>
                          <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1">
                            <span className={"font-bold " + (p.status === 'pending' ? 'text-red-700' : p.status === 'orphan' ? 'text-amber-700' : 'text-slate-600')}>
                              {/**
                                * 這一行讀的是「這支手機自己的紀錄」，不是問過 Drive。
                                *
                                * 檔案已經 PUT 成功、但狀態寫不回 IndexedDB 時，它仍然是 pending ——
                                * 於是畫面顯示「還沒進雲端」，而 Drive 上那個檔案明明就在。
                                * 2026-09-03 現場就是這樣：Drive 裡看得到，App 卻說沒有。
                                * 「還沒進雲端」是在斷言一件這支手機無法驗證的事，
                                * 所以改成「尚未確認進雲端」—— 講的是「我還沒收到成功的紀錄」。
                                *
                                * 其他寫著「還沒進雲端」的地方刻意不改：那些是「刪掉會永久遺失」
                                * 的警告，在那裡保守（假設真的還沒上去）才是對的。
                                */}
                              {p.status === 'pending' ? (p.stalled ? '一直傳不上去' : '尚未確認進雲端')
                                : p.status === 'done' ? '已進雲端，待寫連結'
                                  : p.status === 'linked' ? '完成' : p.status === 'orphan' ? '需人工處理' : p.status}
                            </span>
                            <span className="text-slate-600">{p.where || '(無題目)'}</span>
                            {p.tries > 0 && <span className="text-slate-500">已重試 <b>{p.tries}</b> 次</span>}
                            {/**
                              * 內容大小是這個視窗最關鍵的一欄，但它有三種完全不同的意思，
                              * 以前全部長得一樣（都顯示成「內容 N KB」或「內容 0」）：
                              *   還握著內容        → 佔著這支手機的空間
                              *   本機沒了、雲端有  → 正常，而且是好事（清理過或系統自己釋放）
                              *   本機沒了、雲端也沒 → 照片真的不見了，只能重拍（最嚴重）
                              *
                              * 判斷「不見了」要看 fileId 而不是 status：
                              * done 與 orphan 的檔案其實已經在雲端硬碟裡（只差連結），
                              * 用 status 判斷會把它們說成「照片不見了」而讓現場白跑一趟重拍。
                              */}
                            {p.hasBlob ? (
                              <span className="text-slate-500">內容 {Math.round(p.blobSize / 1024)} KB</span>
                            ) : p.fileId ? (
                              <span className="text-slate-400">
                                已釋放{p.blobSize ? '（原 ' + Math.round(p.blobSize / 1024) + ' KB）' : ''}
                              </span>
                            ) : (
                              <span className="text-red-700 font-bold">內容 0（照片不見了）</span>
                            )}
                          </div>
                          <div className="text-slate-400 mt-1 font-mono break-all">{p.name}</div>
                          {/* 被跳過的要講清楚「這一輪不會再碰它」，否則它長得跟「還沒輪到」一樣，
                              而那正是 2026-09-03 現場 30 張照片被誤判成「還沒輪到」的原因 */}
                          {p.skipReason && (
                            <div className="text-red-800 mt-1 bg-red-100 rounded px-1.5 py-1 break-all">
                              <b>本次已跳過</b>：本機無法記錄這張的狀態，所以先處理後面的照片。
                              照片還在手機上，<b>下次重開 App 會再試一次</b>。
                              <div className="font-mono mt-0.5 text-red-700">{p.skipReason}</div>
                            </div>
                          )}
                          {/**
                            * 已完成（linked）的照片不顯示任何錯誤。
                            *
                            * 那些欄位是過程中留下的，而 released() 從 2026-09-03 起會在轉成
                            * linked 時清掉 —— 但「在那之前就已經完成」的照片不會再走一次
                            * released()，舊訊息會永遠留在 IndexedDB 裡。所以顯示端也要擋，
                            * 否則畫面上會一直出現「完成 … 回寫連結錯誤：伺服器忙碌中」，
                            * 讓人以為那一張還有問題（現場就是這樣被誤讀的）。
                            *
                            * 次數要把兩個計數器加起來：逾時類的失敗累加的是 netTries，
                            * 只印 linkTries 會顯示成「（0 次）」—— 有錯誤訊息卻 0 次，看不懂。
                            */}
                          {p.status !== 'linked' && p.error && (
                            <div className="text-red-700 mt-1 font-mono break-all">上傳錯誤：{p.error}</div>
                          )}
                          {p.status !== 'linked' && p.linkErr && (
                            <div className="text-amber-700 mt-1 font-mono break-all">
                              回寫連結錯誤：{p.linkErr}（已重試 {(p.linkTries || 0) + (p.netTries || 0)} 次）
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                  {/**
                   * ★ 清理區塊放在動作列「之前」，「關閉」必須是最後一個。
                   * 原本順序相反 —— 42 張照片的佇列滑到底，最後看到的是
                   * 「🗑 清空整個佇列（會遺失照片）」，而關閉在更上面看不到。
                   * 把破壞性最強的按鈕擺在畫面終點是不對的。
                   */}

                   * 手動清理。
                   *
                   * 為什麼需要「人自己按」：待傳佇列只存在這支手機裡，後端與其他人
                   * 完全碰不到它。一旦這支手機的儲存空間被佔滿，新照片就存不進去，
                   * 而現場的人正需要繼續點檢下一家店 —— 必須有一個他當下就能按的出口。

                  <div className="mt-4 pt-3 border-t border-slate-200 space-y-2">

                      </div>
                    </button>
                    <button

                      </div>
                    </button>
                  </div>
                  <div className="flex flex-wrap justify-end gap-2 mt-4">
                    <button onClick={() => SqcUploader.pump({ force: true })} disabled={pendingUp.busy}

                      {pendingUp.busy ? '正在重試…' : '立即重試'}
                    </button>
                    <button onClick={openDiag} disabled={diagBusy}

                    </button>
                    <button onClick={() => setDiag(null)} className="px-3 py-2 text-sm bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg">關閉</button>
                  </div>
                </div>
              </div>
            )}
            {/* 送出後的上傳進度：照片沒進雲端硬碟就不放人走（唯一的出口要留下軌跡） */}
            {postSubmit && (
              <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">

                    {postDone ? (postStat.orphan ? '⚠ 已上傳，但有照片需人工處理' : '✅ 全部完成')

                  <div className="text-sm text-slate-600 mt-1">
                    {postSubmit.store}　得分 {postSubmit.total}/{TOTAL_MAX}（{postSubmit.grade}）

                      })()}

                    postStat.orphan ? (
                      <p className="text-sm text-amber-700 mt-3">

                    ) : (
                      <p className="text-sm text-emerald-700 mt-3">
                        {postStat.total} 張照片都已進入雲端硬碟，報表點得到連結了。
                      </p>
                    )
                  ) : (
                    <>
                      {/* 進度的分子是「檔案已經在雲端硬碟的張數」。

                      <div className="mt-3 h-2 w-full bg-slate-200 rounded-full overflow-hidden">
                        <div className="h-full bg-emerald-500 rounded-full transition-all"
                          style={{ width: Math.round(100 * ((postStat && postStat.uploaded) || 0) / Math.max(1, (postStat && postStat.total) || postSubmit.added)) + '%' }} />
                      </div>
                      <div className="text-sm text-slate-700 mt-2">

                        {!!(postStat && postStat.pending) && <span className="ml-1">上傳中 <b className="text-red-600">{postStat.pending}</b> 張</span>}
                        {!!(postStat && postStat.done) && <span className="ml-1 text-slate-500">已上傳、等寫入連結 <b>{postStat.done}</b> 張</span>}
                        {!!(postStat && postStat.linked) && <span className="ml-1 text-emerald-700">完成 <b>{postStat.linked}</b> 張</span>}
                      </div>
                      <p className="text-xs text-slate-500 mt-2">
                        「已上傳、等寫入連結」的照片<b>檔案已經在雲端硬碟了</b>，只差最後一步把連結寫回紀錄 ——
                        這一步要整筆一起做，所以會停在這裡幾秒。
                      </p>
                      {/* 措辭要跟著門檻走：pending 為 0 時照片已經安全，這時再說「離開現場前請等它跑完」

                      {cloudSafe ? (
                        <p className="text-xs text-emerald-700 mt-1">
                          <b>照片檔案都已經在雲端硬碟了，現在離開現場不會遺失任何照片。</b>
                          剩下的只是把連結寫回紀錄；能讓 App 多開一下最好，若已經離開也補得回來
                          （維護專區 →「照片連結修復」）。
                        </p>
                      ) : (
                        <p className="text-xs text-red-600 mt-1">
                          還沒進雲端的照片<b>只存在這支手機上</b>。<b>離開現場前請等它跑完</b> ——
                          一旦這支手機沒再連上網路開這個 App 就補不回來，而缺失當下已經被改善、拍不回來。
                          訊號不好時可以走到店外或連店裡的 Wi-Fi 再按「立即重試」。
                        </p>
                      )}
                      {!navigator.onLine && <p className="text-xs text-red-600 mt-1">⚠ 目前顯示為離線，恢復連線後會自動繼續。</p>}
                      {pendingUp.queuedRecords > 0 && <p className="text-xs text-slate-400 mt-1">另有紀錄 {pendingUp.queuedRecords} 筆待送出。</p>}
                    </>
                  )}
                  <div className="flex justify-end gap-2 mt-4">

                      <>

                          className="px-3 py-2 text-sm bg-slate-200 hover:bg-slate-300 disabled:opacity-60 text-slate-700 rounded-lg">
                          {pendingUp.busy ? '正在重試…' : '立即重試'}
                        </button>
                        {/* 傳不上去時最該做的事：看原因、截圖回報。放在這裡因為使用者就是在這一刻卡住 */}
                        <button onClick={openDiag} disabled={diagBusy}
                          className="px-3 py-2 text-sm bg-white border border-slate-300 hover:bg-slate-50 disabled:opacity-60 text-slate-700 rounded-lg">

                              if (CONFIGURED) {
                                SqcApi.logEvent('leaveWithPendingPhotos',

                              }

                      </>

                  </div>
                </div>
              </div>

            {lightbox && (

                <div className="text-white/70 text-xs mt-3">點任意處關閉</div>
              </div>

                <div>
                  {/* 標題跟著「還有沒有照片沒進雲端」變：pending 為 0 時檔案都安全了，

                  {/**

                    *

                  <span className="text-xs ml-2">

                <div className="flex items-center gap-3 shrink-0">

            {tab === 'maintain' && sectionMismatch && !hideMismatch && (
