server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # ── 壓縮 ──────────────────────────────────────────────────────────
    # 沒開壓縮時實測（2026-08-27）：babel 2400KB、tailwind 398KB、app.html 221KB，
    # 一次冷啟動要下載約 3.13MB；開了之後約 0.79MB（門市 4G 約 3 Mbps 下是 8.4 秒 → 2.1 秒）。
    # 同一份檔案在 GitHub Pages 是 559/121/68KB —— 差別就只是這個入口沒開 gzip。
    gzip on;
    gzip_vary on;                # 加上 Vary: Accept-Encoding，中間快取才不會發錯版本
    gzip_comp_level 6;
    gzip_min_length 1024;        # 太小的檔案壓縮反而不划算
    gzip_proxied any;
    # text/html 一律會被壓縮，不需（也不可）列在這裡
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── vendor/：檔名已帶版本號，內容永不改變 → 可永久快取 ──────────────
    # 用 ^~ 而不是單純的前綴：nginx 的一般前綴 location 會輸給下面的正規表示式
    # location（它會匹配到 .js），那樣 vendor 就會被套上 no-cache，等於沒設。
    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── 程式碼與殼層：每次都要向伺服器確認，改版才會即時生效 ──────────────
    # 原本完全沒有 Cache-Control，瀏覽器只能靠 ETag/Last-Modified 猜；而每次部署都會
    # 重建映像檔、所有檔案的 mtime 與 ETag 都變 —— 即使 vendor 的內容一個位元都沒改，
    # 全部使用者仍要重新下載整包。上面的 immutable 就是為了解決這件事。
    # service-worker.js 也落在這條規則，本來就必須每次確認才能更新。
    location ~* \.(?:html|js|json|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
