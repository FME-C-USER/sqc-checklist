server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # ── 安全回應標頭 ────────────────────────────────────────────────
    # ⚠ nginx 的 add_header 是「整組取代」而不是累加：只要某個 location 自己寫了
    #   任何一個 add_header，它就會捨棄所有從 server 繼承來的 add_header。
    #   下面兩個 location 都有自己的 Cache-Control，所以這幾行必須在那裡再寫一次 ——
    #   只寫在這裡的話，實際上只有 location / 會生效，其餘路徑等於沒設。
    #
    #   沒有加 Content-Security-Policy：本站用 Babel standalone 在瀏覽器端編譯 JSX 再
    #   eval，CSP 一定要放行 unsafe-eval 與 unsafe-inline，能擋下的東西非常有限，
    #   而寫錯會讓整個 App 一行都跑不起來。列為待評估項目而不是硬上。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 相機要保留：拍照用的是 <input type="file" capture>，收掉會讓現場拍不了照
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # ── 壓縮 ──────────────────────────────────────────────────────────
    # 沒開壓縮時實測（2026-08-27）：babel 2400KB、tailwind 398KB、app.html 221KB，
    # 一次冷啟動要下載約 3.13MB；開了之後約 0.79MB（門市 4G 約 3 Mbps 下是 8.4 秒 → 2.1 秒）。
    # 同一份檔案在 GitHub Pages 是 559/121/68KB —— 差別就只是這個入口沒開 gzip。
    gzip on;
    gzip_vary on;                # 加上 Vary: Accept-Encoding，中間快取才不會發錯版本
    gzip_comp_level 6;
    gzip_min_length 1024;        # 太小的檔案壓縮反而不划算
    gzip_proxied any;
    # text/html 一律會被壓縮，不需（也不可）列在這裡
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── vendor/：檔名已帶版本號，內容永不改變 → 可永久快取 ──────────────
    # 用 ^~ 而不是單純的前綴：nginx 的一般前綴 location 會輸給下面的正規表示式
    # location（它會匹配到 .js），那樣 vendor 就會被套上 no-cache，等於沒設。
    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 這一組必須重寫：本 location 有自己的 add_header，會捨棄 server 層的全部標頭
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # ── 程式碼與殼層：每次都要向伺服器確認，改版才會即時生效 ──────────────
    # 原本完全沒有 Cache-Control，瀏覽器只能靠 ETag/Last-Modified 猜；而每次部署都會
    # 重建映像檔、所有檔案的 mtime 與 ETag 都變 —— 即使 vendor 的內容一個位元都沒改，
    # 全部使用者仍要重新下載整包。上面的 immutable 就是為了解決這件事。
    # service-worker.js 也落在這條規則，本來就必須每次確認才能更新。
    location ~* \.(?:html|js|json|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        # 同上：不重寫的話，app.html 本身就完全沒有安全標頭 —— 正是最需要的那個檔案
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
